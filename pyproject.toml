[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-knowledge-graph"
version = "0.1.0"
description = "Turns a Python codebase into a live 3D knowledge graph and an MCP server Claude Code can query directly."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.2",
    "mcp>=1.0",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]

[project.scripts]
codegraph-mcp = "codegraph_mcp.server:main"
codegraph-flat-rag-mcp = "codegraph_mcp.flat_rag_server:main"
codegraph-viz = "codegraph.cli:visualize"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# these scripts insert src/ onto sys.path so they can be run directly
# without installing the package first, which needs the import to come
# after the path is set up
"src/codegraph_mcp/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
"experiments/**/*.py" = ["E402", "E501"]  # long natural-language question strings

[tool.mypy]
python_version = "3.10"
packages = ["codegraph", "codegraph_mcp"]
mypy_path = "src"
ignore_missing_imports = true
