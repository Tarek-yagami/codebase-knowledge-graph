[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-knowledge-graph"
version = "0.1.0"
description = "Turns a Python codebase into a live 3D knowledge graph and an MCP server Claude Code can query directly."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.2",
    "mcp>=1.0",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]

[project.scripts]
codegraph-mcp = "codegraph_mcp.server:main"
codegraph-flat-rag-mcp = "codegraph_mcp.flat_rag_server:main"
codegraph-viz = "codegraph.cli:visualize"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
