name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        # networkx + numpy + pytest only - the test suite doesn't touch
        # embeddings.py's actual model, so there's no need to pull in
        # sentence-transformers/torch here.
        run: pip install networkx numpy pytest

      - name: Run tests
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t codegraph-viz .
