name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        # The test suite doesn't touch embeddings.py's actual model, so
        # there's no need to pull in sentence-transformers/torch here.
        # Grammars download on first use, which the runner has network for.
        run: pip install networkx numpy tree-sitter-language-pack json5 pytest

      - name: Run tests
        run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # ignore_missing_imports covers mcp/sentence-transformers, no need to
      # install the heavy ones just to typecheck our own code against them
      - run: pip install networkx numpy tree-sitter-language-pack json5 mypy
      - run: mypy

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t codegraph-viz .
