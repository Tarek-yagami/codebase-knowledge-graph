f not zipfile.is_zipfile(archive):\n        return path\n\n    zip_file = zipfile.ZipFile(archive)\n    if member not in zip_file.namelist():\n        return path\n\n    # we have a valid zip archive and a valid member of that archive\n    suffix = os.path.splitext(member.split(\"/\")[-1])[-1]\n    fd, extracted_path = tempfile.mkstemp(suffix=suffix)\n    try:\n        os.write(fd, zip_file.read(member))\n    finally:\n        os.close(fd)\n\n    return extracted_path"}, {"id": "src/requests/utils.py::atomic_open", "kind": "function", "name": "atomic_open", "file": "src/requests/utils.py", "lineno": 329, "end_lineno": 338, "language": "python", "docstring": "Write a file to the disk in an atomic fashion", "source": "def atomic_open(filename: str) -> Generator[BufferedWriter, None, None]:\n    \"\"\"Write a file to the disk in an atomic fashion\"\"\"\n    tmp_descriptor, tmp_name = tempfile.mkstemp(dir=os.path.dirname(filename))\n    try:\n        with os.fdopen(tmp_descriptor, \"wb\") as tmp_handler:\n            yield tmp_handler\n        os.replace(tmp_name, filename)\n    except BaseException:\n        os.remove(tmp_name)\n        raise"}, {"id": "src/requests/utils.py::from_key_val_list", "kind": "function", "name": "from_key_val_list", "file": "src/requests/utils.py", "lineno": 341, "end_lineno": 367, "language": "python", "docstring": "Take an object and test to see if it can be represented as a\ndictionary. Unless it can not be represented as such, return an\nOrderedDict, e.g.,\n\n::\n\n    >>> from_key_val_list([('key', 'val')])\n    OrderedDict([('key', 'val')])\n    >>> from_key_val_list('string')\n    Traceback (most recent call last):\n    ...\n    ValueError: cannot encode objects that are not 2-tuples\n    >>> from_key_val_list({'key': 'val'})\n    OrderedDict([('key', 'val')])\n\n:rtype: OrderedDict", "source": "def from_key_val_list(\n    value: Mapping[Any, Any] | Iterable[tuple[Any, Any]] | None,\n) -> dict[Any, Any] | None:\n    \"\"\"Take an object and test to see if it can be represented as a\n    dictionary. Unless it can not be represented as such, return an\n    OrderedDict, e.g.,\n\n    ::\n\n        >>> from_key_val_list([('key', 'val')])\n        OrderedDict([('key', 'val')])\n        >>> from_key_val_list('string')\n        Traceback (most recent call last):\n        ...\n        ValueError: cannot encode objects that are not 2-tuples\n        >>> from_key_val_list({'key': 'val'})\n        OrderedDict([('key', 'val')])\n\n    :rtype: OrderedDict\n    \"\"\"\n    if value is None:\n        return None\n\n    if isinstance(value, (str, bytes, bool, int)):\n        raise ValueError(\"cannot encode objects that are not 2-tuples\")\n\n    return OrderedDict(value)"}, {"id": "src/requests/utils.py::to_key_val_list", "kind": "function", "name": "to_key_val_list", "file": "src/requests/utils.py", "lineno": 376, "end_lineno": 404, "language": "python", "docstring": "Take an object and test to see if it can be represented as a\ndictionary. If it can be, return a list of tuples, e.g.,\n\n::\n\n    >>> to_key_val_list([('key', 'val')])\n    [('key', 'val')]\n    >>> to_key_val_list({'key': 'val'})\n    [('key', 'val')]\n    >>> to_key_val_list('string')\n    Traceback (most recent call last):\n    ...\n    ValueError: cannot encode objects that are not 2-tuples\n\n:rtype: list", "source": "def to_key_val_list(\n    value: _t.SupportsItems[_KT, _VT] | Iterable[tuple[_KT, _VT]] | None,\n) -> list[tuple[_KT, _VT]] | None:\n    \"\"\"Take an object and test to see if it can be represented as a\n    dictionary. If it can be, return a list of tuples, e.g.,\n\n    ::\n\n        >>> to_key_val_list([('key', 'val')])\n        [('key', 'val')]\n        >>> to_key_val_list({'key': 'val'})\n        [('key', 'val')]\n        >>> to_key_val_list('string')\n        Traceback (most recent call last):\n        ...\n        ValueError: cannot encode objects that are not 2-tuples\n\n    :rtype: list\n    \"\"\"\n    if value is None:\n        return None\n\n    if isinstance(value, (str, bytes, bool, int)):\n        raise ValueError(\"cannot encode objects that are not 2-tuples\")\n\n    if isinstance(value, _SupportsItems):\n        return list(value.items())\n\n    return list(value)"}, {"id": "src/requests/utils.py::parse_list_header", "kind": "function", "name": "parse_list_header", "file": "src/requests/utils.py", "lineno": 408, "end_lineno": 436, "language": "python", "docstring": "Parse lists as described by RFC 2068 Section 2.\n\nIn particular, parse comma-separated lists where the elements of\nthe list may include quoted-strings.  A quoted-string could\ncontain a comma.  A non-quoted string could have quotes in the\nmiddle.  Quotes are removed automatically after parsing.\n\nIt basically works like :func:`parse_set_header` just that items\nmay appear multiple times and case sensitivity is preserved.\n\nThe return value is a standard :class:`list`:\n\n>>> parse_list_header('token, \"quoted value\"')\n['token', 'quoted value']\n\nTo create a header from the :class:`list` again, use the\n:func:`dump_header` function.\n\n:param value: a string with a list header.\n:return: :class:`list`\n:rtype: list", "source": "def parse_list_header(value: str) -> list[str]:\n    \"\"\"Parse lists as described by RFC 2068 Section 2.\n\n    In particular, parse comma-separated lists where the elements of\n    the list may include quoted-strings.  A quoted-string could\n    contain a comma.  A non-quoted string could have quotes in the\n    middle.  Quotes are removed automatically after parsing.\n\n    It basically works like :func:`parse_set_header` just that items\n    may appear multiple times and case sensitivity is preserved.\n\n    The return value is a standard :class:`list`:\n\n    >>> parse_list_header('token, \"quoted value\"')\n    ['token', 'quoted value']\n\n    To create a header from the :class:`list` again, use the\n    :func:`dump_header` function.\n\n    :param value: a string with a list header.\n    :return: :class:`list`\n    :rtype: list\n    \"\"\"\n    result: list[str] = []\n    for item in _parse_list_header(value):\n        if item[:1] == item[-1:] == '\"':\n            item = unquote_header_value(item[1:-1])\n        result.append(item)\n    return result"}, {"id": "src/requests/utils.py::parse_dict_header", "kind": "function", "name": "parse_dict_header", "file": "src/requests/utils.py", "lineno": 440, "end_lineno": 471, "language": "python", "docstring": "Parse lists of key, value pairs as described by RFC 2068 Section 2 and\nconvert them into a python dict:\n\n>>> d = parse_dict_header('foo=\"is a fish\", bar=\"as well\"')\n>>> type(d) is dict\nTrue\n>>> sorted(d.items())\n[('bar', 'as well'), ('foo', 'is a fish')]\n\nIf there is no value for a key it will be `None`:\n\n>>> parse_dict_header('key_without_value')\n{'key_without_value': None}\n\nTo create a header from the :class:`dict` again, use the\n:func:`dump_header` function.\n\n:param value: a string with a dict header.\n:return: :class:`dict`\n:rtype: dict", "source": "def parse_dict_header(value: str) -> dict[str, str | None]:\n    \"\"\"Parse lists of key, value pairs as described by RFC 2068 Section 2 and\n    convert them into a python dict:\n\n    >>> d = parse_dict_header('foo=\"is a fish\", bar=\"as well\"')\n    >>> type(d) is dict\n    True\n    >>> sorted(d.items())\n    [('bar', 'as well'), ('foo', 'is a fish')]\n\n    If there is no value for a key it will be `None`:\n\n    >>> parse_dict_header('key_without_value')\n    {'key_without_value': None}\n\n    To create a header from the :class:`dict` again, use the\n    :func:`dump_header` function.\n\n    :param value: a string with a dict header.\n    :return: :class:`dict`\n    :rtype: dict\n    \"\"\"\n    result: dict[str, str | None] = {}\n    for item in _parse_list_header(value):\n        if \"=\" not in item:\n            result[item] = None\n            continue\n        name, value = item.split(\"=\", 1)\n        if value[:1] == value[-1:] == '\"':\n            value = unquote_header_value(value[1:-1])\n        result[name] = value\n    return result"}, {"id": "src/requests/utils.py::unquote_header_value", "kind": "function", "name": "unquote_header_value", "file": "src/requests/utils.py", "lineno": 475, "end_lineno": 497, "language": "python", "docstring": "Unquotes a header value.  (Reversal of :func:`quote_header_value`).\nThis does not use the real unquoting but what browsers are actually\nusing for quoting.\n\n:param value: the header value to unquote.\n:rtype: str", "source": "def unquote_header_value(value: str, is_filename: bool = False) -> str:\n    r\"\"\"Unquotes a header value.  (Reversal of :func:`quote_header_value`).\n    This does not use the real unquoting but what browsers are actually\n    using for quoting.\n\n    :param value: the header value to unquote.\n    :rtype: str\n    \"\"\"\n    if value and value[0] == value[-1] == '\"':\n        # this is not the real unquoting, but fixing this so that the\n        # RFC is met will result in bugs with internet explorer and\n        # probably some other browsers as well.  IE for example is\n        # uploading files with \"C:\\foo\\bar.txt\" as filename\n        value = value[1:-1]\n\n        # if this is a filename and the starting characters look like\n        # a UNC path, then just return the value without quotes.  Using the\n        # replace sequence below on a UNC path has the effect of turning\n        # the leading double slash into a single slash and then\n        # _fix_ie_filename() doesn't work correctly.  See #458.\n        if not is_filename or value[:2] != \"\\\\\\\\\":\n            return value.replace(\"\\\\\\\\\", \"\\\\\").replace('\\\\\"', '\"')\n    return value"}, {"id": "src/requests/utils.py::dict_from_cookiejar", "kind": "function", "name": "dict_from_cookiejar", "file": "src/requests/utils.py", "lineno": 500, "end_lineno": 508, "language": "python", "docstring": "Returns a key/value dictionary from a CookieJar.\n\n:param cj: CookieJar object to extract cookies from.\n:rtype: dict", "source": "def dict_from_cookiejar(cj: CookieJar) -> dict[str, str | None]:\n    \"\"\"Returns a key/value dictionary from a CookieJar.\n\n    :param cj: CookieJar object to extract cookies from.\n    :rtype: dict\n    \"\"\"\n\n    cookie_dict = {cookie.name: cookie.value for cookie in cj}\n    return cookie_dict"}, {"id": "src/requests/utils.py::add_dict_to_cookiejar", "kind": "function", "name": "add_dict_to_cookiejar", "file": "src/requests/utils.py", "lineno": 511, "end_lineno": 519, "language": "python", "docstring": "Returns a CookieJar from a key/value dictionary.\n\n:param cj: CookieJar to insert cookies into.\n:param cookie_dict: Dict of key/values to insert into CookieJar.\n:rtype: CookieJar", "source": "def add_dict_to_cookiejar(cj: CookieJar, cookie_dict: dict[str, str]) -> CookieJar:\n    \"\"\"Returns a CookieJar from a key/value dictionary.\n\n    :param cj: CookieJar to insert cookies into.\n    :param cookie_dict: Dict of key/values to insert into CookieJar.\n    :rtype: CookieJar\n    \"\"\"\n\n    return cookiejar_from_dict(cookie_dict, cj)"}, {"id": "src/requests/utils.py::get_encodings_from_content", "kind": "function", "name": "get_encodings_from_content", "file": "src/requests/utils.py", "lineno": 522, "end_lineno": 544, "language": "python", "docstring": "Returns encodings from given content string.\n\n:param content: bytestring to extract encodings from.", "source": "def get_encodings_from_content(content: str) -> list[str]:\n    \"\"\"Returns encodings from given content string.\n\n    :param content: bytestring to extract encodings from.\n    \"\"\"\n    warnings.warn(\n        (\n            \"In requests 3.0, get_encodings_from_content will be removed. For \"\n            \"more information, please see the discussion on issue #2266. (This\"\n            \" warning should only appear once.)\"\n        ),\n        DeprecationWarning,\n    )\n\n    charset_re = re.compile(r'<meta.*?charset=[\"\\']*(.+?)[\"\\'>]', flags=re.I)\n    pragma_re = re.compile(r'<meta.*?content=[\"\\']*;?charset=(.+?)[\"\\'>]', flags=re.I)\n    xml_re = re.compile(r'^<\\?xml.*?encoding=[\"\\']*(.+?)[\"\\'>]')\n\n    return (\n        charset_re.findall(content)\n        + pragma_re.findall(content)\n        + xml_re.findall(content)\n    )"}, {"id": "src/requests/utils.py::_parse_content_type_header", "kind": "function", "name": "_parse_content_type_header", "file": "src/requests/utils.py", "lineno": 547, "end_lineno": 566, "language": "python", "docstring": "Returns content type and parameters from given header.\n\n:param header: string\n:return: tuple containing content type and dictionary of\n     parameters.", "source": "def _parse_content_type_header(header: str) -> tuple[str, dict[str, Any]]:\n    \"\"\"Returns content type and parameters from given header.\n\n    :param header: string\n    :return: tuple containing content type and dictionary of\n         parameters.\n    \"\"\"\n\n    tokens = header.split(\";\")\n    content_type, params = tokens[0].strip(), tokens[1:]\n    params_dict: dict[str, str | bool] = {}\n    strip_chars = \"\\\"' \"\n\n    for param in params:\n        param = param.strip()\n        if param and (idx := param.find(\"=\")) != -1:\n            key = param[:idx].strip(strip_chars)\n            value = param[idx + 1 :].strip(strip_chars)\n            params_dict[key.lower()] = value\n    return content_type, params_dict"}, {"id": "src/requests/utils.py::get_encoding_from_headers", "kind": "function", "name": "get_encoding_from_headers", "file": "src/requests/utils.py", "lineno": 569, "end_lineno": 591, "language": "python", "docstring": "Returns encodings from given HTTP Header Dict.\n\n:param headers: dictionary to extract encoding from.\n:rtype: str", "source": "def get_encoding_from_headers(headers: CaseInsensitiveDict[str]) -> str | None:\n    \"\"\"Returns encodings from given HTTP Header Dict.\n\n    :param headers: dictionary to extract encoding from.\n    :rtype: str\n    \"\"\"\n\n    content_type = headers.get(\"content-type\")\n\n    if not content_type:\n        return None\n\n    content_type, params = _parse_content_type_header(content_type)\n\n    if \"charset\" in params:\n        return params[\"charset\"].strip(\"'\\\"\")\n\n    if \"text\" in content_type:\n        return \"ISO-8859-1\"\n\n    if \"application/json\" in content_type:\n        # Assume UTF-8 based on RFC 4627: https://www.ietf.org/rfc/rfc4627.txt since the charset was unset\n        return \"utf-8\""}, {"id": "src/requests/utils.py::stream_decode_response_unicode", "kind": "function", "name": "stream_decode_response_unicode", "file": "src/requests/utils.py", "lineno": 594, "end_lineno": 610, "language": "python", "docstring": "Stream decodes an iterator.", "source": "def stream_decode_response_unicode(\n    iterator: Iterable[bytes], r: Response\n) -> Generator[str | bytes, None, None]:\n    \"\"\"Stream decodes an iterator.\"\"\"\n\n    if r.encoding is None:\n        yield from iterator\n        return\n\n    decoder = codecs.getincrementaldecoder(r.encoding)(errors=\"replace\")\n    for chunk in iterator:\n        rv = decoder.decode(chunk)\n        if rv:\n            yield rv\n    rv = decoder.decode(b\"\", final=True)\n    if rv:\n        yield rv"}, {"id": "src/requests/utils.py::iter_slices", "kind": "function", "name": "iter_slices", "file": "src/requests/utils.py", "lineno": 621, "end_lineno": 630, "language": "python", "docstring": "Iterate over slices of a string.", "source": "def iter_slices(\n    string: bytes | str, slice_length: int | None\n) -> Generator[bytes | str, None, None]:\n    \"\"\"Iterate over slices of a string.\"\"\"\n    pos = 0\n    if slice_length is None or slice_length <= 0:\n        slice_length = len(string)\n    while pos < len(string):\n        yield string[pos : pos + slice_length]\n        pos += slice_length"}, {"id": "src/requests/utils.py::get_unicode_from_response", "kind": "function", "name": "get_unicode_from_response", "file": "src/requests/utils.py", "lineno": 633, "end_lineno": 671, "language": "python", "docstring": "Returns the requested content back in unicode.\n\n:param r: Response object to get unicode content from.\n\nTried:\n\n1. charset from content-type\n2. fall back and replace all unicode characters\n\n:rtype: str", "source": "def get_unicode_from_response(r: Response) -> str | bytes | None:\n    \"\"\"Returns the requested content back in unicode.\n\n    :param r: Response object to get unicode content from.\n\n    Tried:\n\n    1. charset from content-type\n    2. fall back and replace all unicode characters\n\n    :rtype: str\n    \"\"\"\n    warnings.warn(\n        (\n            \"In requests 3.0, get_unicode_from_response will be removed. For \"\n            \"more information, please see the discussion on issue #2266. (This\"\n            \" warning should only appear once.)\"\n        ),\n        DeprecationWarning,\n    )\n    if r.content is None:  # type: ignore[reportUnnecessaryComparison]\n        return None\n\n    tried_encodings: list[str] = []\n\n    # Try charset from content-type\n    encoding = get_encoding_from_headers(r.headers)\n\n    if encoding:\n        try:\n            return str(r.content, encoding)\n        except UnicodeError:\n            tried_encodings.append(encoding)\n\n    # Fall back:\n    try:\n        return str(r.content, encoding or \"utf-8\", errors=\"replace\")\n    except TypeError:\n        return r.content"}, {"id": "src/requests/utils.py::unquote_unreserved", "kind": "function", "name": "unquote_unreserved", "file": "src/requests/utils.py", "lineno": 680, "end_lineno": 701, "language": "python", "docstring": "Un-escape any percent-escape sequences in a URI that are unreserved\ncharacters. This leaves all reserved, illegal and non-ASCII bytes encoded.\n\n:rtype: str", "source": "def unquote_unreserved(uri: str) -> str:\n    \"\"\"Un-escape any percent-escape sequences in a URI that are unreserved\n    characters. This leaves all reserved, illegal and non-ASCII bytes encoded.\n\n    :rtype: str\n    \"\"\"\n    parts = uri.split(\"%\")\n    for i in range(1, len(parts)):\n        h = parts[i][0:2]\n        if len(h) == 2 and h.isalnum():\n            try:\n                c = chr(int(h, 16))\n            except ValueError:\n                raise InvalidURL(f\"Invalid percent-escape sequence: '{h}'\")\n\n            if c in UNRESERVED_SET:\n                parts[i] = c + parts[i][2:]\n            else:\n                parts[i] = f\"%{parts[i]}\"\n        else:\n            parts[i] = f\"%{parts[i]}\"\n    return \"\".join(parts)"}, {"id": "src/requests/utils.py::requote_uri", "kind": "function", "name": "requote_uri", "file": "src/requests/utils.py", "lineno": 704, "end_lineno": 723, "language": "python", "docstring": "Re-quote the given URI.\n\nThis function passes the given URI through an unquote/quote cycle to\nensure that it is fully and consistently quoted.\n\n:rtype: str", "source": "def requote_uri(uri: str) -> str:\n    \"\"\"Re-quote the given URI.\n\n    This function passes the given URI through an unquote/quote cycle to\n    ensure that it is fully and consistently quoted.\n\n    :rtype: str\n    \"\"\"\n    safe_with_percent = \"!#$%&'()*+,/:;=?@[]~\"\n    safe_without_percent = \"!#$&'()*+,/:;=?@[]~\"\n    try:\n        # Unquote only the unreserved characters\n        # Then quote only illegal characters (do not quote reserved,\n        # unreserved, or '%')\n        return quote(unquote_unreserved(uri), safe=safe_with_percent)\n    except InvalidURL:\n        # We couldn't unquote the given URI, so let's try quoting it, but\n        # there may be unquoted '%'s in the URI. We need to make sure they're\n        # properly quoted so they do not cause issues elsewhere.\n        return quote(uri, safe=safe_without_percent)"}, {"id": "src/requests/utils.py::address_in_network", "kind": "function", "name": "address_in_network", "file": "src/requests/utils.py", "lineno": 726, "end_lineno": 738, "language": "python", "docstring": "This function allows you to check if an IP belongs to a network subnet\n\nExample: returns True if ip = 192.168.1.1 and net = 192.168.1.0/24\n         returns False if ip = 192.168.1.1 and net = 192.168.100.0/24\n\n:rtype: bool", "source": "def address_in_network(ip: str, net: str) -> bool:\n    \"\"\"This function allows you to check if an IP belongs to a network subnet\n\n    Example: returns True if ip = 192.168.1.1 and net = 192.168.1.0/24\n             returns False if ip = 192.168.1.1 and net = 192.168.100.0/24\n\n    :rtype: bool\n    \"\"\"\n    ipaddr = struct.unpack(\"=L\", socket.inet_aton(ip))[0]\n    netaddr, bits = net.split(\"/\")\n    netmask = struct.unpack(\"=L\", socket.inet_aton(dotted_netmask(int(bits))))[0]\n    network = struct.unpack(\"=L\", socket.inet_aton(netaddr))[0] & netmask\n    return (ipaddr & netmask) == (network & netmask)"}, {"id": "src/requests/utils.py::dotted_netmask", "kind": "function", "name": "dotted_netmask", "file": "src/requests/utils.py", "lineno": 741, "end_lineno": 749, "language": "python", "docstring": "Converts mask from /xx format to xxx.xxx.xxx.xxx\n\nExample: if mask is 24 function returns 255.255.255.0\n\n:rtype: str", "source": "def dotted_netmask(mask: int) -> str:\n    \"\"\"Converts mask from /xx format to xxx.xxx.xxx.xxx\n\n    Example: if mask is 24 function returns 255.255.255.0\n\n    :rtype: str\n    \"\"\"\n    bits = 0xFFFFFFFF ^ (1 << 32 - mask) - 1\n    return socket.inet_ntoa(struct.pack(\">I\", bits))"}, {"id": "src/requests/utils.py::is_ipv4_address", "kind": "function", "name": "is_ipv4_address", "file": "src/requests/utils.py", "lineno": 752, "end_lineno": 760, "language": "python", "docstring": ":rtype: bool", "source": "def is_ipv4_address(string_ip: str) -> bool:\n    \"\"\"\n    :rtype: bool\n    \"\"\"\n    try:\n        socket.inet_aton(string_ip)\n    except OSError:\n        return False\n    return True"}, {"id": "src/requests/utils.py::is_valid_cidr", "kind": "function", "name": "is_valid_cidr", "file": "src/requests/utils.py", "lineno": 763, "end_lineno": 784, "language": "python", "docstring": "Very simple check of the cidr format in no_proxy variable.\n\n:rtype: bool", "source": "def is_valid_cidr(string_network: str) -> bool:\n    \"\"\"\n    Very simple check of the cidr format in no_proxy variable.\n\n    :rtype: bool\n    \"\"\"\n    if string_network.count(\"/\") == 1:\n        try:\n            mask = int(string_network.split(\"/\")[1])\n        except ValueError:\n            return False\n\n        if mask < 1 or mask > 32:\n            return False\n\n        try:\n            socket.inet_aton(string_network.split(\"/\")[0])\n        except OSError:\n            return False\n    else:\n        return False\n    return True"}, {"id": "src/requests/utils.py::set_environ", "kind": "function", "name": "set_environ", "file": "src/requests/utils.py", "lineno": 788, "end_lineno": 807, "language": "python", "docstring": "Set the environment variable 'env_name' to 'value'\n\nSave previous value, yield, and then restore the previous value stored in\nthe environment variable 'env_name'.\n\nIf 'value' is None, do nothing", "source": "def set_environ(env_name: str, value: str | None) -> Generator[None, None, None]:\n    \"\"\"Set the environment variable 'env_name' to 'value'\n\n    Save previous value, yield, and then restore the previous value stored in\n    the environment variable 'env_name'.\n\n    If 'value' is None, do nothing\"\"\"\n    value_changed = value is not None\n    old_value: str | None = None\n    if value_changed:\n        old_value = os.environ.get(env_name)\n        os.environ[env_name] = value\n    try:\n        yield\n    finally:\n        if value_changed:\n            if old_value is None:\n                del os.environ[env_name]\n            else:\n                os.environ[env_name] = old_value"}, {"id": "src/requests/utils.py::should_bypass_proxies", "kind": "function", "name": "should_bypass_proxies", "file": "src/requests/utils.py", "lineno": 810, "end_lineno": 870, "language": "python", "docstring": "Returns whether we should bypass proxies or not.\n\n:rtype: bool", "source": "def should_bypass_proxies(url: str, no_proxy: str | None) -> bool:\n    \"\"\"\n    Returns whether we should bypass proxies or not.\n\n    :rtype: bool\n    \"\"\"\n\n    # Prioritize lowercase environment variables over uppercase\n    # to keep a consistent behaviour with other http projects (curl, wget).\n    def get_proxy(key: str) -> str | None:\n        return os.environ.get(key) or os.environ.get(key.upper())\n\n    # First check whether no_proxy is defined. If it is, check that the URL\n    # we're getting isn't in the no_proxy list.\n    no_proxy_arg = no_proxy\n    if no_proxy is None:\n        no_proxy = get_proxy(\"no_proxy\")\n    parsed = urlparse(url)\n    hostname = parsed.hostname\n\n    if hostname is None:\n        # URLs don't always have hostnames, e.g. file:/// urls.\n        return True\n\n    if no_proxy:\n        # We need to check whether we match here. We need to see if we match\n        # the end of the hostname, both with and without the port.\n        no_proxy_hosts = (host for host in no_proxy.replace(\" \", \"\").split(\",\") if host)\n\n        if is_ipv4_address(hostname):\n            for proxy_ip in no_proxy_hosts:\n                if is_valid_cidr(proxy_ip):\n                    if address_in_network(hostname, proxy_ip):\n                        return True\n                elif hostname == proxy_ip:\n                    # If no_proxy ip was defined in plain IP notation instead of cidr notation &\n                    # matches the IP of the index\n                    return True\n        el"}, {"id": "src/requests/utils.py::should_bypass_proxies.get_proxy", "kind": "function", "name": "get_proxy", "file": "src/requests/utils.py", "lineno": 819, "end_lineno": 820, "language": "python", "docstring": "", "source": "    def get_proxy(key: str) -> str | None:\n        return os.environ.get(key) or os.environ.get(key.upper())"}, {"id": "src/requests/utils.py::get_environ_proxies", "kind": "function", "name": "get_environ_proxies", "file": "src/requests/utils.py", "lineno": 873, "end_lineno": 882, "language": "python", "docstring": "Return a dict of environment proxies.\n\n:rtype: dict", "source": "def get_environ_proxies(url: str, no_proxy: str | None = None) -> dict[str, str]:\n    \"\"\"\n    Return a dict of environment proxies.\n\n    :rtype: dict\n    \"\"\"\n    if should_bypass_proxies(url, no_proxy=no_proxy):\n        return {}\n    else:\n        return getproxies()"}, {"id": "src/requests/utils.py::select_proxy", "kind": "function", "name": "select_proxy", "file": "src/requests/utils.py", "lineno": 885, "end_lineno": 908, "language": "python", "docstring": "Select a proxy for the url, if applicable.\n\n:param url: The url being for the request\n:param proxies: A dictionary of schemes or schemes and hosts to proxy URLs", "source": "def select_proxy(url: str, proxies: dict[str, str] | None) -> str | None:\n    \"\"\"Select a proxy for the url, if applicable.\n\n    :param url: The url being for the request\n    :param proxies: A dictionary of schemes or schemes and hosts to proxy URLs\n    \"\"\"\n    proxies = proxies or {}\n    urlparts = urlparse(url)\n    if urlparts.hostname is None:\n        return proxies.get(urlparts.scheme, proxies.get(\"all\"))\n\n    proxy_keys = [\n        urlparts.scheme + \"://\" + urlparts.hostname,\n        urlparts.scheme,\n        \"all://\" + urlparts.hostname,\n        \"all\",\n    ]\n    proxy = None\n    for proxy_key in proxy_keys:\n        if proxy_key in proxies:\n            proxy = proxies[proxy_key]\n            break\n\n    return proxy"}, {"id": "src/requests/utils.py::resolve_proxies", "kind": "function", "name": "resolve_proxies", "file": "src/requests/utils.py", "lineno": 911, "end_lineno": 939, "language": "python", "docstring": "This method takes proxy information from a request and configuration\ninput to resolve a mapping of target proxies. This will consider settings\nsuch as NO_PROXY to strip proxy configurations.\n\n:param request: Request or PreparedRequest\n:param proxies: A dictionary of schemes or schemes and hosts to proxy URLs\n:param trust_env: Boolean declaring whether to trust environment configs\n\n:rtype: dict", "source": "def resolve_proxies(\n    request: Request | PreparedRequest,\n    proxies: dict[str, str] | None,\n    trust_env: bool = True,\n) -> dict[str, str]:\n    \"\"\"This method takes proxy information from a request and configuration\n    input to resolve a mapping of target proxies. This will consider settings\n    such as NO_PROXY to strip proxy configurations.\n\n    :param request: Request or PreparedRequest\n    :param proxies: A dictionary of schemes or schemes and hosts to proxy URLs\n    :param trust_env: Boolean declaring whether to trust environment configs\n\n    :rtype: dict\n    \"\"\"\n    proxies = proxies if proxies is not None else {}\n    url = cast(str, request.url)\n    scheme = urlparse(url).scheme\n    no_proxy = proxies.get(\"no_proxy\")\n    new_proxies = proxies.copy()\n\n    if trust_env and not should_bypass_proxies(url, no_proxy=no_proxy):\n        environ_proxies = get_environ_proxies(url, no_proxy=no_proxy)\n\n        proxy = environ_proxies.get(scheme, environ_proxies.get(\"all\"))\n\n        if proxy:\n            new_proxies.setdefault(scheme, proxy)\n    return new_proxies"}, {"id": "src/requests/utils.py::default_user_agent", "kind": "function", "name": "default_user_agent", "file": "src/requests/utils.py", "lineno": 942, "end_lineno": 948, "language": "python", "docstring": "Return a string representing the default user agent.\n\n:rtype: str", "source": "def default_user_agent(name: str = \"python-requests\") -> str:\n    \"\"\"\n    Return a string representing the default user agent.\n\n    :rtype: str\n    \"\"\"\n    return f\"{name}/{__version__}\""}, {"id": "src/requests/utils.py::default_headers", "kind": "function", "name": "default_headers", "file": "src/requests/utils.py", "lineno": 951, "end_lineno": 962, "language": "python", "docstring": ":rtype: requests.structures.CaseInsensitiveDict", "source": "def default_headers() -> CaseInsensitiveDict[str]:\n    \"\"\"\n    :rtype: requests.structures.CaseInsensitiveDict\n    \"\"\"\n    return CaseInsensitiveDict(\n        {\n            \"User-Agent\": default_user_agent(),\n            \"Accept-Encoding\": DEFAULT_ACCEPT_ENCODING,\n            \"Accept\": \"*/*\",\n            \"Connection\": \"keep-alive\",\n        }\n    )"}, {"id": "src/requests/utils.py::parse_header_links", "kind": "function", "name": "parse_header_links", "file": "src/requests/utils.py", "lineno": 965, "end_lineno": 999, "language": "python", "docstring": "Return a list of parsed link headers proxies.\n\ni.e. Link: <http:/.../front.jpeg>; rel=front; type=\"image/jpeg\",<http://.../back.jpeg>; rel=back;type=\"image/jpeg\"\n\n:rtype: list", "source": "def parse_header_links(value: str) -> list[dict[str, str]]:\n    \"\"\"Return a list of parsed link headers proxies.\n\n    i.e. Link: <http:/.../front.jpeg>; rel=front; type=\"image/jpeg\",<http://.../back.jpeg>; rel=back;type=\"image/jpeg\"\n\n    :rtype: list\n    \"\"\"\n\n    links: list[dict[str, str]] = []\n\n    replace_chars = \" '\\\"\"\n\n    value = value.strip(replace_chars)\n    if not value:\n        return links\n\n    for val in re.split(\", *<\", value):\n        try:\n            url, params = val.split(\";\", 1)\n        except ValueError:\n            url, params = val, \"\"\n\n        link: dict[str, str] = {\"url\": url.strip(\"<> '\\\"\")}\n\n        for param in params.split(\";\"):\n            try:\n                key, value = param.split(\"=\")\n            except ValueError:\n                break\n\n            link[key.strip(replace_chars)] = value.strip(replace_chars)\n\n        links.append(link)\n\n    return links"}, {"id": "src/requests/utils.py::guess_json_utf", "kind": "function", "name": "guess_json_utf", "file": "src/requests/utils.py", "lineno": 1008, "end_lineno": 1037, "language": "python", "docstring": ":rtype: str", "source": "def guess_json_utf(data: bytes) -> str | None:\n    \"\"\"\n    :rtype: str\n    \"\"\"\n    # JSON always starts with two ASCII characters, so detection is as\n    # easy as counting the nulls and from their location and count\n    # determine the encoding. Also detect a BOM, if present.\n    sample = data[:4]\n    if sample in (codecs.BOM_UTF32_LE, codecs.BOM_UTF32_BE):\n        return \"utf-32\"  # BOM included\n    if sample[:3] == codecs.BOM_UTF8:\n        return \"utf-8-sig\"  # BOM included, MS style (discouraged)\n    if sample[:2] in (codecs.BOM_UTF16_LE, codecs.BOM_UTF16_BE):\n        return \"utf-16\"  # BOM included\n    nullcount = sample.count(_null)\n    if nullcount == 0:\n        return \"utf-8\"\n    if nullcount == 2:\n        if sample[::2] == _null2:  # 1st and 3rd are null\n            return \"utf-16-be\"\n        if sample[1::2] == _null2:  # 2nd and 4th are null\n            return \"utf-16-le\"\n        # Did not detect 2 valid UTF-16 ascii-range characters\n    if nullcount == 3:\n        if sample[:3] == _null3:\n            return \"utf-32-be\"\n        if sample[1:] == _null3:\n            return \"utf-32-le\"\n        # Did not detect a valid UTF-32 ascii-range character\n    return None"}, {"id": "src/requests/utils.py::prepend_scheme_if_needed", "kind": "function", "name": "prepend_scheme_if_needed", "file": "src/requests/utils.py", "lineno": 1040, "end_lineno": 1067, "language": "python", "docstring": "Given a URL that may or may not have a scheme, prepend the given scheme.\nDoes not replace a present scheme with the one provided as an argument.\n\n:rtype: str", "source": "def prepend_scheme_if_needed(url: str, new_scheme: str) -> str:\n    \"\"\"Given a URL that may or may not have a scheme, prepend the given scheme.\n    Does not replace a present scheme with the one provided as an argument.\n\n    :rtype: str\n    \"\"\"\n    parsed = parse_url(url)\n    scheme, auth, _host, _port, path, query, fragment = parsed\n\n    # A defect in urlparse determines that there isn't a netloc present in some\n    # urls. We previously assumed parsing was overly cautious, and swapped the\n    # netloc and path. Due to a lack of tests on the original defect, this is\n    # maintained with parse_url for backwards compatibility.\n    netloc = parsed.netloc\n    if not netloc:\n        netloc, path = path, netloc\n\n    if auth:\n        # parse_url doesn't provide the netloc with auth\n        # so we'll add it ourselves.\n        netloc = cast(str, netloc)\n        netloc = \"@\".join([auth, netloc])\n    if scheme is None:\n        scheme = new_scheme\n    if path is None:\n        path = \"\"\n\n    return urlunparse((scheme, netloc, path, \"\", query, fragment))"}, {"id": "src/requests/utils.py::get_auth_from_url", "kind": "function", "name": "get_auth_from_url", "file": "src/requests/utils.py", "lineno": 1070, "end_lineno": 1084, "language": "python", "docstring": "Given a url with authentication components, extract them into a tuple of\nusername,password.\n\n:rtype: (str,str)", "source": "def get_auth_from_url(url: str) -> tuple[str, str]:\n    \"\"\"Given a url with authentication components, extract them into a tuple of\n    username,password.\n\n    :rtype: (str,str)\n    \"\"\"\n    parsed = urlparse(url)\n\n    try:\n        # except handles parsed.username/password being None\n        auth = (unquote(parsed.username), unquote(parsed.password))  # type: ignore[arg-type]\n    except (AttributeError, TypeError):\n        auth = (\"\", \"\")\n\n    return auth"}, {"id": "src/requests/utils.py::check_header_validity", "kind": "function", "name": "check_header_validity", "file": "src/requests/utils.py", "lineno": 1087, "end_lineno": 1095, "language": "python", "docstring": "Verifies that header parts don't contain leading whitespace\nreserved characters, or return characters.\n\n:param header: tuple, in the format (name, value).", "source": "def check_header_validity(header: tuple[str | bytes, str | bytes]) -> None:\n    \"\"\"Verifies that header parts don't contain leading whitespace\n    reserved characters, or return characters.\n\n    :param header: tuple, in the format (name, value).\n    \"\"\"\n    name, value = header\n    _validate_header_part(header, name, 0)\n    _validate_header_part(header, value, 1)"}, {"id": "src/requests/utils.py::_validate_header_part", "kind": "function", "name": "_validate_header_part", "file": "src/requests/utils.py", "lineno": 1098, "end_lineno": 1119, "language": "python", "docstring": "", "source": "def _validate_header_part(\n    header: tuple[str | bytes, str | bytes],\n    header_part: str | bytes,\n    header_validator_index: int,\n) -> None:\n    if isinstance(header_part, str):\n        validator = _HEADER_VALIDATORS_STR[header_validator_index]\n    elif isinstance(header_part, bytes):\n        # runtime guard for non-str/bytes input\n        validator = _HEADER_VALIDATORS_BYTE[header_validator_index]\n    else:\n        raise InvalidHeader(\n            f\"Header part ({header_part!r}) from {header} \"\n            f\"must be of type str or bytes, not {type(header_part)}\"\n        )\n\n    if not validator.match(header_part):  # type: ignore[arg-type]\n        header_kind = \"name\" if header_validator_index == 0 else \"value\"\n        raise InvalidHeader(\n            f\"Invalid leading whitespace, reserved character(s), or return \"\n            f\"character(s) in header {header_kind}: {header_part!r}\"\n        )"}, {"id": "src/requests/utils.py::urldefragauth", "kind": "function", "name": "urldefragauth", "file": "src/requests/utils.py", "lineno": 1122, "end_lineno": 1136, "language": "python", "docstring": "Given a url remove the fragment and the authentication part.\n\n:rtype: str", "source": "def urldefragauth(url: str) -> str:\n    \"\"\"\n    Given a url remove the fragment and the authentication part.\n\n    :rtype: str\n    \"\"\"\n    scheme, netloc, path, params, query, _fragment = urlparse(url)\n\n    # see func:`prepend_scheme_if_needed`\n    if not netloc:\n        netloc, path = path, netloc\n\n    netloc = netloc.rsplit(\"@\", 1)[-1]\n\n    return urlunparse((scheme, netloc, path, params, query, \"\"))"}, {"id": "src/requests/utils.py::rewind_body", "kind": "function", "name": "rewind_body", "file": "src/requests/utils.py", "lineno": 1139, "end_lineno": 1155, "language": "python", "docstring": "Move file pointer back to its recorded starting position\nso it can be read again on redirect.", "source": "def rewind_body(prepared_request: PreparedRequest) -> None:\n    \"\"\"Move file pointer back to its recorded starting position\n    so it can be read again on redirect.\n    \"\"\"\n    body_seek = getattr(prepared_request.body, \"seek\", None)\n    if body_seek is not None and isinstance(\n        prepared_request._body_position,\n        integer_types,\n    ):\n        try:\n            body_seek(prepared_request._body_position)\n        except OSError:\n            raise UnrewindableBodyError(\n                \"An error occurred when rewinding request body for redirect.\"\n            )\n    else:\n        raise UnrewindableBodyError(\"Unable to rewind request body for redirect.\")"}], "links": [{"source": "src/requests/__init__.py", "target": "src/requests/__init__.py::check_compatibility", "kind": "defines"}, {"source": "src/requests/__init__.py", "target": "src/requests/__init__.py::_check_cryptography", "kind": "defines"}, {"source": "src/requests/__init__.py", "target": "src/requests/exceptions.py", "kind": "imports"}, {"source": "src/requests/__init__.py", "target": "s ls.py::resolve_proxies", "kind": "defines"}, {"source": "src/requests/utils.py", "target": "src/requests/utils.py::default_user_agent", "kind": "defines"}, {"source": "src/requests/utils.py", "target": "src/requests/utils.py::default_headers", "kind": "defines"}, {"source": "src/requests/utils.py", "target": "src/requests/utils.py::parse_header_links", "kind": "defines"}, {"source": "src/requests/utils.py", "target": "src/requests/utils.py::guess_json_utf", "kind": "defines"}, {"source": "src/requests/utils.py", "target": "src/requests/utils.py::prepend_scheme_if_needed", "kind": "defines"}, {"source": "src/requests/utils.py", "target": "src/requests/utils.py::get_auth_from_url", "kind": "defines"}, {"source": "src/requests/utils.py", "target": "src/requests/utils.py::check_header_validity", "kind": "defines"}, {"source": "src/requests/utils.py", "target": "src/requests/utils.py::_validate_header_part", "kind": "defines"}, {"source": "src/requests/utils.py", "target": "src/requests/utils.py::urldefragauth", "kind": "defines"}, {"source": "src/requests/utils.py", "target": "src/requests/utils.py::rewind_body", "kind": "defines"}, {"source": "src/requests/utils.py", "target": "src/requests/certs.py", "kind": "imports"}, {"source": "src/requests/utils.py", "target": "src/requests/__version__.py", "kind": "imports"}, {"source": "src/requests/utils.py", "target": "src/requests/_internal_utils.py", "kind": "imports"}, {"source": "src/requests/utils.py", "target": "src/requests/_types.py", "kind": "imports"}, {"source": "src/requests/utils.py", "target": "src/requests/compat.py", "kind": "imports"}, {"source": "src/requests/utils.py", "target": "src/requests/cookies.py", "kind": "imports"}, {"source": "src/requests/utils.py", "target": "src/requests/exceptions.py", "kind": "imports"}, {"source": "src/requests/utils.py", "target": "src/requests/structures.py", "kind": "imports"}, {"source": "src/requests/utils.py", "target": "src/requests/models.py", "kind": "imports"}, {"s s/utils.py::should_bypass_proxies", "target": "src/requests/utils.py::address_in_network", "kind": "calls"}, {"source": "src/requests/utils.py::get_environ_proxies", "target": "src/requests/utils.py::should_bypass_proxies", "kind": "calls"}, {"source": "src/requests/utils.py::resolve_proxies", "target": "src/requests/utils.py::get_environ_proxies", "kind": "calls"}, {"source": "src/requests/utils.py::resolve_proxies", "target": "src/requests/utils.py::should_bypass_proxies", "kind": "calls"}, {"source": "src/requests/utils.py::default_headers", "target": "src/requests/structures.py::CaseInsensitiveDict", "kind": "calls"}, {"source": "src/requests/utils.py::default_headers", "target": "src/requests/utils.py::default_user_agent", "kind": "calls"}, {"source": "src/requests/utils.py::check_header_validity", "target": "src/requests/utils.py::_validate_header_part", "kind": "calls"}, {"source": "src/requests/utils.py::_validate_header_part", "target": "src/requests/exceptions.py::InvalidHeader", "kind": "calls"}, {"source": "src/requests/utils.py::rewind_body", "target": "src/requests/exceptions.py::UnrewindableBodyError", "kind": "calls"}]};

const COLOR = { module: '#4c9aff', class: '#ffab4c', function: '#57d48f' };
const SIZE = { module: 9, class: 6, function: 3.5 };

const allNodes = new Map(DATA.nodes.map(n => [n.id, n]));
const allLinks = DATA.links;

// children via "defines" edges
const childrenOf = new Map();
for (const l of allLinks) {
  if (l.kind === 'defines') {
    if (!childrenOf.has(l.source)) childrenOf.set(l.source, []);
    childrenOf.get(l.source).push(l.target);
  }
}

// Navigation is a stack of scopes, root = []. Only the CURRENT scope's
// children are ever in the scene at once - entering a node replaces the
// whole scene with just that node's contents, like stepping into its own
// self-contained world, rather than accumulating everything ever expanded.
const scopeStack = [];

function currentScopeId() {
  return scopeStack.length ? scopeStack[scopeStack.length - 1] : null;
}

function scopeChildren(scopeId) {
  if (scopeId === null) return DATA.nodes.filter(n => n.kind === 'module').map(n => n.id);
  return childrenOf.get(scopeId) || [];
}

function endpointId(x) {
  // 3d-force-graph mutates link.source/target from a plain id string into
  // the actual node object the first time it renders that link - normalize
  // back to the id so visibility checks keep working after that mutation.
  return (x && typeof x === 'object') ? x.id : x;
}

function sceneDataFor(scopeId) {
  const ids = new Set(scopeChildren(scopeId));
  const nodes = [...ids].map(id => allNodes.get(id));
  // Fresh link objects every time: 3d-force-graph mutates link.source/target
  // into node references on first render, and reusing link objects across
  // scope switches mixes plain strings with mutated ones in one batch,
  // which makes links silently fail to attach to a visible node.
  const links = allLinks
    .filter(l => l.kind !== 'defines' && ids.has(endpointId(l.source)) && ids.has(endpointId(l.target)))
    .map(l => ({ source: endpointId(l.source), target: endpointId(l.target), kind: l.kind }));

  // Integrity check: if a link's endpoints ever aren't in the current node
  // set, surface it as a visible on-screen warning rather than a silent
  // rendering glitch.
  const nodeIdSet = new Set(nodes.map(n => n.id));
  const bad = links.filter(l => !nodeIdSet.has(l.source) || !nodeIdSet.has(l.target));
  const warningEl = document.getElementById('warning');
  if (bad.length) {
    console.error('DANGLING LINKS', bad);
    warningEl.textContent = `⚠ ${bad.length} dangling link(s) in this scope - see browser console for details`;
    warningEl.style.display = 'block';
  } else {
    warningEl.style.display = 'none';
  }

  return { nodes, links };
}

const highlightNodes = new Set();
const highlightLinks = new Set();

const NODE_BASE_OPACITY = 0.95;
const LINK_BASE_OPACITY = 0.85;
const LINK_DIMMED_OPACITY = 0.05;
// Deliberately far from the node-kind colors (blue/orange/green) so lines
// are never confused with the node kind they connect.
const LINK_COLOR = { imports: '#b98fff', inherits: '#ff8fd6', calls: '#5ad8d8' };

const Graph = ForceGraph3D()(document.getElementById('graph'))
  .backgroundColor('#0a0d14')
  .nodeRelSize(4)
  .graphData(sceneDataFor(null))
  .nodeId('id')
  .nodeLabel(n => `${n.kind}: ${n.name}`)
  .nodeColor(n => highlightNodes.size && !highlightNodes.has(n) ? 'rgba(120,125,140,0.25)' : (COLOR[n.kind] || '#cccccc'))
  .nodeVal(n => SIZE[n.kind] || 2)
  .nodeOpacity(NODE_BASE_OPACITY)
  .linkColor(l => highlightLinks.has(l) ? '#ffffff' : (LINK_COLOR[l.kind] || '#5ad8d8'))
  .linkOpacity(l => highlightLinks.size && !highlightLinks.has(l) ? LINK_DIMMED_OPACITY : LINK_BASE_OPACITY)
  .linkWidth(l => highlightLinks.has(l) ? 3 : 1.1)
  .linkDirectionalParticles(l => highlightLinks.has(l) ? 3 : 1)
  .linkDirectionalParticleWidth(l => highlightLinks.has(l) ? 2.6 : 1.6)
  .linkDirectionalParticleSpeed(0.006)
  .onNodeClick(node => {
    showPanel(node);
    if (childrenOf.has(node.id)) {
      scopeStack.push(node.id);
      renderScope();
    }
  })
  .onBackgroundClick(() => {
    // clicking the shell / empty space around it steps back up a level
    if (scopeStack.length) goBack();
  })
  .onNodeHover(node => {
    highlightNodes.clear();
    highlightLinks.clear();
    if (node) {
      highlightNodes.add(node);
      Graph.graphData().links.forEach(l => {
        if (endpointId(l.source) === node.id || endpointId(l.target) === node.id) {
          highlightLinks.add(l);
          highlightNodes.add(allNodes.get(endpointId(l.source)));
          highlightNodes.add(allNodes.get(endpointId(l.target)));
        }
      });
    }
    Graph.nodeColor(Graph.nodeColor()).linkColor(Graph.linkColor())
      .linkOpacity(Graph.linkOpacity()).linkWidth(Graph.linkWidth())
      .linkDirectionalParticles(Graph.linkDirectionalParticles());
    document.getElementById('graph').style.cursor = node ? 'pointer' : 'default';
  })
let hasInitialFit = false;
Graph.onEngineStop(() => {
  if (!hasInitialFit && currentScopeId() === null) {
    hasInitialFit = true;
    Graph.zoomToFit(500, 70);
  }
});

// The "world shell": a translucent sphere (seen from inside, via BackSide)
// plus a wireframe cage, standing in for "you are now inside this node."
// Only exists while inside a scope - the root overview has no shell.
let shellMesh = null;
let shellWire = null;

function clearShell() {
  if (shellMesh) { Graph.scene().remove(shellMesh); shellMesh = null; }
  if (shellWire) { Graph.scene().remove(shellWire); shellWire = null; }
}

function buildShell(childCount) {
  clearShell();
  const radius = 55 + Math.sqrt(childCount) * 14;

  // depthWrite: false + low renderOrder - the shell is a purely visual aura
  // and must never occlude anything behind it. Without this, opaque nodes
  // get correctly hidden by the shell while edges ignore its depth
  // entirely, an inconsistency that reads as edges with no visible node.
  const fillGeo = new THREE.SphereGeometry(radius, 32, 24);
  const fillMat = new THREE.MeshBasicMaterial({
    color: 0x2d5bb8, transparent: true, opacity: 0.07, side: THREE.DoubleSide, depthWrite: false,
  });
  shellMesh = new THREE.Mesh(fillGeo, fillMat);
  shellMesh.renderOrder = -1;
  Graph.scene().add(shellMesh);

  const wireGeo = new THREE.SphereGeometry(radius, 16, 10);
  const wireMat = new THREE.MeshBasicMaterial({
    color: 0x4c9aff, wireframe: true, transparent: true, opacity: 0.22, depthWrite: false,
  });
  shellWire = new THREE.Mesh(wireGeo, wireMat);
  shellWire.renderOrder = -1;
  Graph.scene().add(shellWire);

  return radius;
}

// Keeps nodes from drifting past the shell wall - d3-force's charge/link
// forces alone have no boundary, so without this nodes end up scattered
// outside the sphere once the simulation settles.
function containmentForce(radius) {
  let nodes = [];
  function force() {
    for (const n of nodes) {
      const d = Math.hypot(n.x, n.y, n.z) || 0.001;
      if (d > radius) {
        const pull = (d - radius) / d;
        n.vx -= n.x * pull * 0.6;
        n.vy -= n.y * pull * 0.6;
        n.vz -= n.z * pull * 0.6;
      }
    }
  }
  force.initialize = ns => { nodes = ns; };
  return force;
}

// Renders whatever scope is currently on top of the stack as a fresh,
// self-contained scene - never mixed with siblings or the outer graph.
function renderScope() {
  highlightNodes.clear();
  highlightLinks.clear();

  const scopeId = currentScopeId();
  const data = sceneDataFor(scopeId);

  if (scopeId !== null) {
    // fresh local layout every time you enter a world, regardless of
    // wherever these nodes happened to sit the last time they were shown
    data.nodes.forEach(n => {
      n.x = (Math.random() - 0.5) * 20;
      n.y = (Math.random() - 0.5) * 20;
      n.z = (Math.random() - 0.5) * 20;
      n.fx = n.fy = n.fz = undefined;
    });
  }

  Graph.graphData(data);
  updateToolbar(data.nodes.length);

  if (scopeId === null) {
    clearShell();
    Graph.d3Force('containment', null);
    setTimeout(() => Graph.zoomToFit(500, 70), 300);
  } else {
    const radius = buildShell(data.nodes.length);
    Graph.d3Force('containment', containmentForce(radius * 0.8));
    Graph.d3ReheatSimulation();
    // frame the whole shell from outside it, not from inside looking out
    setTimeout(() => Graph.cameraPosition({ x: 0, y: 0, z: radius * 2.3 }, { x: 0, y: 0, z: 0 }, 900), 300);
  }
}

function goBack() {
  if (scopeStack.length) scopeStack.pop();
  renderScope();
}

function resetToOverview() {
  scopeStack.length = 0;
  renderScope();
}

function updateToolbar(nodeCount) {
  document.getElementById('btn-back').disabled = scopeStack.length === 0;
  document.getElementById('btn-reset').disabled = scopeStack.length === 0;
  const crumbs = ['overview', ...scopeStack.map(id => allNodes.get(id).name.split('/').pop())];
  document.getElementById('status').textContent = `${crumbs.join(' / ')} · ${nodeCount} shown`;
}
updateToolbar(Graph.graphData().nodes.length);

function showPanel(n) {
  document.getElementById('panel').style.display = 'block';
  document.getElementById('p-kind').textContent = n.language ? `${n.kind} · ${n.language}` : n.kind;
  document.getElementById('p-name').textContent = n.name;
  document.getElementById('p-file').textContent = n.file + ':' + n.lineno;
  document.getElementById('p-doc').textContent = n.docstring || '';
  const src = document.getElementById('p-source');
  if (n.source) { src.style.display = 'block'; src.textContent = n.source; }
  else { src.style.display = 'none'; }
}
</script>
