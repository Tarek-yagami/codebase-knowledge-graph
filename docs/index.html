or), int(minor), int(patch)\n    # urllib3 >= 1.21.1\n    assert major >= 1\n    if major == 1:\n        assert minor >= 21\n\n    # Check charset_normalizer for compatibility.\n    if chardet_version:\n        major, minor, patch = chardet_version.split(\".\")[:3]\n        major, minor, patch = int(major), int(minor), int(patch)\n        # chardet_version >= 3.0.2, < 8.0.0\n        assert (3, 0, 2) <= (major, minor, patch) < (8, 0, 0)\n    elif charset_normalizer_version:\n        major, minor, patch = charset_normalizer_version.split(\".\")[:3]\n        major, minor, patch = int(major), int(minor), int(patch)\n        # charset_normalizer >= 2.0.0 < 4.0.0\n        assert (2, 0, 0) <= (major, minor, patch) < (4, 0, 0)\n    else:\n        warnings.warn(\n            \"Unable to find acceptable character detection dependency \"\n            \"(chardet or charset_normalizer).\",\n            RequestsDependencyWarning,\n        )"}, {"id": "src/requests/__init__.py::_check_cryptography", "kind": "function", "name": "_check_cryptography", "file": "src/requests/__init__.py", "lineno": 99, "end_lineno": 108, "language": "python", "docstring": "", "source": "def _check_cryptography(cryptography_version: str) -> None:\n    # cryptography < 1.3.4\n    try:\n        cryptography_version_list = list(map(int, cryptography_version.split(\".\")))\n    except ValueError:\n        return\n\n    if cryptography_version_list < [1, 3, 4]:\n        warning = f\"Old version of cryptography ({cryptography_version_list}) may cause slowdown.\"\n        warnings.warn(warning, RequestsDependencyWarning)"}, {"id": "src/requests/__version__.py", "kind": "module", "name": "src/requests/__version__.py", "file": "src/requests/__version__.py", "lineno": 1, "end_lineno": 14, "language": "python", "docstring": "", "source": ""}, {"id": "src/requests/_internal_utils.py", "kind": "module", "name": "src/requests/_internal_utils.py", "file": "src/requests/_internal_utils.py", "lineno": 1, "end_lineno": s"}, {"id": "src/requests/adapters.py::BaseAdapter", "kind": "class", "name": "BaseAdapter", "file": "src/requests/adapters.py", "lineno": 122, "end_lineno": 155, "language": "python", "docstring": "The Base Transport Adapter", "source": "class BaseAdapter:\n    \"\"\"The Base Transport Adapter\"\"\"\n\n    def __init__(self) -> None:\n        super().__init__()\n\n    def send(\n        self,\n        request: PreparedRequest,\n        stream: bool = False,\n        timeout: _t.TimeoutType = None,\n        verify: _t.VerifyType = True,\n        cert: _t.CertType = None,\n        proxies: dict[str, str] | None = None,\n    ) -> Response:\n        \"\"\"Sends PreparedRequest object. Returns Response object.\n\n        :param request: The :class:`PreparedRequest <PreparedRequest>` being sent.\n        :param stream: (optional) Whether to stream the request content.\n        :param timeout: (optional) How long to wait for the server to send\n            data before giving up, as a float, or a :ref:`(connect timeout,\n            read timeout) <timeouts>` tuple.\n        :type timeout: float or tuple\n        :param verify: (optional) Either a boolean, in which case it controls whether we verify\n            the server's TLS certificate, or a string, in which case it must be a path\n            to a CA bundle to use\n        :param cert: (optional) Any user-provided SSL certificate to be trusted.\n        :param proxies: (optional) The proxies dictionary to apply to the request.\n        \"\"\"\n        raise NotImplementedError\n\n    def close(self) -> None:\n        \"\"\"Cleans up adapter specific items.\"\"\"\n        raise NotImplementedError"}, {"id": "src/requests/adapters.py::BaseAdapter.__init__", "kind": "function", "name": "__init__", "file": "src/requests/adapters.py", "lineno": 125, "end_lineno": 126, "language": "python", "docstring": "", "source": "    def __init__(self) -> None:\n        super().__init__()"}, {"id": "src/requests/adapters.py::BaseAdapter.send", "kind": "function", "name": "send", "file": "src/requests/adapters.py", "lineno": 128, "end_lineno": 151, "language": "python", "docstring": "Sends PreparedRequest object. Returns Response object.\n\n:param request: The :class:`PreparedRequest <PreparedRequest>` being sent.\n:param stream: (optional) Whether to stream the request content.\n:param timeout: (optional) How long to wait for the server to send\n    data before giving up, as a float, or a :ref:`(connect timeout,\n    read timeout) <timeouts>` tuple.\n:type timeout: float or tuple\n:param verify: (optional) Either a boolean, in which case it controls whether we verify\n    the server's TLS certificate, or a string, in which case it must be a path\n    to a CA bundle to use\n:param cert: (optional) Any user-provided SSL certificate to be trusted.\n:param proxies: (optional) The proxies dictionary to apply to the request.", "source": "    def send(\n        self,\n        request: PreparedRequest,\n        stream: bool = False,\n        timeout: _t.TimeoutType = None,\n        verify: _t.VerifyType = True,\n        cert: _t.CertType = None,\n        proxies: dict[str, str] | None = None,\n    ) -> Response:\n        \"\"\"Sends PreparedRequest object. Returns Response object.\n\n        :param request: The :class:`PreparedRequest <PreparedRequest>` being sent.\n        :param stream: (optional) Whether to stream the request content.\n        :param timeout: (optional) How long to wait for the server to send\n            data before giving up, as a float, or a :ref:`(connect timeout,\n            read timeout) <timeouts>` tuple.\n        :type timeout: float or tuple\n        :param verify: (optional) Either a boolean, in which case it controls whether we verify\n            the server's TLS certificate, or a string, in which case it must be a path\n            to a CA bundle to use\n        :param cert: (optional) Any user-provided SSL certificate to be trusted.\n        :param proxies: (optional) The proxies dictionary to apply to the request.\n        \"\"\"\n        raise NotImplementedError"}, {"id": "src/requests/adapters.py::BaseAdapter.close", "kind": "function", "name": "close", "file": "src/requests/adapters.py", "lineno": 153, "end_lineno": 155, "language": "python", "docstring": "Cleans up adapter specific items.", "source": "    def close(self) -> None:\n        \"\"\"Cleans up adapter specific items.\"\"\"\n        raise NotImplementedError"}, {"id": "src/requests/adapters.py::HTTPAdapter", "kind": "class", "name": "HTTPAdapter", "file": "src/requests/adapters.py", "lineno": 158, "end_lineno": 748, "language": "python", "docstring": "The built-in HTTP Adapter for urllib3.\n\nProvides a general-case interface for Requests sessions to contact HTTP and\nHTTPS urls by implementing the Transport Adapter interface. This class will\nusually be created by the :class:`Session <Session>` class under the\ncovers.\n\n:param pool_connections: The number of urllib3 connection pools to cache.\n:param pool_maxsize: The maximum number of connections to save in the pool.\n:param max_retries: The maximum number of retries each connection\n    should attempt. Note, this applies only to failed DNS lookups, socket\n    connections and connection timeouts, never to requests where data has\n    made it to the server. By default, Requests does not retry failed\n    connections. If you need granular control over the conditions under\n    which we retry a request, import urllib3's ``Retry`` class and pass\n    that instead.\n:param pool_block: Whether the connection pool should block for connections.\n\nUsage::\n\n  >>> import requests\n  >>> s = requests.Session()\n  >>> a = requests.adapters.HTTPAdapter(max_retries=3)\n  >>> s.mount('http://', a)", "source": "class HTTPAdapter(BaseAdapter):\n    \"\"\"The built-in HTTP Adapter for urllib3.\n\n    Provides a general-case interface for Requests sessions to contact HTTP and\n    HTTPS urls by implementing the Transport Adapter interface. This class will\n    usually be created by the :class:`Session <Session>` class under the\n    covers.\n\n    :param pool_connections: The number of urllib3 connection pools to cache.\n    :param pool_maxsize: The maximum number of connections to save in the pool.\n    :param max_retries: The maximum number of retries each connection\n        should attempt. Note, this applies only to failed DNS lookups, socket\n        connections and connection timeouts, never to requests where data has\n        made it to the server. By default, Requests does not retry failed\n        connections. If you need granular control over the conditions under\n        which we retry a request, import urllib3's ``Retry`` class and pass\n        that instead.\n    :param pool_block: Whether the connection pool should block for connections.\n\n    Usage::\n\n      >>> import requests\n      >>> s = requests.Session()\n      >>> a = requests.adapters.HTTPAdapter(max_retries=3)\n      >>> s.mount('http://', a)\n    \"\"\"\n\n    __attrs__: list[str] = [\n        \"max_retries\",\n        \"config\",\n        \"_pool_connections\",\n        \"_pool_maxsize\",\n        \"_pool_block\",\n    ]\n\n    max_retries: Retry\n    config: dict[str, Any]\n    proxy_manager: dict[str, Any]\n    _pool_connections: int\n    _pool_maxsize: int\n "}, {"id": "src/requests/adapters.py::HTTPAdapter.__init__", "kind": "function", "name": "__init__", "file": "src/requests/adapters.py", "lineno": 201, "end_lineno": 221, "language": "python", "docstring": "", "source": "    def __init__(\n        self,\n        pool_connections: int = DEFAULT_POOLSIZE,\n        pool_maxsize: int = DEFAULT_POOLSIZE,\n        max_retries: int | Retry = DEFAULT_RETRIES,\n        pool_block: bool = DEFAULT_POOLBLOCK,\n    ) -> None:\n        if max_retries == DEFAULT_RETRIES:\n            self.max_retries = Retry(0, read=False)\n        else:\n            self.max_retries = Retry.from_int(max_retries)\n        self.config = {}\n        self.proxy_manager = {}\n\n        super().__init__()\n\n        self._pool_connections = pool_connections\n        self._pool_maxsize = pool_maxsize\n        self._pool_block = pool_block\n\n        self.init_poolmanager(pool_connections, pool_maxsize, block=pool_block)"}, {"id": "src/requests/adapters.py::HTTPAdapter.__getstate__", "kind": "function", "name": "__getstate__", "file": "src/requests/adapters.py", "lineno": 223, "end_lineno": 224, "language": "python", "docstring": "", "source": "    def __getstate__(self) -> dict[str, Any]:\n        return {attr: getattr(self, attr, None) for attr in self.__attrs__}"}, {"id": "src/requests/adapters.py::HTTPAdapter.__setstate__", "kind": "function", "name": "__setstate__", "file": "src/requests/adapters.py", "lineno": 226, "end_lineno": 237, "language": "python", "docstring": "", "source": "    def __setstate__(self, state: dict[str, Any]) -> None:\n        # Can't handle by adding 'proxy_manager' to self.__attrs__ because\n        # self.poolmanager uses a lambda function, which isn't pickleable.\n        self.proxy_manager = {}\n        self.config = {}\n\n        for attr, value in state.items():\n            setattr(self, attr, value)\n\n        self.init_poolmanager(\n            self._pool_connections, self._pool_maxsize, block=self._pool_block\n        )"}, {"id": "src/requests/adapters.py::HTTPAdapter.init_poolmanager", "kind": "function", "name": "init_poolmanager", "file": "src/requests/adapters.py", "lineno": 239, "end_lineno": 267, "language": "python", "docstring": "Initializes a urllib3 PoolManager.\n\nThis method should not be called from user code, and is only\nexposed for use when subclassing the\n:class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n:param connections: The number of urllib3 connection pools to cache.\n:param maxsize: The maximum number of connections to save in the pool.\n:param block: Block when no free connections are available.\n:param pool_kwargs: Extra keyword arguments used to initialize the Pool Manager.", "source": "    def init_poolmanager(\n        self,\n        connections: int,\n        maxsize: int,\n        block: bool = DEFAULT_POOLBLOCK,\n        **pool_kwargs: Any,\n    ) -> None:\n        \"\"\"Initializes a urllib3 PoolManager.\n\n        This method should not be called from user code, and is only\n        exposed for use when subclassing the\n        :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        :param connections: The number of urllib3 connection pools to cache.\n        :param maxsize: The maximum number of connections to save in the pool.\n        :param block: Block when no free connections are available.\n        :param pool_kwargs: Extra keyword arguments used to initialize the Pool Manager.\n        \"\"\"\n        # save these values for pickling\n        self._pool_connections = connections\n        self._pool_maxsize = maxsize\n        self._pool_block = block\n\n        self.poolmanager = PoolManager(\n            num_pools=connections,\n            maxsize=maxsize,\n            block=block,\n            **pool_kwargs,\n        )"}, {"id": "src/requests/adapters.py::HTTPAdapter.proxy_manager_for", "kind": "function", "name": "proxy_manager_for", "file": "src/requests/adapters.py", "lineno": 269, "end_lineno": 305, "language": "python", "docstring": "Return urllib3 ProxyManager for the given proxy.\n\nThis method should not be called from user code, and is only\nexposed for use when subclassing the\n:class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n:param proxy: The proxy to return a urllib3 ProxyManager for.\n:param proxy_kwargs: Extra keyword arguments used to configure the Proxy Manager.\n:returns: ProxyManager\n:rtype: urllib3.ProxyManager", "source": "    def proxy_manager_for(self, proxy: str, **proxy_kwargs: Any) -> Any:\n        \"\"\"Return urllib3 ProxyManager for the given proxy.\n\n        This method should not be called from user code, and is only\n        exposed for use when subclassing the\n        :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        :param proxy: The proxy to return a urllib3 ProxyManager for.\n        :param proxy_kwargs: Extra keyword arguments used to configure the Proxy Manager.\n        :returns: ProxyManager\n        :rtype: urllib3.ProxyManager\n        \"\"\"\n        if proxy in self.proxy_manager:\n            manager = self.proxy_manager[proxy]\n        elif proxy.lower().startswith(\"socks\"):\n            username, password = get_auth_from_url(proxy)\n            manager = self.proxy_manager[proxy] = SOCKSProxyManager(\n                proxy,\n                username=username,\n                password=password,\n                num_pools=self._pool_connections,\n                maxsize=self._pool_maxsize,\n                block=self._pool_block,\n                **proxy_kwargs,\n            )\n        else:\n            proxy_headers = self.proxy_headers(proxy)\n            manager = self.proxy_manager[proxy] = proxy_from_url(\n                proxy,\n                proxy_headers=proxy_headers,\n                num_pools=self._pool_connections,\n                maxsize=self._pool_maxsize,\n                block=self._pool_block,\n                **proxy_kwargs,\n            )\n\n        return manager"}, {"id": "src/requests/adapters.py::HTTPAdapter.cert_verify", "kind": "function", "name": "cert_verify", "file": "src/requests/adapters.py", "lineno": 307, "end_lineno": 363, "language": "python", "docstring": "Verify a SSL certificate. This method should not be called from user\ncode, and is only exposed for use when subclassing the\n:class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n:param conn: The urllib3 connection object associated with the cert.\n:param url: The requested URL.\n:param verify: Either a boolean, in which case it controls whether we verify\n    the server's TLS certificate, or a string, in which case it must be a path\n    to a CA bundle to use\n:param cert: The SSL certificate to verify.", "source": "    def cert_verify(\n        self, conn: Any, url: str, verify: _t.VerifyType, cert: _t.CertType\n    ) -> None:\n        \"\"\"Verify a SSL certificate. This method should not be called from user\n        code, and is only exposed for use when subclassing the\n        :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        :param conn: The urllib3 connection object associated with the cert.\n        :param url: The requested URL.\n        :param verify: Either a boolean, in which case it controls whether we verify\n            the server's TLS certificate, or a string, in which case it must be a path\n            to a CA bundle to use\n        :param cert: The SSL certificate to verify.\n        \"\"\"\n        if url.lower().startswith(\"https\") and verify:\n            cert_loc = None\n\n            # Allow self-specified cert location.\n            if verify is not True:\n                cert_loc = verify\n\n            if not cert_loc:\n                cert_loc = DEFAULT_CA_BUNDLE_PATH\n\n            if not cert_loc or not os.path.exists(cert_loc):\n                raise OSError(\n                    f\"Could not find a suitable TLS CA certificate bundle, \"\n                    f\"invalid path: {cert_loc}\"\n                )\n\n            conn.cert_reqs = \"CERT_REQUIRED\"\n\n            if not os.path.isdir(cert_loc):\n                conn.ca_certs = cert_loc\n            else:\n                conn.ca_cert_dir = cert_loc\n        else:\n            conn.cert_reqs = \"CERT_NONE\"\n            conn.ca_certs = "}, {"id": "src/requests/adapters.py::HTTPAdapter.build_response", "kind": "function", "name": "build_response", "file": "src/requests/adapters.py", "lineno": 365, "end_lineno": 401, "language": "python", "docstring": "Builds a :class:`Response <requests.Response>` object from a urllib3\nresponse. This should not be called from user code, and is only exposed\nfor use when subclassing the\n:class:`HTTPAdapter <requests.adapters.HTTPAdapter>`\n\n:param req: The :class:`PreparedRequest <PreparedRequest>` used to generate the response.\n:param resp: The urllib3 response object.\n:rtype: requests.Response", "source": "    def build_response(self, req: PreparedRequest, resp: Any) -> Response:\n        \"\"\"Builds a :class:`Response <requests.Response>` object from a urllib3\n        response. This should not be called from user code, and is only exposed\n        for use when subclassing the\n        :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`\n\n        :param req: The :class:`PreparedRequest <PreparedRequest>` used to generate the response.\n        :param resp: The urllib3 response object.\n        :rtype: requests.Response\n        \"\"\"\n        assert _is_prepared(req)\n        response = Response()\n\n        # Fallback to None if there's no status_code, for whatever reason.\n        response.status_code = getattr(resp, \"status\", None)  # type: ignore[assignment]\n\n        # Make headers case-insensitive.\n        response.headers = CaseInsensitiveDict(getattr(resp, \"headers\", {}))\n\n        # Set encoding.\n        response.encoding = get_encoding_from_headers(response.headers)\n        response.raw = resp\n        response.reason = response.raw.reason\n\n        if isinstance(req.url, bytes):\n            response.url = req.url.decode(\"utf-8\")\n        else:\n            response.url = req.url\n\n        # Add new cookies from the server.\n        extract_cookies_to_jar(response.cookies, req, resp)\n\n        # Give the Response some context.\n        response.request = req\n        response.connection = self\n\n        return response"}, {"id": "src/requests/adapters.py::HTTPAdapter.build_connection_pool_key_attributes", "kind": "function", "name": "build_connection_pool_key_attributes", "file": "src/requests/adapters.py", "lineno": 403, "end_lineno": 453, "language": "python", "docstring": "Build the PoolKey attributes used by urllib3 to return a connection.\n\nThis looks at the PreparedRequest, the user-specified verify value,\nand the value of the cert parameter to determine what PoolKey values\nto use to select a connection from a given urllib3 Connection Pool.\n\nThe SSL related pool key arguments are not consistently set. As of\nthis writing, use the following to determine what keys may be in that\ndictionary:\n\n* If ``verify`` is ``True``, ``\"ssl_context\"`` will be set and will be the\n  default Requests SSL Context\n* If ``verify`` is ``False``, ``\"ssl_context\"`` will not be set but\n  ``\"cert_reqs\"`` will be set\n* If ``verify`` is a string, (i.e., it is a user-specified trust bundle)\n  ``\"ca_certs\"`` will be set if the string is not a directory recognized\n  by :py:func:`os.path.isdir`, otherwise ``\"ca_cert_dir\"`` will be\n  set.\n* If ``\"cert\"`` is specified, ``\"cert_file\"`` will always be set. If\n  ``\"cert\"`` is a tuple with a second item, ``\"key_file\"`` will also\n  be present\n\nTo override these settings, one may subclass this class, call this\nmethod and use the above logic to change parameters as desired. For\nexample, if one wishes to use a custom :py:class:`ssl.SSLContext` one\nmust both set ``\"ssl_context\"`` and based on what else they require,\nalter the other keys to ensure the desired behaviour.\n\n:param request:\n    The PreparedRequest being sent over the connection.\n:type request:\n    :class:`~requests.models.PreparedRequest`\n:param verify:\n    Either a boolean, in which case it controls whether\n    we verify the server's TLS certificate, or a string, in which case it\n    must be a path to a CA bundle to use.\n:param cert:\n    (optional) Any user-provided SSL certificate for client\n    authentication (a.k.a., mTLS). This may be a string (i.e., just\n    the path to a file which holds both certificate and key) or a\n    tuple of length 2 with the certificate file path and key file\n    path.\n:returns:\n    A tuple of two dictionaries. The first is the \"host parameters\"\n    portion of the Pool Key including scheme, hostname, and port. The\n    second is a dictionary of SSLContext related parameters.", "source": "    def build_connection_pool_key_attributes(\n        self, request: PreparedRequest, verify: _t.VerifyType, cert: _t.CertType = None\n    ) -> tuple[dict[str, Any], dict[str, Any]]:\n        \"\"\"Build the PoolKey attributes used by urllib3 to return a connection.\n\n        This looks at the PreparedRequest, the user-specified verify value,\n        and the value of the cert parameter to determine what PoolKey values\n        to use to select a connection from a given urllib3 Connection Pool.\n\n        The SSL related pool key arguments are not consistently set. As of\n        this writing, use the following to determine what keys may be in that\n        dictionary:\n\n        * If ``verify`` is ``True``, ``\"ssl_context\"`` will be set and will be the\n          default Requests SSL Context\n        * If ``verify`` is ``False``, ``\"ssl_context\"`` will not be set but\n          ``\"cert_reqs\"`` will be set\n        * If ``verify`` is a string, (i.e., it is a user-specified trust bundle)\n          ``\"ca_certs\"`` will be set if the string is not a directory recognized\n          by :py:func:`os.path.isdir`, otherwise ``\"ca_cert_dir\"`` will be\n          set.\n        * If ``\"cert\"`` is specified, ``\"cert_file\"`` will always be set. If\n          ``\"cert\"`` is a tuple with a second item, ``\"key_file\"`` will also\n          be present\n\n        To override these settings, one may subclass this class, call this\n        method and use the above logic to change parameters as desired. For\n        example, i"}, {"id": "src/requests/adapters.py::HTTPAdapter.get_connection_with_tls_context", "kind": "function", "name": "get_connection_with_tls_context", "file": "src/requests/adapters.py", "lineno": 455, "end_lineno": 510, "language": "python", "docstring": "Returns a urllib3 connection for the given request and TLS settings.\nThis should not be called from user code, and is only exposed for use\nwhen subclassing the :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n:param request:\n    The :class:`PreparedRequest <PreparedRequest>` object to be sent\n    over the connection.\n:param verify:\n    Either a boolean, in which case it controls whether we verify the\n    server's TLS certificate, or a string, in which case it must be a\n    path to a CA bundle to use.\n:param proxies:\n    (optional) The proxies dictionary to apply to the request.\n:param cert:\n    (optional) Any user-provided SSL certificate to be used for client\n    authentication (a.k.a., mTLS).\n:rtype:\n    urllib3.HTTPConnectionPool", "source": "    def get_connection_with_tls_context(\n        self,\n        request: PreparedRequest,\n        verify: _t.VerifyType,\n        proxies: dict[str, str] | None = None,\n        cert: _t.CertType = None,\n    ) -> HTTPConnectionPool:\n        \"\"\"Returns a urllib3 connection for the given request and TLS settings.\n        This should not be called from user code, and is only exposed for use\n        when subclassing the :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        :param request:\n            The :class:`PreparedRequest <PreparedRequest>` object to be sent\n            over the connection.\n        :param verify:\n            Either a boolean, in which case it controls whether we verify the\n            server's TLS certificate, or a string, in which case it must be a\n            path to a CA bundle to use.\n        :param proxies:\n            (optional) The proxies dictionary to apply to the request.\n        :param cert:\n            (optional) Any user-provided SSL certificate to be used for client\n            authentication (a.k.a., mTLS).\n        :rtype:\n            urllib3.HTTPConnectionPool\n        \"\"\"\n        assert _is_prepared(request)\n\n        proxy = select_proxy(request.url, proxies)\n        try:\n            host_params, pool_kwargs = self.build_connection_pool_key_attributes(\n                request,\n                verify,\n                cert,\n            )\n        except ValueError as e:\n            raise InvalidURL(e, request=request)\n        if proxy:\n  "}, {"id": "src/requests/adapters.py::HTTPAdapter.get_connection", "kind": "function", "name": "get_connection", "file": "src/requests/adapters.py", "lineno": 512, "end_lineno": 553, "language": "python", "docstring": "DEPRECATED: Users should move to `get_connection_with_tls_context`\nfor all subclasses of HTTPAdapter using Requests>=2.32.2.\n\nReturns a urllib3 connection for the given URL. This should not be\ncalled from user code, and is only exposed for use when subclassing the\n:class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n:param url: The URL to connect to.\n:param proxies: (optional) A Requests-style dictionary of proxies used on this request.\n:rtype: urllib3.HTTPConnectionPool", "source": "    def get_connection(\n        self, url: str, proxies: dict[str, str] | None = None\n    ) -> HTTPConnectionPool:\n        \"\"\"DEPRECATED: Users should move to `get_connection_with_tls_context`\n        for all subclasses of HTTPAdapter using Requests>=2.32.2.\n\n        Returns a urllib3 connection for the given URL. This should not be\n        called from user code, and is only exposed for use when subclassing the\n        :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        :param url: The URL to connect to.\n        :param proxies: (optional) A Requests-style dictionary of proxies used on this request.\n        :rtype: urllib3.HTTPConnectionPool\n        \"\"\"\n        warnings.warn(\n            (\n                \"`get_connection` has been deprecated in favor of \"\n                \"`get_connection_with_tls_context`. Custom HTTPAdapter subclasses \"\n                \"will need to migrate for Requests>=2.32.2. Please see \"\n                \"https://github.com/psf/requests/pull/6710 for more details.\"\n            ),\n            DeprecationWarning,\n        )\n        proxy = select_proxy(url, proxies)\n\n        if proxy:\n            proxy = prepend_scheme_if_needed(proxy, \"http\")\n            proxy_url = parse_url(proxy)\n            if not proxy_url.host:\n                raise InvalidProxyURL(\n                    \"Please check proxy URL. It is malformed \"\n                    \"and could be missing the host.\"\n                )\n            proxy_manager = self.proxy_manager_for(proxy)\n  "}, {"id": "src/requests/adapters.py::HTTPAdapter.close", "kind": "function", "name": "close", "file": "src/requests/adapters.py", "lineno": 555, "end_lineno": 563, "language": "python", "docstring": "Disposes of any internal state.\n\nCurrently, this closes the PoolManager and any active ProxyManager,\nwhich closes any pooled connections.", "source": "    def close(self) -> None:\n        \"\"\"Disposes of any internal state.\n\n        Currently, this closes the PoolManager and any active ProxyManager,\n        which closes any pooled connections.\n        \"\"\"\n        self.poolmanager.clear()\n        for proxy in self.proxy_manager.values():\n            proxy.clear()"}, {"id": "src/requests/adapters.py::HTTPAdapter.request_url", "kind": "function", "name": "request_url", "file": "src/requests/adapters.py", "lineno": 565, "end_lineno": 597, "language": "python", "docstring": "Obtain the url to use when making the final request.\n\nIf the message is being sent through a HTTP proxy, the full URL has to\nbe used. Otherwise, we should only use the path portion of the URL.\n\nThis should not be called from user code, and is only exposed for use\nwhen subclassing the\n:class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n:param request: The :class:`PreparedRequest <PreparedRequest>` being sent.\n:param proxies: A dictionary of schemes or schemes and hosts to proxy URLs.\n:rtype: str", "source": "    def request_url(\n        self, request: PreparedRequest, proxies: dict[str, str] | None\n    ) -> str:\n        \"\"\"Obtain the url to use when making the final request.\n\n        If the message is being sent through a HTTP proxy, the full URL has to\n        be used. Otherwise, we should only use the path portion of the URL.\n\n        This should not be called from user code, and is only exposed for use\n        when subclassing the\n        :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        :param request: The :class:`PreparedRequest <PreparedRequest>` being sent.\n        :param proxies: A dictionary of schemes or schemes and hosts to proxy URLs.\n        :rtype: str\n        \"\"\"\n        assert _is_prepared(request)\n\n        proxy = select_proxy(request.url, proxies)\n        scheme = urlparse(request.url).scheme\n\n        is_proxied_http_request = proxy and scheme != \"https\"\n        using_socks_proxy = False\n        if proxy:\n            proxy_scheme = urlparse(proxy).scheme.lower()\n            using_socks_proxy = proxy_scheme.startswith(\"socks\")\n\n        url = request.path_url\n\n        if is_proxied_http_request and not using_socks_proxy:\n            url = urldefragauth(request.url)\n\n        return url"}, {"id": "src/requests/adapters.py::HTTPAdapter.add_headers", "kind": "function", "name": "add_headers", "file": "src/requests/adapters.py", "lineno": 599, "end_lineno": 611, "language": "python", "docstring": "Add any headers needed by the connection. As of v2.0 this does\nnothing by default, but is left for overriding by users that subclass\nthe :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\nThis should not be called from user code, and is only exposed for use\nwhen subclassing the\n:class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n:param request: The :class:`PreparedRequest <PreparedRequest>` to add headers to.\n:param kwargs: The keyword arguments from the call to send().", "source": "    def add_headers(self, request: PreparedRequest, **kwargs: Any) -> None:\n        \"\"\"Add any headers needed by the connection. As of v2.0 this does\n        nothing by default, but is left for overriding by users that subclass\n        the :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        This should not be called from user code, and is only exposed for use\n        when subclassing the\n        :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        :param request: The :class:`PreparedRequest <PreparedRequest>` to add headers to.\n        :param kwargs: The keyword arguments from the call to send().\n        \"\"\"\n        pass"}, {"id": "src/requests/adapters.py::HTTPAdapter.proxy_headers", "kind": "function", "name": "proxy_headers", "file": "src/requests/adapters.py", "lineno": 613, "end_lineno": 632, "language": "python", "docstring": "Returns a dictionary of the headers to add to any request sent\nthrough a proxy. This works with urllib3 magic to ensure that they are\ncorrectly sent to the proxy, rather than in a tunnelled request if\nCONNECT is being used.\n\nThis should not be called from user code, and is only exposed for use\nwhen subclassing the\n:class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n:param proxy: The url of the proxy being used for this request.\n:rtype: dict", "source": "    def proxy_headers(self, proxy: str) -> dict[str, str]:\n        \"\"\"Returns a dictionary of the headers to add to any request sent\n        through a proxy. This works with urllib3 magic to ensure that they are\n        correctly sent to the proxy, rather than in a tunnelled request if\n        CONNECT is being used.\n\n        This should not be called from user code, and is only exposed for use\n        when subclassing the\n        :class:`HTTPAdapter <requests.adapters.HTTPAdapter>`.\n\n        :param proxy: The url of the proxy being used for this request.\n        :rtype: dict\n        \"\"\"\n        headers: dict[str, str] = {}\n        username, password = get_auth_from_url(proxy)\n\n        if username:\n            headers[\"Proxy-Authorization\"] = _basic_auth_str(username, password)\n\n        return headers"}, {"id": "src/requests/adapters.py::HTTPAdapter.send", "kind": "function", "name": "send", "file": "src/requests/adapters.py", "lineno": 634, "end_lineno": 748, "language": "python", "docstring": "Sends PreparedRequest object. Returns Response object.\n\n:param request: The :class:`PreparedRequest <PreparedRequest>` being sent.\n:param stream: (optional) Whether to stream the request content.\n:param timeout: (optional) How long to wait for the server to send\n    data before giving up, as a float, or a :ref:`(connect timeout,\n    read timeout) <timeouts>` tuple.\n:type timeout: float or tuple or urllib3 Timeout object\n:param verify: (optional) Either a boolean, in which case it controls whether\n    we verify the server's TLS certificate, or a string, in which case it\n    must be a path to a CA bundle to use\n:param cert: (optional) Any user-provided SSL certificate to be trusted.\n:param proxies: (optional) The proxies dictionary to apply to the request.\n:rtype: requests.Response", "source": "    def send(\n        self,\n        request: PreparedRequest,\n        stream: bool = False,\n        timeout: _t.TimeoutType = None,\n        verify: _t.VerifyType = True,\n        cert: _t.CertType = None,\n        proxies: dict[str, str] | None = None,\n    ) -> Response:\n        \"\"\"Sends PreparedRequest object. Returns Response object.\n\n        :param request: The :class:`PreparedRequest <PreparedRequest>` being sent.\n        :param stream: (optional) Whether to stream the request content.\n        :param timeout: (optional) How long to wait for the server to send\n            data before giving up, as a float, or a :ref:`(connect timeout,\n            read timeout) <timeouts>` tuple.\n        :type timeout: float or tuple or urllib3 Timeout object\n        :param verify: (optional) Either a boolean, in which case it controls whether\n            we verify the server's TLS certificate, or a string, in which case it\n            must be a path to a CA bundle to use\n        :param cert: (optional) Any user-provided SSL certificate to be trusted.\n        :param proxies: (optional) The proxies dictionary to apply to the request.\n        :rtype: requests.Response\n        \"\"\"\n\n        assert _is_prepared(request)\n\n        try:\n            conn = self.get_connection_with_tls_context(\n                request, verify, proxies=proxies, cert=cert\n            )\n        except LocationValueError as e:\n            raise InvalidURL(e, request=request)\n\n        self.cert_verify(conn, request.url, ver"}, {"id": "src/requests/api.py", "kind": "module", "name": "src/requests/api.py", "file": "src/requests/api.py", "lineno": 1, "end_lineno": 180, "language": "python", "docstring": "requests.api\n~~~~~~~~~~~~\n\nThis module implements the Requests API.\n\n:copyright: (c) 2012 by Kenneth Reitz.\n:license: Apache2, see LICENSE for more details.", "source": ""}, {"id": "src/requests/api.py::request", "kind": "function", "name": "request", "file": "src/requests/api.py", "lineno": 24, "end_lineno": 71, "language": "python", "docstring": "Constructs and sends a :class:`Request <Request>`.\n\n:param method: method for the new :class:`Request` object: ``GET``, ``OPTIONS``, ``HEAD``, ``POST``, ``PUT``, ``PATCH``, or ``DELETE``.\n:param url: URL for the new :class:`Request` object.\n:param params: (optional) Dictionary, list of tuples or bytes to send\n    in the query string for the :class:`Request`.\n:param data: (optional) Dictionary, list of tuples, bytes, or file-like\n    object to send in the body of the :class:`Request`.\n:param json: (optional) A JSON serializable Python object to send in the body of the :class:`Request`.\n:param headers: (optional) Dictionary of HTTP Headers to send with the :class:`Request`.\n:param cookies: (optional) Dict or CookieJar object to send with the :class:`Request`.\n:param files: (optional) Dictionary of ``'name': file-like-objects`` (or ``{'name': file-tuple}``) for multipart encoding upload.\n    ``file-tuple`` can be a 2-tuple ``('filename', fileobj)``, 3-tuple ``('filename', fileobj, 'content_type')``\n    or a 4-tuple ``('filename', fileobj, 'content_type', custom_headers)``, where ``'content_type'`` is a string\n    defining the content type of the given file and ``custom_headers`` a dict-like object containing additional headers\n    to add for the file.\n:param auth: (optional) Auth tuple to enable Basic/Digest/Custom HTTP Auth.\n:param timeout: (optional) How many seconds to wait for the server to send data\n    before giving up, as a float, or a :ref:`(connect timeout, read\n    timeout) <timeouts>` tuple.\n:type timeout: float or tuple\n:param allow_redirects: (optional) Boolean. Enable/disable GET/OPTIONS/POST/PUT/PATCH/DELETE/HEAD redirection. Defaults to ``True``.\n:type allow_redirects: bool\n:param proxies: (optional) Dictionary mapping protocol to the URL of the proxy.\n:param verify: (optional) Either a boolean, in which case it controls whether we verify\n        the server's TLS certificate, or a string, in which case it must be a path\n        to a CA bundle to use. Defaults to ``True``.\n:param stream: (optional) if ``False``, the response content will be immediately downloaded.\n:param cert: (optional) if String, path to ssl client cert file (.pem). If Tuple, ('cert', 'key') pair.\n:return: :class:`Response <Response>` object\n:rtype: requests.Response\n\nUsage::\n\n  >>> import requests\n  >>> req = requests.request('GET', 'https://httpbin.org/get')\n  >>> req\n  <Response [200]>", "source": "def request(\n    method: str, url: _t.UriType, **kwargs: Unpack[_t.RequestKwargs]\n) -> Response:\n    \"\"\"Constructs and sends a :class:`Request <Request>`.\n\n    :param method: method for the new :class:`Request` object: ``GET``, ``OPTIONS``, ``HEAD``, ``POST``, ``PUT``, ``PATCH``, or ``DELETE``.\n    :param url: URL for the new :class:`Request` object.\n    :param params: (optional) Dictionary, list of tuples or bytes to send\n        in the query string for the :class:`Request`.\n    :param data: (optional) Dictionary, list of tuples, bytes, or file-like\n        object to send in the body of the :class:`Request`.\n    :param json: (optional) A JSON serializable Python object to send in the body of the :class:`Request`.\n    :param headers: (optional) Dictionary of HTTP Headers to send with the :class:`Request`.\n    :param cookies: (optional) Dict or CookieJar object to send with the :class:`Request`.\n    :param files: (optional) Dictionary of ``'name': file-like-objects`` (or ``{'name': file-tuple}``) for multipart encoding upload.\n        ``file-tuple`` can be a 2-tuple ``('filename', fileobj)``, 3-tuple ``('filename', fileobj, 'content_type')``\n        or a 4-tuple ``('filename', fileobj, 'content_type', custom_headers)``, where ``'content_type'`` is a string\n        defining the content type of the given file and ``custom_headers`` a dict-like object containing additional headers\n        to add for the file.\n    :param auth: (optional) Auth tuple to enable Basic/Digest/Custom HT"}, {"id": "src/requests/api.py::get", "kind": "function", "name": "get", "file": "src/requests/api.py", "lineno": 74, "end_lineno": 87, "language": "python", "docstring": "Sends a GET request.\n\n:param url: URL for the new :class:`Request` object.\n:param params: (optional) Dictionary, list of tuples or bytes to send\n    in the query string for the :class:`Request`.\n:param \\*\\*kwargs: Optional arguments that ``request`` takes.\n:return: :class:`Response <Response>` object\n:rtype: requests.Response", "source": "def get(\n    url: _t.UriType, params: _t.ParamsType = None, **kwargs: Unpack[_t.GetKwargs]\n) -> Response:\n    r\"\"\"Sends a GET request.\n\n    :param url: URL for the new :class:`Request` object.\n    :param params: (optional) Dictionary, list of tuples or bytes to send\n        in the query string for the :class:`Request`.\n    :param \\*\\*kwargs: Optional arguments that ``request`` takes.\n    :return: :class:`Response <Response>` object\n    :rtype: requests.Response\n    \"\"\"\n\n    return request(\"get\", url, params=params, **kwargs)"}, {"id": "src/requests/api.py::options", "kind": "function", "name": "options", "file": "src/requests/api.py", "lineno": 90, "end_lineno": 99, "language": "python", "docstring": "Sends an OPTIONS request.\n\n:param url: URL for the new :class:`Request` object.\n:param \\*\\*kwargs: Optional arguments that ``request`` takes.\n:return: :class:`Response <Response>` object\n:rtype: requests.Response", "source": "def options(url: _t.UriType, **kwargs: Unpack[_t.RequestKwargs]) -> Response:\n    r\"\"\"Sends an OPTIONS request.\n\n    :param url: URL for the new :class:`Request` object.\n    :param \\*\\*kwargs: Optional arguments that ``request`` takes.\n    :return: :class:`Response <Response>` object\n    :rtype: requests.Response\n    \"\"\"\n\n    return request(\"options\", url, **kwargs)"}, {"id": "src/requests/api.py::head", "kind": "function", "name": "head", "file": "src/requests/api.py", "lineno": 102, "end_lineno": 114, "language": "python", "docstring": "Sends a HEAD request.\n\n:param url: URL for the new :class:`Request` object.\n:param \\*\\*kwargs: Optional arguments that ``request`` takes. If\n    `allow_redirects` is not provided, it will be set to `False` (as\n    opposed to the default :meth:`request` behavior).\n:return: :class:`Response <Response>` object\n:rtype: requests.Response", "source": "def head(url: _t.UriType, **kwargs: Unpack[_t.RequestKwargs]) -> Response:\n    r\"\"\"Sends a HEAD request.\n\n    :param url: URL for the new :class:`Request` object.\n    :param \\*\\*kwargs: Optional arguments that ``request`` takes. If\n        `allow_redirects` is not provided, it will be set to `False` (as\n        opposed to the default :meth:`request` behavior).\n    :return: :class:`Response <Response>` object\n    :rtype: requests.Response\n    \"\"\"\n\n    kwargs.setdefault(\"allow_redirects\", False)\n    return request(\"head\", url, **kwargs)"}, {"id": "src/requests/api.py::post", "kind": "function", "name": "post", "file": "src/requests/api.py", "lineno": 117, "end_lineno": 134, "language": "python", "docstring": "Sends a POST request.\n\n:param url: URL for the new :class:`Request` object.\n:param data: (optional) Dictionary, list of tuples, bytes, or file-like\n    object to send in the body of the :class:`Request`.\n:param json: (optional) A JSON serializable Python object to send in the body of the :class:`Request`.\n:param \\*\\*kwargs: Optional arguments that ``request`` takes.\n:return: :class:`Response <Response>` object\n:rtype: requests.Response", "source": "def post(\n    url: _t.UriType,\n    data: _t.DataType = None,\n    json: _t.JsonType = None,\n    **kwargs: Unpack[_t.PostKwargs],\n) -> Response:\n    r\"\"\"Sends a POST request.\n\n    :param url: URL for the new :class:`Request` object.\n    :param data: (optional) Dictionary, list of tuples, bytes, or file-like\n        object to send in the body of the :class:`Request`.\n    :param json: (optional) A JSON serializable Python object to send in the body of the :class:`Request`.\n    :param \\*\\*kwargs: Optional arguments that ``request`` takes.\n    :return: :class:`Response <Response>` object\n    :rtype: requests.Response\n    \"\"\"\n\n    return request(\"post\", url, data=data, json=json, **kwargs)"}, {"id": "src/requests/api.py::put", "kind": "function", "name": "put", "file": "src/requests/api.py", "lineno": 137, "end_lineno": 151, "language": "python", "docstring": "Sends a PUT request.\n\n:param url: URL for the new :class:`Request` object.\n:param data: (optional) Dictionary, list of tuples, bytes, or file-like\n    object to send in the body of the :class:`Request`.\n:param json: (optional) A JSON serializable Python object to send in the body of the :class:`Request`.\n:param \\*\\*kwargs: Optional arguments that ``request`` takes.\n:return: :class:`Response <Response>` object\n:rtype: requests.Response", "source": "def put(\n    url: _t.UriType, data: _t.DataType = None, **kwargs: Unpack[_t.DataKwargs]\n) -> Response:\n    r\"\"\"Sends a PUT request.\n\n    :param url: URL for the new :class:`Request` object.\n    :param data: (optional) Dictionary, list of tuples, bytes, or file-like\n        object to send in the body of the :class:`Request`.\n    :param json: (optional) A JSON serializable Python object to send in the body of the :class:`Request`.\n    :param \\*\\*kwargs: Optional arguments that ``request`` takes.\n    :return: :class:`Response <Response>` object\n    :rtype: requests.Response\n    \"\"\"\n\n    return request(\"put\", url, data=data, **kwargs)"}, {"id": "src/requests/api.py::patch", "kind": "function", "name": "patch", "file": "src/requests/api.py", "lineno": 154, "end_lineno": 168, "language": "python", "docstring": "Sends a PATCH request.\n\n:param url: URL for the new :class:`Request` object.\n:param data: (optional) Dictionary, list of tuples, bytes, or file-like\n    object to send in the body of the :class:`Request`.\n:param json: (optional) A JSON serializable Python object to send in the body of the :class:`Request`.\n:param \\*\\*kwargs: Optional arguments that ``request`` takes.\n:return: :class:`Response <Response>` object\n:rtype: requests.Response", "source": "def patch(\n    url: _t.UriType, data: _t.DataType = None, **kwargs: Unpack[_t.DataKwargs]\n) -> Response:\n    r\"\"\"Sends a PATCH request.\n\n    :param url: URL for the new :class:`Request` object.\n    :param data: (optional) Dictionary, list of tuples, bytes, or file-like\n        object to send in the body of the :class:`Request`.\n    :param json: (optional) A JSON serializable Python object to send in the body of the :class:`Request`.\n    :param \\*\\*kwargs: Optional arguments that ``request`` takes.\n    :return: :class:`Response <Response>` object\n    :rtype: requests.Response\n    \"\"\"\n\n    return request(\"patch\", url, data=data, **kwargs)"}, {"id": "src/requests/api.py::delete", "kind": "function", "name": "delete", "file": "src/requests/api.py", "lineno": 171, "end_lineno": 180, "language": "python", "docstring": "Sends a DELETE request.\n\n:param url: URL for the new :class:`Request` object.\n:param \\*\\*kwargs: Optional arguments that ``request`` takes.\n:return: :class:`Response <Response>` object\n:rtype: requests.Response", "source": "def delete(url: _t.UriType, **kwargs: Unpack[_t.RequestKwargs]) -> Response:\n    r\"\"\"Sends a DELETE request.\n\n    :param url: URL for the new :class:`Request` object.\n    :param \\*\\*kwargs: Optional arguments that ``request`` takes.\n    :return: :class:`Response <Response>` object\n    :rtype: requests.Response\n    \"\"\"\n\n    return request(\"delete\", url, **kwargs)"}, {"id": "src/requests/auth.py", "kind": "module", "name": "src/requests/auth.py", "file": "src/requests/auth.py", "lineno": 1, "end_lineno": 354, "language": "python", "docstring": "requests.auth\n~~~~~~~~~~~~~\n\nThis module contains the authentication handlers for Requests.", "source": ""}, {"id": "src/requests/auth.py::_basic_auth_str", "kind": "function", "name": "_basic_auth_str", "file": "src/requests/auth.py", "lineno": 34, "end_lineno": 75, "language": "python", "docstring": "Returns a Basic Auth string.", "source": "def _basic_auth_str(username: bytes | str, password: bytes | str) -> str:\n    \"\"\"Returns a Basic Auth string.\"\"\"\n\n    # \"I want us to put a big-ol' comment on top of it that\n    # says that this behaviour is dumb but we need to preserve\n    # it because people are relying on it.\"\n    #    - Lukasa\n    #\n    # These are here solely to maintain backwards compatibility\n    # for things like ints. This will be removed in 3.0.0.\n    if not isinstance(username, basestring):  # runtime guard for non-str/bytes\n        warnings.warn(\n            \"Non-string usernames will no longer be supported in Requests \"\n            f\"3.0.0. Please convert the object you've passed in ({username!r}) to \"\n            \"a string or bytes object in the near future to avoid \"\n            \"problems.\",\n            category=DeprecationWarning,\n        )\n        username = str(username)\n\n    if not isinstance(password, basestring):  # runtime guard for non-str/bytes\n        warnings.warn(\n            \"Non-string passwords will no longer be supported in Requests \"\n            f\"3.0.0. Please convert the object you've passed in ({type(password)!r}) to \"\n            \"a string or bytes object in the near future to avoid \"\n            \"problems.\",\n            category=DeprecationWarning,\n        )\n        password = str(password)\n    # -- End Removal --\n\n    if isinstance(username, str):\n        username = username.encode(\"latin1\")\n\n    if isinstance(password, str):\n        password = password.encode(\"latin1\")\n\n"}, {"id": "src/requests/auth.py::AuthBase", "kind": "class", "name": "AuthBase", "file": "src/requests/auth.py", "lineno": 78, "end_lineno": 82, "language": "python", "docstring": "Base class that all auth implementations derive from", "source": "class AuthBase:\n    \"\"\"Base class that all auth implementations derive from\"\"\"\n\n    def __call__(self, r: PreparedRequest) -> PreparedRequest:\n        raise NotImplementedError(\"Auth hooks must be callable.\")"}, {"id": "src/requests/auth.py::AuthBase.__call__", "kind": "function", "name": "__call__", "file": "src/requests/auth.py", "lineno": 81, "end_lineno": 82, "language": "python", "docstring": "", "source": "    def __call__(self, r: PreparedRequest) -> PreparedRequest:\n        raise NotImplementedError(\"Auth hooks must be callable.\")"}, {"id": "src/requests/auth.py::HTTPBasicAuth", "kind": "class", "name": "HTTPBasicAuth", "file": "src/requests/auth.py", "lineno": 85, "end_lineno": 113, "language": "python", "docstring": "Attaches HTTP Basic Authentication to the given Request object.", "source": "class HTTPBasicAuth(AuthBase):\n    \"\"\"Attaches HTTP Basic Authentication to the given Request object.\"\"\"\n\n    username: bytes | str\n    password: bytes | str\n\n    @overload\n    def __init__(self, username: str, password: str) -> None: ...\n    @overload\n    def __init__(self, username: bytes, password: bytes) -> None: ...\n\n    def __init__(self, username: bytes | str, password: bytes | str) -> None:\n        self.username = username\n        self.password = password\n\n    def __eq__(self, other: object) -> bool:\n        return all(\n            [\n                self.username == getattr(other, \"username\", None),\n                self.password == getattr(other, \"password\", None),\n            ]\n        )\n\n    def __ne__(self, other: Any) -> bool:\n        return not self == other\n\n    def __call__(self, r: PreparedRequest) -> PreparedRequest:\n        r.headers[\"Authorization\"] = _basic_auth_str(self.username, self.password)\n        return r"}, {"id": "src/requests/auth.py::HTTPBasicAuth.__init__", "kind": "function", "name": "__init__", "file": "src/requests/auth.py", "lineno": 96, "end_lineno": 98, "language": "python", "docstring": "", "source": "    def __init__(self, username: bytes | str, password: bytes | str) -> None:\n        self.username = username\n        self.password = password"}, {"id": "src/requests/auth.py::HTTPBasicAuth.__eq__", "kind": "function", "name": "__eq__", "file": "src/requests/auth.py", "lineno": 100, "end_lineno": 106, "language": "python", "docstring": "", "source": "    def __eq__(self, other: object) -> bool:\n        return all(\n            [\n                self.username == getattr(other, \"username\", None),\n                self.password == getattr(other, \"password\", None),\n            ]\n        )"}, {"id": "src/ it_per_thread_state", "file": "src/requests/auth.py", "lineno": 147, "end_lineno": 155, "language": "python", "docstring": "", "source": "    def init_per_thread_state(self) -> None:\n        # Ensure state is initialized just once per-thread\n        if not hasattr(self._thread_local, \"init\"):\n            self._thread_local.init = True\n            self._thread_local.last_nonce = \"\"\n            self._thread_local.nonce_count = 0\n            self._thread_local.chal = {}\n            self._thread_local.pos = None\n            self._thread_local.num_401_calls = None"}, {"id": "src/requests/auth.py::HTTPDigestAuth.build_digest_header", "kind": "function", "name": "build_digest_header", "file": "src/requests/auth.py", "lineno": 157, "end_lineno": 266, "language": "python", "docstring": ":rtype: str", "source": "    def build_digest_header(self, method: str, url: str) -> str | None:\n        \"\"\"\n        :rtype: str\n        \"\"\"\n\n        realm = self._thread_local.chal[\"realm\"]\n        nonce = self._thread_local.chal[\"nonce\"]\n        qop = self._thread_local.chal.get(\"qop\")\n        algorithm = self._thread_local.chal.get(\"algorithm\")\n        opaque = self._thread_local.chal.get(\"opaque\")\n        hash_utf8 = None\n\n        if algorithm is None:\n            _algorithm = \"MD5\"\n        else:\n            _algorithm = algorithm.upper()\n        # lambdas assume digest modules are imported at the top level\n        if _algorithm == \"MD5\" or _algorithm == \"MD5-SESS\":\n\n            def md5_utf8(x: str | bytes) -> str:\n                if isinstance(x, str):\n                    x = x.encode(\"utf-8\")\n                return hashlib.md5(x, usedforsecurity=False).hexdigest()\n\n            hash_utf8 = md5_utf8\n        elif _algorithm == \"SHA\":\n\n            def sha_utf8(x: str | bytes) -> str:\n                if isinstance(x, str):\n                    x = x.encode(\"utf-8\")\n                return hashlib.sha1(x, usedforsecurity=False).hexdigest()\n\n            hash_utf8 = sha_utf8\n        elif _algorithm == \"SHA-256\":\n\n            def sha256_utf8(x: str | bytes) -> str:\n                if isinstance(x, str):\n                    x = x.encode(\"utf-8\")\n                return hashlib.sha256(x, usedforsecurity=False).hexdigest()\n\n            hash_utf8 = sha256_utf8\n        elif _algorithm == \"SHA-512\":\n\n           "}, {"id": "src/requests/auth.py::HTTPDigestAuth.build_digest_header.KD", "kind": "function", "name": "KD", "file": "src/requests/auth.py", "lineno": 210, "end_lineno": 211, "language": "python", "docstring": "", "source": "        def KD(s: str, d: str) -> str:\n            return hash_utf8(f\"{s}:{d}\")"}, {"id": "src/requests/auth.py::HTTPDigestAuth.handle_redirect", "kind": "function", "name": "handle_redirect", "file": "src/requests/auth.py", "lineno": 268, "end_lineno": 271, "language": "python", "docstring": "Reset num_401_calls counter on redirects.", "source": "    def handle_redirect(self, r: Response, **kwargs: Any) -> None:\n        \"\"\"Reset num_401_calls counter on redirects.\"\"\"\n        if r.is_redirect:\n            self._thread_local.num_401_calls = 1"}, {"id": "src/requests/auth.py::HTTPDigestAuth.handle_401", "kind": "function", "name": "handle_401", "file": "src/requests/auth.py", "lineno": 273, "end_lineno": 319, "language": "python", "docstring": "Takes the given response and tries digest-auth, if needed.\n\n:rtype: requests.Response", "source": "    def handle_401(self, r: Response, **kwargs: Any) -> Response:\n        \"\"\"\n        Takes the given response and tries digest-auth, if needed.\n\n        :rtype: requests.Response\n        \"\"\"\n\n        # If response is not 4xx, do not auth\n        # See https://github.com/psf/requests/issues/3772\n        if not 400 <= r.status_code < 500:\n            self._thread_local.num_401_calls = 1\n            return r\n\n        if self._thread_local.pos is not None:\n            # Rewind the file          # file position of the previous body. Ensure it's set to\n            # None.\n            self._thread_local.pos = None\n        r.register_hook(\"response\", self.handle_401)\n        r.register_hook(\"response\", self.handle_redirect)\n        self._thread_local.num_401_calls = 1\n\n        return r"}, {"id": "src/requests/auth.py::HTTPDigestAuth.__eq__", "kind": "function", "name": "__eq__", "file": "src/requests/auth.py", "lineno": 345, "end_lineno": 351, "language": "python", "docstring": "", "source": "    def __eq__(self, other: object) -> bool:\n        return all(\n            [\n                self.username == getattr(other, \"username\", None),\n                self.password == getattr(other, \"password\", None),\n            ]\n        )"}, {"id": "src/requests/auth.py::HTTPDigestAuth.__ne__", "kind": "function", "name": "__ne__", "file": "src/requests/auth.py", "lineno": 353, "end_lineno": 354, "language": "python", "docstring": "", "source": "    def __ne__(self, other: Any) -> bool:\n        return not self == other"}, {"id": "src/requests/certs.py", "kind": "module", "name": "src/requests/certs.py", "file": "src/requests/certs.py", "lineno": 1, "end_lineno": 18, "language": "python", "docstring": "requests.certs\n~~~~~~~~~~~~~~\n\nThis module returns the preferred default CA certificate bundle. There is\nonly one \u2014 the one from the certifi package.\n\nIf you are packaging Requests, e.g., for a Linux distribution or a managed\nenvironment, you can change the definition of where() to return a separately\npackaged CA bundle.", "source": ""}, {"id": "src/requests/compat.py", "kind": "module", "name": "src/requests/compat.py", "file": "src/requests/compat.py", "lineno": 1, "end_lineno": 115, "language": "python", "docstring": "requests.compat\n~~~~~~~~~~~~~~~\n\nThis module previously handled import compatibility issues\nbetween Python 2 and Python 3. It remains for backwards\ncompatibility until the next major version.", "source": ""}, {"id": "src/requests/compat.py::_resolve_char_detection", "kind": "function", "name": "_resolve_char_detection", "file": "src/requests/compat.py", "lineno": 36, "end_lineno": 45, "language": "python", "docstring": "Find supported character detection libraries.", "source": "def _resolve_char_detection() -> ModuleType | None:\n    \"\"\"Find supported character detection libraries.\"\"\"\n    chardet = None\n    for lib in (\"chardet\", \"charset_normalizer\"):\n        if chardet is None:\n            try:\n                chardet = importlib.import_module(lib)\n            except ImportError:\n                pass\n    return chardet"}, {"id": "src/requests/cookies.py", "kind": "module", "name": "src/requests/cookies.py", "file": "src/requests/cookies.py", "lineno": 1, "end_lineno": 625, "language": "python", "docstring": "requests.cookies\n~~~~~~~~~~~~~~~~\n\nCompatibility code to be able to use `http.cookiejar.CookieJar` with requests.\n\nrequests.utils imports from here, so be careful with imports.", "source": ""}, {"id": "src/requests/cookies.py::MockRequest", "kind": "class", "name": "MockRequest", "file": "src/requests/cookies.py", "lineno": 31, "end_lineno": 111, "language": "python", "docstring": "Wraps a `requests.PreparedRequest` to mimic a `urllib2.Request`.\n\nThe code in `http.cookiejar.CookieJar` expects this interface in order to correctly\nmanage cookie policies, i.e., determine whether a cookie can be set, given the\ndomains of the request and the cookie.\n\nThe original request object is read-only. The client is responsible for collecting\nthe new headers via `get_new_headers()` and interpreting them appropriately. You\nprobably want `get_cookie_header`, defined below.", "source": "class MockRequest:\n    \"\"\"Wraps a `requests.PreparedRequest` to mimic a `urllib2.Request`.\n\n    The code in `http.cookiejar.CookieJar` expects this interface in order to correctly\n    manage cookie policies, i.e., determine whether a cookie can be set, given the\n    domains of the request and the cookie.\n\n    The original request object is read-only. The client is responsible for collecting\n    the new headers via `get_new_headers()` and interpreting them appropriately. You\n    probably want `get_cookie_header`, defined below.\n    \"\"\"\n\n    type: str\n\n    def __init__(self, request: PreparedRequest) -> None:\n        assert _is_prepared(request)\n        self._r = request\n        self._new_headers: dict[str, str] = {}\n        self.type = urlparse(self._r.url).scheme\n\n    def get_type(self) -> str:\n        return self.type\n\n    def get_host(self) -> str:\n        return urlparse(self._r.url).netloc\n\n    def get_origin_req_host(self) -> str:\n        return self.get_host()\n\n    def get_full_url(self) -> str:\n        # Only return the response's URL if the user hadn't set the Host\n        # header\n        if not self._r.headers.get(\"Host\"):\n            return self._r.url\n        # If they did set it, retrieve it and reconstruct the expected domain\n        host = to_native_string(self._r.headers[\"Host\"], encoding=\"utf-8\")\n        parsed = urlparse(self._r.url)\n        # Reconstruct the URL as we expect it\n        return urlunparse(\n            [\n                parsed.scheme,\n        "}, {"id": "src/requests/cookies.py::MockRequest.__init__", "kind": "function", "name": "__init__", "file": "src/requests/cookies.py", "lineno": 45, "end_lineno": 49, "language": "python", "docstring": "", "source": "    def __init__(self, request: PreparedRequest) -> None:\n        assert _is_prepared(request)\n        self._r = request\n        self._new_headers: dict[str, str] = {}\n        self.type = urlparse(self._r.url).scheme"}, {"id": "src/requests/cookies.py::MockRequest.get_type", "kind": "function", "name": "get_type", "file": "src/requests/cookies.py", "lineno": 51, "end_lineno": 52, "language": "python", "docstring": "", "source": "    def get_type(self) -> str:\n        return self.type"}, {"id": "src/requests/cookies.py::MockRequest.get_host", "kind": "function", "name": "get_host", "file": "src/requests/cookies.py", "lineno": 54, "end_lineno": 55, "language": "python", "docstring": "", "source": "    def get_host(self) -> str:\n        return urlparse(self._r.url).netloc"}, {"id": "src/requests/cookies.py::MockRequest.get_origin_req_host", "kind": "function", "name": "get_origin_req_host", "file": "src/requests/cookies.py", "lineno": 57, "end_lineno": 58, "language": "python", "docstring": "", "source": "    def get_origin_req_host(self) -> str:\n        return self.get_host()"}, {"id": "src/requests/cookies.py::MockRequest.get_full_url", "kind": "function", "name": "get_full_url", "file": "src/requests/cookies.py", "lineno": 60, "end_lineno": 78, "language": "python", "docstring": "", "source": "    def get_full_url(self) -> str:\n        # Only return the response's URL if the user hadn't set the Host\n        # header\n        if not self._r.headers.get(\"Host\"):\n            return self._r.url\n        # If they did set it, retrieve it and reconstruct the expected domain\n        host = to_native_string(self._r.headers[\"Host\"], encoding=\"utf-8\")\n        parsed = urlparse(self._r.url)\n        # Reconstruct the URL as we expect it\n        return urlunparse(\n            [\n                parsed.scheme,\n                host,\n                parsed.path,\n                parsed.params,\n                parsed.query,\n                parsed.fragment,\n            ]\n        )"}, {"id": "src/requests/cookies.py::MockRequest.is_unverifiable", "kind": "function", "name": "is_unverifiable", "file": "src/requests/cookies.py", "lineno": 80, "end_lineno": 81, "language": "python", "docstring": "", "source": "    def is_unverifiable(self) -> bool:\n        return True"}, {"id": "src/requests/cookies.py::MockRequest.has_header", "kind": "function", "name": "has_header", "file": "src/requests/cookies.py", "lineno": 83, "end_lineno": 84, "language": "python", "docstring": "", "source": "    def has_header(self, name: str) -> bool:\n        return name in self._r.headers or name in self._new_headers"}, {"id": "src/requests/cookies.py::MockRequest.get_header", "kind": "function", "name": "get_header", "file": "src/requests/cookies.py", "lineno": 86, "end_lineno": 87, "language": "python", "docstring": "", "source": "    def get_header(self, name: str, default: str | None = None) -> str | None:\n        return self._r.headers.get(name, self._new_headers.get(name, default))  # type: ignore[return-value]"}, {"id": "src/requests/cookies.py::MockRequest.add_header", "kind": "function", "name": "add_header", "file": "src/requests/cookies.py", "lineno": 89, "end_lineno": 93, "language": "python", "docstring": "cookiejar has no legitimate use for this method; add it back if you find one.", "source": "    def add_header(self, key: str, val: str) -> None:\n        \"\"\"cookiejar has no legitimate use for this method; add it back if you find one.\"\"\"\n        raise NotImplementedError(\n            \"Cookie headers should be added with add_unredirected_header()\"\n        )"}, {"id": "src/requests/cookies.py::MockRequest.add_unredirected_header", "kind": "function", "name": "add_unredirected_header", "file": "src/requests/cookies.py", "lineno": 95, "end_lineno": 96, "language": "python", "docstring": "", "source": "    def add_unredirected_header(self, name: str, value: str) -> None:\n        self._new_headers[name] = value"}, {"id": "src/requests/cookies.py::MockRequest.get_new_headers", "kind": "function", "name": "get_new_headers", "file": "src/requests/cookies.py", "lineno": 98, "end_lineno": 99, "language": "python", "docstring": "", "source": "    def get_new_headers(self) -> dict[str, str]:\n        return self._new_headers"}, {"id": "src/requests/cookies.py::MockRequest.unverifiable", "kind": "function", "name": "unverifiable", "file": "src/requests/cookies.py", "lineno": 102, "end_lineno": 103, "language": "python", "docstring": "", "source": "    def unverifiable(self) -> bool:\n        return self.is_unverifiable()"}, {"id": "src/requests/cookies.py::MockRequest.origin_req_host", "kind": "function", "name": "origin_req_host", "file": "src/requests/cookies.py", "lineno": 106, "end_lineno": 107, "language": "python", "docstring": "", "source": "    def origin_req_host(self) -> str:\n        return self.get_origin_req_host()"}, {"id": "src/requests/cookies.py::MockRequest.host", "kind": "function", "name": "host", "file": "src/requests/cookies.py", "lineno": 110, "end_lineno": 111, "language": "python", "docstring": "", "source": "    def host(self) -> str:\n        return self.get_host()"}, {"id": "src/requests/cookies.py::MockResponse", "kind": "class", "name": "MockResponse", "file": "src/requests/cookies.py", "lineno": 114, "end_lineno": 132, "language": "python", "docstring": "Wraps a `httplib.HTTPMessage` to mimic a `urllib.addinfourl`.\n\n...what? Basically, expose the parsed HTTP headers from the server response\nthe way `http.cookiejar` expects to see them.", "source": "class MockResponse:\n    \"\"\"Wraps a `httplib.HTTPMessage` to mimic a `urllib.addinfourl`.\n\n    ...what? Basically, expose the parsed HTTP headers from the server response\n    the way `http.cookiejar` expects to see them.\n    \"\"\"\n\n    def __init__(self, headers: Any) -> None:\n        \"\"\"Make a MockResponse for `cookiejar` to read.\n\n        :param headers: a httplib.HTTPMessage or analogous carrying the headers\n        \"\"\"\n        self._headers = headers\n\n    def info(self) -> Any:\n        return self._headers\n\n    def getheaders(self, name: str) -> Any:\n        self._headers.getheaders(name)"}, {"id": "src/requests/cookies.py::MockResponse.__init__", "kind": "function", "name": "__init__", "file": "src/requests/cookies.py", "lineno": 121, "end_lineno": 126, "language": "python", "docstring": "Make a MockResponse for `cookiejar` to read.\n\n:param headers: a httplib.HTTPMessage or analogous carrying the headers", "source": "    def __init__(self, headers: Any) -> None:\n        \"\"\"Make a MockResponse for `cookiejar` to read.\n\n        :param headers: a httplib.HTTPMessage or analogous carrying the headers\n        \"\"\"\n        self._headers = headers"}, {"id": "src/requests/cookies.py::MockResponse.info", "kind": "function", "name": "info", "file": "src/requests/cookies.py", "lineno": 128, "end_lineno": 129, "language": "python", "docstring": "", "source": "    def info(self) -> Any:\n        return self._headers"}, {"id": "src/requests/cookies.py::MockResponse.getheaders", "kind": "function", "name": "getheaders", "file": "src/requests/cookies.py", "lineno": 131, "end_lineno": 132, "language": "python", "docstring": "", "source": "    def getheaders(self, name: str) -> Any:\n        self._headers.getheaders(name)"}, {"id": "src/requests/cookies.py::extract_cookies_to_jar", "kind": "function", "name": "extract_cookies_to_jar", "file": "src/requests/cookies.py", "lineno": 135, "end_lineno": 150, "language": "python", "docstring": "Extract the cookies from the response into a CookieJar.\n\n:param jar: http.cookiejar.CookieJar (not necessarily a RequestsCookieJar)\n:param request: our own requests.Request object\n:param response: urllib3.HTTPResponse object", "source": "def extract_cookies_to_jar(\n    jar: CookieJar, request: PreparedRequest, response: Any\n) -> None:\n    \"\"\"Extract the cookies from the response into a CookieJar.\n\n    :param jar: http.cookiejar.CookieJar (not necessarily a RequestsCookieJar)\n    :param request: our own requests.Request object\n    :param response: urllib3.HTTPResponse object\n    \"\"\"\n    if not (hasattr(response, \"_original_response\") and response._original_response):\n        return\n    # the _original_response field is the wrapped httplib.HTTPResponse object,\n    req = MockRequest(request)\n    # pull out the HTTPMessage with the headers and put it in the mock:\n    res = MockResponse(response._original_response.msg)\n    jar.extract_cookies(res, req)  # type: ignore[arg-type]"}, {"id": "src/requests/cookies.py::get_cookie_header", "kind": "function", "name": "get_cookie_header", "file": "src/requests/cookies.py", "lineno": 153, "end_lineno": 161, "language": "python", "docstring": "Produce an appropriate Cookie header string to be sent with `request`, or None.\n\n:rtype: str", "source": "def get_cookie_header(jar: CookieJar, request: PreparedRequest) -> str | None:\n    \"\"\"\n    Produce an appropriate Cookie header string to be sent with `request`, or None.\n\n    :rtype: str\n    \"\"\"\n    r = MockRequest(request)\n    jar.add_cookie_header(r)  # type: ignore[arg-type]\n    return r.get_new_headers().get(\"Cookie\")"}, {"id": "src/requests/cookies.py::remove_cookie_by_name", "kind": "function", "name": "remove_cookie_by_name", "file": "src/requests/cookies.py", "lineno": 164, "end_lineno": 182, "language": "python", "docstring": "Unsets a cookie by name, by default over all domains and paths.\n\nWraps CookieJar.clear(), is O(n).", "source": "def remove_cookie_by_name(\n    cookiejar: CookieJar, name: str, domain: str | None = None, path: str | None = None\n) -> None:\n    \"\"\"Unsets a cookie by name, by default over all domains and paths.\n\n    Wraps CookieJar.clear(), is O(n).\n    \"\"\"\n    clearables: list[tuple[str, str, str]] = []\n    for cookie in cookiejar:\n        if cookie.name != name:\n            continue\n        if domain is not None and domain != cookie.domain:\n            continue\n        if path is not None and path != cookie.path:\n            continue\n        clearables.append((cookie.domain, cookie.path, cookie.name))\n\n    for domain, path, name in clearables:\n        cookiejar.clear(domain, path, name)"}, {"id": "src/requests/cookies.py::CookieConflictError", "kind": "class", "name": "CookieConflictError", "file": "src/requests/cookies.py", "lineno": 185, "end_lineno": 188, "language": "python", "docstring": "There are two cookies that meet the criteria specified in the cookie jar.\nUse .get and .set and include domain and path args in order to be more specific.", "source": "class CookieConflictError(RuntimeError):\n    \"\"\"There are two cookies that meet the criteria specified in the cookie jar.\n    Use .get and .set and include domain and path args in order to be more specific.\n    \"\"\""}, {"id": "src/requests/cookies.py::RequestsCookieJar", "kind": "class", "name": "RequestsCookieJar", "file": "src/requests/cookies.py", "lineno": 191, "end_lineno": 476, "language": "python", "docstring": "Compatibility class; is a http.cookiejar.CookieJar, but exposes a dict\ninterface.\n\nThis is the CookieJar we create by default for requests and sessions that\ndon't specify one, since some clients may expect response.cookies and\nsession.cookies to support dict operations.\n\nRequests does not use the dict interface internally; it's just for\ncompatibility with external client code. All requests code should work\nout of the box with externally provided instances of ``CookieJar``, e.g.\n``LWPCookieJar`` and ``FileCookieJar``.\n\nUnlike a regular CookieJar, this class is pickleable.\n\n.. warning:: dictionary operations that are normally O(1) may be O(n).", "source": "class RequestsCookieJar(CookieJar, MutableMapping[str, str | None]):  # type: ignore[misc]\n    \"\"\"Compatibility class; is a http.cookiejar.CookieJar, but exposes a dict\n    interface.\n\n    This is the CookieJar we create by default for requests and sessions that\n    don't specify one, since some clients may expect response.cookies and\n    session.cookies to support dict operations.\n\n    Requests does not use the dict interface internally; it's just for\n    compatibility with external client code. All requests code should work\n    out of the box with externally provided instances of ``CookieJar``, e.g.\n    ``LWPCookieJar`` and ``FileCookieJar``.\n\n    Unlike a regular CookieJar, this class is pickleable.\n\n    .. warning:: dictionary operations that are normally O(1) may be O(n).\n    \"\"\"\n\n    _policy: CookiePolicy\n\n    def get(  # type: ignore[override]\n        self,\n        name: str,\n        default: str | None = None,\n        domain: str | None = None,\n        path: str | None = None,\n    ) -> str | None:\n        \"\"\"Dict-like get() that also supports optional domain and path args in\n        order to resolve naming collisions from using one cookie jar over\n        multiple domains.\n\n        .. warning:: operation is O(n), not O(1).\n        \"\"\"\n        try:\n            return self._find_no_duplicates(name, domain, path)\n        except KeyError:\n            return default\n\n    def set(\n        self, name: str, value: str | Morsel[dict[str, str]] | None, **kwargs: Any\n    ) -> Co"}, {"id": "src/requests/cookies.py::RequestsCookieJar.get", "kind": "function", "name": "get", "file": "src/requests/cookies.py", "lineno": 211, "end_lineno": 227, "language": "python", "docstring": "Dict-like get() that also supports optional domain and path args in\norder to resolve naming collisions from using one cookie jar over\nmultiple domains.\n\n.. warning:: operation is O(n), not O(1).", "source": "    def get(  # type: ignore[override]\n        self,\n        name: str,\n        default: str | None = None,\n        domain: str | None = None,\n        path: str | None = None,\n    ) -> str | None:\n        \"\"\"Dict-like get() that also supports optional domain and path args in\n        order to resolve naming collisions from using one cookie jar over\n        multiple domains.\n\n        .. warning:: operation is O(n), not O(1).\n        \"\"\"\n        try:\n            return self._find_no_duplicates(name, domain, path)\n        except KeyError:\n            return default"}, {"id": "src/requests/cookies.py::RequestsCookieJar.set", "kind": "function", "name": "set", "file": "src/requests/cookies.py", "lineno": 229, "end_lineno": 248, "language": "python", "docstring": "Dict-like set() that also supports optional domain and path args in\norder to resolve naming collisions from using one cookie jar over\nmultiple domains.", "source": "    def set(\n        self, name: str, value: str | Morsel[dict[str, str]] | None, **kwargs: Any\n    ) -> Cookie | None:\n        \"\"\"Dict-like set() that also supports optional domain and path args in\n        order to resolve naming collisions from using one cookie jar over\n        multiple domains.\n        \"\"\"\n        # support client code that unsets cookies by assignment of a None value:\n        if value is None:\n            remove_cookie_by_name(\n                self, name, domain=kwargs.get(\"domain\"), path=kwargs.get(\"path\")\n            )\n            return\n\n        if isinstance(value, Morsel):\n            c = morsel_to_cookie(value)\n        else:\n            c = create_cookie(name, value, **kwargs)\n        self.set_cookie(c)\n        return c"}, {"id": "src/requests/cookies.py::RequestsCookieJar.iterkeys", "kind": "function", "name": "iterkeys", "file": "src/requests/cookies.py", "lineno": 250, "end_lineno": 257, "language": "python", "docstring": "Dict-like iterkeys() that returns an iterator of names of cookies\nfrom the jar.\n\n.. seealso:: itervalues() and iteritems().", "source": "    def iterkeys(self) -> Iterator[str]:\n        \"\"\"Dict-like iterkeys() that returns an iterator of names of cookies\n        from the jar.\n\n        .. seealso:: itervalues() and iteritems().\n        \"\"\"\n        for cookie in iter(self):\n            yield cookie.name"}, {"id": "src/requests/cookies.py::RequestsCookieJar.keys", "kind": "function", "name": "keys", "file": "src/requests/cookies.py", "lineno": 259, "end_lineno": 265, "language": "python", "docstring": "Dict-like keys() that returns a list of names of cookies from the\njar.\n\n.. seealso:: values() and items().", "source": "    def keys(self) -> list[str]:  # type: ignore[overr
