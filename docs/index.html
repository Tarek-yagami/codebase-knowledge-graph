ecks if the status code of the response is between\n400 and 600 to see if there was a client error or a server error. If\nthe status code, is between 200 and 400, this will return True. This\nis **not** a check to see if the response code is ``200 OK``.", "source": "    def __nonzero__(self) -> bool:\n        \"\"\"Returns True if :attr:`status_code` is less than 400.\n\n        This attribute checks if the status code of the response is between\n        400 and 600 to see if there was a client error or a server error. If\n        the status code, is between 200 and 400, this will return True. This\n        is **not** a check to see if the response code is ``200 OK``.\n        \"\"\"\n        return self.ok"}, {"id": "src/requests/models.py::Response.__iter__", "kind": "function", "name": "__iter__", "file": "src/requests/models.py", "lineno": 857, "end_lineno": 859, "language": "python", "docstring": "Allows you to use a response as an iterator.", "source": "    def __iter__(self) -> Iterator[bytes]:\n        \"\"\"Allows you to use a response as an iterator.\"\"\"\n        return self.iter_content(128)"}, {"id": "src/requests/models.py::Response.ok", "kind": "function", "name": "ok", "file": "src/requests/models.py", "lineno": 862, "end_lineno": 874, "language": "python", "docstring": "Returns True if :attr:`status_code` is less than 400, False if not.\n\nThis attribute checks if the status code of the response is between\n400 and 600 to see if there was a client error or a server error. If\nthe status code is between 200 and 400, this will return True. This\nis **not** a check to see if the response code is ``200 OK``.", "source": "    def ok(self) -> bool:\n        \"\"\"Returns True if :attr:`status_code` is less than 400, False if not.\n\n        This attribute checks if the status code of the response is between\n        400 and 600 to see if there was a client error or a server error. If\n        the status code is between 200 and 400, this will return True. This\n        is **not** a check to see if the response code is ``200 OK``.\n        \"\"\"\n        try:\n            self.raise_for_status()\n        except HTTPError:\n            return False\n        return True"}, {"id": "src/requests/models.py::Response.is_redirect", "kind": "function", "name": "is_redirect", "file": "src/requests/models.py", "lineno": 877, "end_lineno": 881, "language": "python", "docstring": "True if this Response is a well-formed HTTP redirect that could have\nbeen processed automatically (by :meth:`Session.resolve_redirects`).", "source": "    def is_redirect(self) -> bool:\n        \"\"\"True if this Response is a well-formed HTTP redirect that could have\n        been processed automatically (by :meth:`Session.resolve_redirects`).\n        \"\"\"\n        return \"location\" in self.headers and self.status_code in REDIRECT_STATI"}, {"id": "src/requests/models.py::Response.is_permanent_redirect", "kind": "function", "name": "is_permanent_redirect", "file": "src/requests/models.py", "lineno": 884, "end_lineno": 889, "language": "python", "docstring": "True if this Response one of the permanent versions of redirect.", "source": "    def is_permanent_redirect(self) -> bool:\n        \"\"\"True if this Response one of the permanent versions of redirect.\"\"\"\n        return \"location\" in self.headers and self.status_code in (\n            codes.moved_permanently,\n            codes.permanent_redirect,\n        )"}, {"id": "src/requests/models.py::Response.next", "kind": "function", "name": "next", "file": "src/requests/models.py", "lineno": 892, "end_lineno": 894, "language": "python", "docstring": "Returns a PreparedRequest for the next request in a redirect chain, if there is one.", "source": "    def next(self) -> PreparedRequest | None:\n        \"\"\"Returns a PreparedRequest for the next request in a redirect chain, if there is one.\"\"\"\n        return self._next"}, {"id": "src/requests/models.py::Response.apparent_encoding", "kind": "function", "name": "apparent_encoding", "file": "src/requests/models.py", "lineno": 897, "end_lineno": 904, "language": "python", "docstring": "The apparent encoding, provided by the charset_normalizer or chardet libraries.", "source": "    def apparent_encoding(self) -> str | None:\n        \"\"\"The apparent encoding, provided by the charset_normalizer or chardet libraries.\"\"\"\n        if chardet is not None:\n            return chardet.detect(self.content)[\"encoding\"]\n        else:\n            # If no character detection library is available, we'll fall back\n            # to a standard Python utf-8 str.\n            return \"utf-8\""}, {"id": "src/requests/models.py::Response.iter_content", "kind": "function", "name": "iter_content", "file": "src/requests/models.py", "lineno": 914, "end_lineno": 977, "language": "python", "docstring": "Iterates over the response data.  When stream=True is set on the\nrequest, this avoids reading the content at once into memory for\nlarge responses.  The chunk size is the number of bytes it should\nread into memory.  This is not necessarily the length of each item\nreturned as decoding can take place.\n\nchunk_size must be of type int or None. A value of None will\nfunction differently depending on the value of `stream`.\nstream=True will read data as it arrives in whatever size the\nchunks are received. If stream=False, data is returned as\na single chunk.\n\nIf decode_unicode is True, content will be decoded using encoding\ninformation from the response. If no encoding information is available,\nbytes will be returned. This can be bypassed by manually setting\n`encoding` on the response.", "source": "    def iter_content(\n        self, chunk_size: int | None = 1, decode_unicode: bool = False\n    ) -> Iterator[str | bytes]:\n        \"\"\"Iterates over the response data.  When stream=True is set on the\n        request, this avoids reading the content at once into memory for\n        large responses.  The chunk size is the number of bytes it should\n        read into memory.  This is not necessarily the length of each item\n        returned as decoding can take place.\n\n        chunk_size must be of type int or None. A value of None will\n        function differently depending on the value of `stream`.\n        stream=True will read data as it arrives in whatever size the\n        chunks are received. If stream=False, data is returned as\n        a single chunk.\n\n        If decode_unicode is True, content will be decoded using encoding\n        information from the response. If no encoding information is available,\n        bytes will be returned. This can be bypassed by manually setting\n        `encoding` on the response.\n        \"\"\"\n\n        def generate() -> Generator[bytes, None, None]:\n            # Special case for urllib3.\n            if hasattr(self.raw, \"stream\"):\n                try:\n                    yield from self.raw.stream(chunk_size, decode_content=True)\n                except ProtocolError as e:\n                    raise ChunkedEncodingError(e)\n                except DecodeError as e:\n                    raise ContentDecodingError(e)\n                except ReadTimeoutE"}, {"id": "src/requests/models.py::Response.iter_content.generate", "kind": "function", "name": "generate", "file": "src/requests/models.py", "lineno": 935, "end_lineno": 956, "language": "python", "docstring": "", "source": "        def generate() -> Generator[bytes, None, None]:\n            # Special case for urllib3.\n            if hasattr(self.raw, \"stream\"):\n                try:\n                    yield from self.raw.stream(chunk_size, decode_content=True)\n                except ProtocolError as e:\n                    raise ChunkedEncodingError(e)\n                except DecodeError as e:\n                    raise ContentDecodingError(e)\n                except ReadTimeoutError as e:\n                    raise ConnectionError(e)\n                except SSLError as e:\n                    raise RequestsSSLError(e)\n            else:\n                # Standard file-like object.\n                while True:\n                    chunk = self.raw.read(chunk_size)\n                    if not chunk:\n                        break\n                    yield chunk\n\n            self._content_consumed = True"}, {"id": "src/requests/models.py::Response.iter_lines", "kind": "function", "name": "iter_lines", "file": "src/requests/models.py", "lineno": 994, "end_lineno": 1032, "language": "python", "docstring": "Iterates over the response data, one line at a time.  When\nstream=True is set on the request, this avoids reading the\ncontent at once into memory for large responses.\n\nThe decode_unicode param works the same as in `iter_content`, with the\nsame caveats.\n\n.. note:: This method is not reentrant safe.", "source": "    def iter_lines(\n        self,\n        chunk_size: int = ITER_CHUNK_SIZE,\n        decode_unicode: bool = False,\n        delimiter: str | bytes | None = None,\n    ) -> Iterator[str | bytes]:\n        \"\"\"Iterates over the response data, one line at a time.  When\n        stream=True is set on the request, this avoids reading the\n        content at once into memory for large responses.\n\n        The decode_unicode param works the same as in `iter_content`, with the\n        same caveats.\n\n        .. note:: This method is not reentrant safe.\n        \"\"\"\n\n        pending: str | bytes | None = None\n\n        for chunk in self.iter_content(\n            chunk_size=chunk_size, decode_unicode=decode_unicode\n        ):\n            if pending is not None:\n                # TODO: remove cast after iter_lines rewrite\n                chunk = cast(\"str | bytes\", pending + chunk)\n\n            if delimiter:\n                lines = chunk.split(delimiter)  # type: ignore[arg-type]\n            else:\n                lines = chunk.splitlines()\n\n            if lines and lines[-1] and chunk and lines[-1][-1] == chunk[-1]:\n                pending = lines.pop()\n            else:\n                pending = None\n\n            yield from lines\n\n        if pending is not None:\n            yield pending"}, {"id": "src/requests/models.py::Response.content", "kind": "function", "name": "content", "file": "src/requests/models.py", "lineno": 1035, "end_lineno": 1051, "language": "python", "docstring": "Content of the response, in bytes.", "source": "    def content(self) -> bytes:\n        \"\"\"Content of the response, in bytes.\"\"\"\n\n        if self._content is False:\n            # Read the contents.\n            if self._content_consumed:\n                raise RuntimeError(\"The content for this response was already consumed\")\n\n            if self.status_code == 0 or self.raw is None:\n                self._content = None\n            else:\n                self._content = b\"\".join(self.iter_content(CONTENT_CHUNK_SIZE)) or b\"\"\n\n        self._content_consumed = True\n        # don't need to release the connection; that's been handled by urllib3\n        # since we exhausted the data.\n        return self._content  # type: ignore[return-value]"}, {"id": "src/requests/models.py::Response.text", "kind": "function", "name": "text", "file": "src/requests/models.py", "lineno": 1054, "end_lineno": 1089, "language": "python", "docstring": "Content of the response, in unicode.\n\nIf Response.encoding is None, encoding will be guessed using\n``charset_normalizer`` or ``chardet``.\n\nThe encoding of the response content is determined based solely on HTTP\nheaders, following RFC 2616 to the letter. If you can take advantage of\nnon-HTTP knowledge to make a better guess at the encoding, you should\nset ``r.encoding`` appropriately before accessing this property.", "source": "    def text(self) -> str:\n        \"\"\"Content of the response, in unicode.\n\n        If Response.encoding is None, encoding will be guessed using\n        ``charset_normalizer`` or ``chardet``.\n\n        The encoding of the response content is determined based solely on HTTP\n        headers, following RFC 2616 to the letter. If you can take advantage of\n        non-HTTP knowledge to make a better guess at the encoding, you should\n        set ``r.encoding`` appropriately before accessing this property.\n        \"\"\"\n\n        # Try charset from content-type\n        content = None\n        encoding = self.encoding\n\n        if not self.content:\n            return \"\"\n\n        # Fallback to auto-detected encoding.\n        if self.encoding is None:\n            encoding = self.apparent_encoding\n\n        # Decode unicode from given encoding.\n        try:\n            content = str(self.content, encoding or \"utf-8\", errors=\"replace\")\n        except (LookupError, TypeError):\n            # A LookupError is raised if the encoding was not found which could\n            # indicate a misspelling or similar mistake.\n            #\n            # A TypeError can be raised if encoding is None\n            #\n            # So we try blindly encoding.\n            content = str(self.content, errors=\"replace\")\n\n        return content"}, {"id": "src/requests/models.py::Response.json", "kind": "function", "name": "json", "file": "src/requests/models.py", "lineno": 1091, "end_lineno": 1124, "language": "python", "docstring": "Decodes the JSON response body (if any) as a Python object.\n\nThis may return a dictionary, list, etc. depending on what is in the response.\n\n:param \\*\\*kwargs: Optional arguments that ``json.loads`` takes.\n:raises requests.exceptions.JSONDecodeError: If the response body does not\n    contain valid json.", "source": "    def json(self, **kwargs: Any) -> Any:\n        r\"\"\"Decodes the JSON response body (if any) as a Python object.\n\n        This may return a dictionary, list, etc. depending on what is in the response.\n\n        :param \\*\\*kwargs: Optional arguments that ``json.loads`` takes.\n        :raises requests.exceptions.JSONDecodeError: If the response body does not\n            contain valid json.\n        \"\"\"\n\n        if not self.encoding and self.content and len(self.content) > 3:\n            # No encoding set. JSON RFC 4627 section 3 states we should expect\n            # UTF-8, -16 or -32. Detect which one to use; If the detection or\n            # decoding fails, fall back to `self.text` (using charset_normalizer to make\n            # a best guess).\n            encoding = guess_json_utf(self.content)\n            if encoding is not None:\n                try:\n                    return complexjson.loads(self.content.decode(encoding), **kwargs)\n                except UnicodeDecodeError:\n                    # Wrong UTF codec detected; usually because it's not UTF-8\n                    # but some other 8-bit codec.  This is an RFC violation,\n                    # and the server didn't bother to tell us what codec *was*\n                    # used.\n                    pass\n                except JSONDecodeError as e:\n                    raise RequestsJSONDecodeError(e.msg, e.doc, e.pos)\n\n        try:\n            return complexjson.loads(self.text, **kwargs)\n        except JSONDecodeError as"}, {"id": "src/requests/models.py::Response.links", "kind": "function", "name": "links", "file": "src/requests/models.py", "lineno": 1127, "end_lineno": 1142, "language": "python", "docstring": "Returns the parsed header links of the response, if any.", "source": "    def links(self) -> dict[str, dict[str, str]]:\n        \"\"\"Returns the parsed header links of the response, if any.\"\"\"\n\n        header = self.headers.get(\"link\")\n\n        resolved_links: dict[str, dict[str, str]] = {}\n\n        if header:\n            links = parse_header_links(header)\n\n            for link in links:\n                key = link.get(\"rel\") or link.get(\"url\")\n                if key is not None:\n                    resolved_links[key] = link\n\n        return resolved_links"}, {"id": "src/requests/models.py::Response.raise_for_status", "kind": "function", "name": "raise_for_status", "file": "src/requests/models.py", "lineno": 1144, "end_lineno": 1171, "language": "python", "docstring": "Raises :class:`HTTPError`, if one occurred.", "source": "    def raise_for_status(self) -> None:\n        \"\"\"Raises :class:`HTTPError`, if one occurred.\"\"\"\n\n        http_error_msg = \"\"\n        if isinstance(self.reason, bytes):\n            # We attempt to decode utf-8 first because some servers\n            # choose to localize their reason strings. If the string\n            # isn't utf-8, we fall back to iso-8859-1 for all other\n            # encodings. (See PR #3538)\n            try:\n                reason = self.reason.decode(\"utf-8\")\n            except UnicodeDecodeError:\n                reason = self.reason.decode(\"iso-8859-1\")\n        else:\n            reason = self.reason\n\n        if 400 <= self.status_code < 500:\n            http_error_msg = (\n                f\"{self.status_code} Client Error: {reason} for url: {self.url}\"\n            )\n\n        elif 500 <= self.status_code < 600:\n            http_error_msg = (\n                f\"{self.status_code} Server Error: {reason} for url: {self.url}\"\n            )\n\n        if http_error_msg:\n            raise HTTPError(http_error_msg, response=self)"}, {"id": "src/requests/models.py::Response.close", "kind": "function", "name": "close", "file": "src/requests/models.py", "lineno": 1173, "end_lineno": 1184, "language": "python", "docstring": "Releases the connection back to the pool. Once this method has been\ncalled the underlying ``raw`` object must not be accessed again.\n\n*Note: Should not normally need to be called explicitly.*", "source": "    def close(self) -> None:\n        \"\"\"Releases the connection back to the pool. Once this method has been\n        called the underlying ``raw`` object must not be accessed again.\n\n        *Note: Should not normally need to be called explicitly.*\n        \"\"\"\n        if not self._content_consumed:\n            self.raw.close()\n\n        release_conn = getattr(self.raw, \"release_conn\", None)\n        if release_conn is not None:\n            release_conn()"}, {"id": "src/requests/packages.py", "kind": "module", "name": "src/requests/packages.py", "file": "src/requests/packages.py", "lineno": 1, "end_lineno": 23, "language": "python", "docstring": "", "source": ""}, {"id": "src/requests/sessions.py", "kind": "module", "name": "src/requests/sessions.py", "file": "src/requests/sessions.py", "lineno": 1, "end_lineno": 920, "language": "python", "docstring": "requests.sessions\n~~~~~~~~~~~~~~~~~\n\nThis module provides a Session object to manage and persist settings across\nrequests (cookies, auth, proxies).", "source": ""}, {"id": "src/requests/sessions.py::merge_setting", "kind": "function", "name": "merge_setting", "file": "src/requests/sessions.py", "lineno": 76, "end_lineno": 105, "language": "python", "docstring": "Determines appropriate setting for a given request, taking into account\nthe explicit setting on that request, and the setting in the session. If a\nsetting is a dictionary, they will be merged together using `dict_class`", "source": "def merge_setting(\n    request_setting: Any, session_setting: Any, dict_class: type = OrderedDict\n) -> Any:\n    \"\"\"Determines appropriate setting for a given request, taking into account\n    the explicit setting on that request, and the setting in the session. If a\n    setting is a dictionary, they will be merged together using `dict_class`\n    \"\"\"\n\n    if session_setting is None:\n        return request_setting\n\n    if request_setting is None:\n        return session_setting\n\n    # Bypass if not a dictionary (e.g. verify)\n    if not (\n        isinstance(session_setting, Mapping) and isinstance(request_setting, Mapping)\n    ):\n        return request_setting\n\n    merged_setting = dict_class(to_key_val_list(session_setting))  # type: ignore[arg-type]  # isinstance narrows Any to Mapping[Unknown]\n    merged_setting.update(to_key_val_list(request_setting))  # type: ignore[arg-type]\n\n    # Remove keys that are set to None. Extract keys first to avoid altering\n    # the dictionary during iteration.\n    none_keys = [k for (k, v) in merged_setting.items() if v is None]\n    for key in none_keys:\n        del merged_setting[key]\n\n    return merged_setting"}, {"id": "src/requests/sessions.py::merge_hooks", "kind": "function", "name": "merge_hooks", "file": "src/requests/sessions.py", "lineno": 108, "end_lineno": 124, "language": "python", "docstring": "Properly merges both requests and session hooks.\n\nThis is necessary because when request_hooks == {'response': []}, the\nmerge breaks Session hooks entirely.", "source": "def merge_hooks(\n    request_hooks: _t.HooksType,\n    session_hooks: _t.HooksType,\n    dict_class: type = OrderedDict,\n) -> _t.HooksType:\n    \"\"\"Properly merges both requests and session hooks.\n\n    This is necessary because when request_hooks == {'response': []}, the\n    merge breaks Session hooks entirely.\n    \"\"\"\n    if session_hooks is None or session_hooks.get(\"response\") == []:\n        return request_hooks\n\n    if request_hooks is None or request_hooks.get(\"response\") == []:\n        return session_hooks\n\n    return merge_setting(request_hooks, session_hooks, dict_class)"}, {"id": "src/requests/sessions.py::SessionRedirectMixin", "kind": "class", "name": "SessionRedirectMixin", "file": "src/requests/sessions.py", "lineno": 127, "end_lineno": 392, "language": "python", "docstring": "", "source": "class SessionRedirectMixin:\n    max_redirects: int\n    trust_env: bool\n    cookies: RequestsCookieJar\n\n    def send(self, request: PreparedRequest, **kwargs: Any) -> Response: ...\n\n    def get_redirect_target(self, resp: Response) -> str | None:\n        \"\"\"Receives a Response. Returns a redirect URI or ``None``\"\"\"\n        # Due to the nature of how requests processes redirects this method will\n        # be called at least once upon the original response and at least twice\n        # on each subsequent redirect response (if any).\n        # If a custom mixin is used to handle this logic, it may be advantageous\n        # to cache the redirect location onto the response object as a private\n        # attribute.\n        if resp.is_redirect:\n            location = resp.headers[\"location\"]\n            # Currently the underlying http module on py3 decode headers\n            # in latin1, but empirical evidence suggests that latin1 is very\n            # rarely used with non-ASCII characters in HTTP headers.\n            # It is more likely to get UTF8 header rather than latin1.\n            # This causes incorrect handling of UTF8 encoded location headers.\n            # To solve this, we re-encode the location in latin1.\n            location = location.encode(\"latin1\")\n            return to_native_string(location, \"utf8\")\n        return None\n\n    def should_strip_auth(self, old_url: str, new_url: str) -> bool:\n        \"\"\"Decide whether Authorization header should be removed when redirectin"}, {"id": "src/requests/sessions.py::SessionRedirectMixin.send", "kind": "function", "name": "send", "file": "src/requests/sessions.py", "lineno": 132, "end_lineno": 132, "language": "python", "docstring": "", "source": "    def send(self, request: PreparedRequest, **kwargs: Any) -> Response: ..."}, {"id": "src/requests/sessions.py::SessionRedirectMixin.get_redirect_target", "kind": "function", "name": "get_redirect_target", "file": "src/requests/sessions.py", "lineno": 134, "end_lineno": 152, "language": "python", "docstring": "Receives a Response. Returns a redirect URI or ``None``", "source": "    def get_redirect_target(self, resp: Response) -> str | None:\n        \"\"\"Receives a Response. Returns a redirect URI or ``None``\"\"\"\n        # Due to the nature of how requests processes redirects this method will\n        # be called at least once upon the original response and at least twice\n        # on each subsequent redirect response (if any).\n        # If a custom mixin is used to handle this logic, it may be advantageous\n        # to cache the redirect location onto the response object as a private\n        # attribute.\n        if resp.is_redirect:\n            location = resp.headers[\"location\"]\n            # Currently the underlying http module on py3 decode headers\n            # in latin1, but empirical evidence suggests that latin1 is very\n            # rarely used with non-ASCII characters in HTTP headers.\n            # It is more likely to get UTF8 header rather than latin1.\n            # This causes incorrect handling of UTF8 encoded location headers.\n            # To solve this, we re-encode the location in latin1.\n            location = location.encode(\"latin1\")\n            return to_native_string(location, \"utf8\")\n        return None"}, {"id": "src/requests/sessions.py::SessionRedirectMixin.should_strip_auth", "kind": "function", "name": "should_strip_auth", "file": "src/requests/sessions.py", "lineno": 154, "end_lineno": 184, "language": "python", "docstring": "Decide whether Authorization header should be removed when redirecting", "source": "    def should_strip_auth(self, old_url: str, new_url: str) -> bool:\n        \"\"\"Decide whether Authorization header should be removed when redirecting\"\"\"\n        old_parsed = urlparse(old_url)\n        new_parsed = urlparse(new_url)\n        if old_parsed.hostname != new_parsed.hostname:\n            return True\n        # Special case: allow http -> https redirect when using the standard\n        # ports. This isn't specified by RFC 7235, but is kept to avoid\n        # breaking backwards compatibility with older versions of requests\n        # that allowed any redirects on the same host.\n        if (\n            old_parsed.scheme == \"http\"\n            and old_parsed.port in (80, None)\n            and new_parsed.scheme == \"https\"\n            and new_parsed.port in (443, None)\n        ):\n            return False\n\n        # Handle default port usage corresponding to scheme.\n        changed_port = old_parsed.port != new_parsed.port\n        changed_scheme = old_parsed.scheme != new_parsed.scheme\n        default_port = (DEFAULT_PORTS.get(old_parsed.scheme, None), None)\n        if (\n            not changed_scheme\n            and old_parsed.port in default_port\n            and new_parsed.port in default_port\n        ):\n            return False\n\n        # Standard case: root URI must match\n        return changed_port or changed_scheme"}, {"id": "src/requests/sessions.py::SessionRedirectMixin.resolve_redirects", "kind": "function", "name": "resolve_redirects", "file": "src/requests/sessions.py", "lineno": 186, "end_lineno": 307, "language": "python", "docstring": "Receives a Response. Returns a generator of Responses or Requests.", "source": "    def resolve_redirects(\n        self,\n        resp: Response,\n        req: PreparedRequest,\n        stream: bool = False,\n        timeout: _t.TimeoutType = None,\n        verify: _t.VerifyType = True,\n        cert: _t.CertType = None,\n        proxies: dict[str, str] | None = None,\n        yield_requests: bool = False,\n        **adapter_kwargs: Any,\n    ) -> Generator[Response, None, None]:\n        \"\"\"Receives a Response. Returns a generator of Responses or Requests.\"\"\"\n\n        hist: list[Response] = []  # keep track of history\n\n        url = self.get_redirect_target(resp)\n        previous_fragment = urlparse(req.url).fragment\n        while url:\n            prepared_request = req.copy()\n\n            # Update history and keep track of redirects.\n            resp.history = hist[:]\n            hist.append(resp)\n\n            try:\n                resp.content  # Consume socket so it can be released\n            except (ChunkedEncodingError, ContentDecodingError, RuntimeError):\n                resp.raw.read(decode_content=False)\n\n            if len(resp.history) >= self.max_redirects:\n                raise TooManyRedirects(\n                    f\"Exceeded {self.max_redirects} redirects.\", response=resp\n                )\n\n            # Release the connection back into the pool.\n            resp.close()\n\n            # Handle redirection without scheme (see: RFC 1808 Section 4)\n            if url.startswith(\"//\"):\n                parsed_rurl = urlparse(resp.url)\n                url = "}, {"id": "src/requests/sessions.py::SessionRedirectMixin.rebuild_auth", "kind": "function", "name": "rebuild_auth", "file": "src/requests/sessions.py", "lineno": 309, "end_lineno": 332, "language": "python", "docstring": "When being redirected we may want to strip authentication from the\nrequest to avoid leaking credentials. This method intelligently removes\nand reapplies authentication where possible to avoid credential loss.", "source": "    def rebuild_auth(\n        self, prepared_request: PreparedRequest, response: Response\n    ) -> None:\n        \"\"\"When being redirected we may want to strip authentication from the\n        request to avoid leaking credentials. This method intelligently removes\n        and reapplies authentication where possible to avoid credential loss.\n        \"\"\"\n        original_request = response.request\n        assert _is_prepared(original_request)\n        assert _is_prepared(prepared_request)\n\n        headers = prepared_request.headers\n        original_url = original_request.url\n        url = prepared_request.url\n\n        if \"Authorization\" in headers and self.should_strip_auth(original_url, url):\n            # If we get redirected to a new host, we should strip out any\n            # authentication headers.\n            del headers[\"Authorization\"]\n\n        # .netrc might have more auth for us on our new host.\n        new_auth = get_netrc_auth(url) if self.trust_env else None\n        if new_auth is not None:\n            prepared_request.prepare_auth(new_auth)"}, {"id": "src/requests/sessions.py::SessionRedirectMixin.rebuild_proxies", "kind": "function", "name": "rebuild_proxies", "file": "src/requests/sessions.py", "lineno": 334, "end_lineno": 368, "language": "python", "docstring": "This method re-evaluates the proxy configuration by considering the\nenvironment variables. If we are redirected to a URL covered by\nNO_PROXY, we strip the proxy configuration. Otherwise, we set missing\nproxy keys for this URL (in case they were stripped by a previous\nredirect).\n\nThis method also replaces the Proxy-Authorization header where\nnecessary.\n\n:rtype: dict", "source": "    def rebuild_proxies(\n        self,\n        prepared_request: PreparedRequest,\n        proxies: dict[str, str] | None,\n    ) -> dict[str, str]:\n        \"\"\"This method re-evaluates the proxy configuration by considering the\n        environment variables. If we are redirected to a URL covered by\n        NO_PROXY, we strip the proxy configuration. Otherwise, we set missing\n        proxy keys for this URL (in case they were stripped by a previous\n        redirect).\n\n        This method also replaces the Proxy-Authorization header where\n        necessary.\n\n        :rtype: dict\n        \"\"\"\n        assert _is_prepared(prepared_request)\n        headers = prepared_request.headers\n        scheme = urlparse(prepared_request.url).scheme\n        new_proxies = resolve_proxies(prepared_request, proxies, self.trust_env)\n\n        if \"Proxy-Authorization\" in headers:\n            del headers[\"Proxy-Authorization\"]\n\n        try:\n            username, password = get_auth_from_url(new_proxies[scheme])\n        except KeyError:\n            username, password = None, None\n\n        # urllib3 handles proxy authorization for us in the standard adapter.\n        # Avoid appending this to TLS tunneled requests where it may be leaked.\n        if not scheme.startswith(\"https\") and username and password:\n            headers[\"Proxy-Authorization\"] = _basic_auth_str(username, password)\n\n        return new_proxies"}, {"id": "src/requests/sessions.py::SessionRedirectMixin.rebuild_method", "kind": "function", "name": "rebuild_method", "file": "src/requests/sessions.py", "lineno": 370, "end_lineno": 392, "language": "python", "docstring": "When being redirected we may want to change the method of the request\nbased on certain specs or browser behavior.", "source": "    def rebuild_method(\n        self, prepared_request: PreparedRequest, response: Response\n    ) -> None:\n        \"\"\"When being redirected we may want to change the method of the request\n        based on certain specs or browser behavior.\n        \"\"\"\n        method = prepared_request.method\n\n        # https://tools.ietf.org/html/rfc7231#section-6.4.4\n        if response.status_code == codes.see_other and method != \"HEAD\":\n            method = \"GET\"\n\n        # Do what the browsers do, despite standards...\n        # First, turn 302s into GETs.\n        if response.status_code == codes.found and method != \"HEAD\":\n            method = \"GET\"\n\n        # Second, if a POST is responded to with a 301, turn it into a GET.\n        # This bizarre behaviour is explained in Issue 1704.\n        if response.status_code == codes.moved and method == \"POST\":\n            method = \"GET\"\n\n        prepared_request.method = method"}, {"id": "src/requests/sessions.py::Session", "kind": "class", "name": "Session", "file": "src/requests/sessions.py", "lineno": 395, "end_lineno": 905, "language": "python", "docstring": "A Requests session.\n\nProvides cookie persistence, connection-pooling, and configuration.\n\nBasic Usage::\n\n  >>> import requests\n  >>> s = requests.Session()\n  >>> s.get('https://httpbin.org/get')\n  <Response [200]>\n\nOr as a context manager::\n\n  >>> with requests.Session() as s:\n  ...     s.get('https://httpbin.org/get')\n  <Response [200]>", "source": "class Session(SessionRedirectMixin):\n    \"\"\"A Requests session.\n\n    Provides cookie persistence, connection-pooling, and configuration.\n\n    Basic Usage::\n\n      >>> import requests\n      >>> s = requests.Session()\n      >>> s.get('https://httpbin.org/get')\n      <Response [200]>\n\n    Or as a context manager::\n\n      >>> with requests.Session() as s:\n      ...     s.get('https://httpbin.org/get')\n      <Response [200]>\n    \"\"\"\n\n    headers: CaseInsensitiveDict[str]\n    auth: _t.AuthType\n    proxies: dict[str, str]\n    hooks: dict[str, list[_t.HookType]]\n    params: MutableMapping[str, Any]\n    stream: bool\n    verify: _t.VerifyType\n    cert: _t.CertType\n    max_redirects: int\n    trust_env: bool\n    cookies: RequestsCookieJar\n    adapters: MutableMapping[str, BaseAdapter]\n\n    __attrs__: list[str] = [\n        \"headers\",\n        \"cookies\",\n        \"auth\",\n        \"proxies\",\n        \"hooks\",\n        \"params\",\n        \"verify\",\n        \"cert\",\n        \"adapters\",\n        \"stream\",\n        \"trust_env\",\n        \"max_redirects\",\n    ]\n\n    def __init__(self) -> None:\n        #: A case-insensitive dictionary of headers to be sent on each\n        #: :class:`Request <Request>` sent from this\n        #: :class:`Session <Session>`.\n        self.headers = default_headers()\n\n        #: Default Authentication tuple or object to attach to\n        #: :class:`Request <Request>`.\n        self.auth = None\n\n        #: Dictionary mapping protocol or protocol and host to the URL of the proxy\n    "}, {"id": "src/requests/sessions.py::Session.__init__", "kind": "function", "name": "__init__", "file": "src/requests/sessions.py", "lineno": 442, "end_lineno": 503, "language": "python", "docstring": "", "source": "    def __init__(self) -> None:\n        #: A case-insensitive dictionary of headers to be sent on each\n        #: :class:`Request <Request>` sent from this\n        #: :class:`Session <Session>`.\n        self.headers = default_headers()\n\n        #: Default Authentication tuple or object to attach to\n        #: :class:`Request <Request>`.\n        self.auth = None\n\n        #: Dictionary mapping protocol or protocol and host to the URL of the proxy\n        #: (e.g. {'http': 'foo.bar:3128', 'http://host.name': 'foo.bar:4012'}) to\n        #: be used on each :class:`Request <Request>`.\n        self.proxies = {}\n\n        #: Event-handling hooks.\n        self.hooks = default_hooks()\n\n        #: Dictionary of querystring data to attach to each\n        #: :class:`Request <Request>`. The dictionary values may be lists for\n        #: representing multivalued query parameters.\n        self.params = {}\n\n        #: Stream response content default.\n        self.stream = False\n\n        #: SSL Verification default.\n        #: Defaults to `True`, requiring requests to verify the TLS certificate at the\n        #: remote end.\n        #: If verify is set to `False`, requests will accept any TLS certificate\n        #: presented by the server, and will ignore hostname mismatches and/or\n        #: expired certificates, which will make your application vulnerable to\n        #: man-in-the-middle (MitM) attacks.\n        #: Only set this to `False` for testing.\n        #: If verify is set to a string, it "}, {"id": "src/requests/sessions.py::Session.__enter__", "kind": "function", "name": "__enter__", "file": "src/requests/sessions.py", "lineno": 505, "end_lineno": 506, "language": "python", "docstring": "", "source": "    def __enter__(self) -> Self:\n        return self"}, {"id": "src/requests/sessions.py::Session.__exit__", "kind": "function", "name": "__exit__", "file": "src/requests/sessions.py", "lineno": 508, "end_lineno": 509, "language": "python", "docstring": "", "source": "    def __exit__(self, *args: Any) -> None:\n        self.close()"}, {"id": "src/requests/sessions.py::Session.prepare_request", "kind": "function", "name": "prepare_request", "file": "src/requests/sessions.py", "lineno": 511, "end_lineno": 555, "language": "python", "docstring": "Constructs a :class:`PreparedRequest <PreparedRequest>` for\ntransmission and returns it. The :class:`PreparedRequest` has settings\nmerged from the :class:`Request <Request>` instance and those of the\n:class:`Session`.\n\n:param request: :class:`Request` instance to prepare with this\n    session's settings.\n:rtype: requests.PreparedRequest", "source": "    def prepare_request(self, request: Request) -> PreparedRequest:\n        \"\"\"Constructs a :class:`PreparedRequest <PreparedRequest>` for\n        transmission and returns it. The :class:`PreparedRequest` has settings\n        merged from the :class:`Request <Request>` instance and those of the\n        :class:`Session`.\n\n        :param request: :class:`Request` instance to prepare with this\n            session's settings.\n        :rtype: requests.PreparedRequest\n        \"\"\"\n        url = cast(\"_t.UriType\", request.url)\n        method = cast(str, request.method)\n\n        cookies = request.cookies or {}\n\n        # Bootstrap CookieJar.\n        if not isinstance(cookies, cookielib.CookieJar):\n            cookies = cookiejar_from_dict(cookies)\n\n        # Merge with session cookies\n        merged_cookies = merge_cookies(\n            merge_cookies(RequestsCookieJar(), self.cookies), cookies\n        )\n\n        # Set environment's basic authentication if not explicitly set.\n        auth = request.auth\n        if self.trust_env and not auth and not self.auth:\n            auth = get_netrc_auth(url)\n\n        p = PreparedRequest()\n        p.prepare(\n            method=method.upper(),\n            url=url,\n            files=request.files,\n            data=request.data,\n            json=request.json,\n            headers=merge_setting(\n                request.headers, self.headers, dict_class=CaseInsensitiveDict\n            ),\n            params=merge_setting(request.params, self.params),\n    "}, {"id": "src/requests/sessions.py::Session.request", "kind": "function", "name": "request", "file": "src/requests/sessions.py", "lineno": 557, "end_lineno": 653, "language": "python", "docstring": "Constructs a :class:`Request <Request>`, prepares it and sends it.\nReturns :class:`Response <Response>` object.\n\n:param method: method for the new :class:`Request` object.\n:param url: URL for the new :class:`Request` object.\n:param params: (optional) Dictionary or bytes to be sent in the query\n    string for the :class:`Request`.\n:param data: (optional) Dictionary, list of tuples, bytes, or file-like\n    object to send in the body of the :class:`Request`.\n:param json: (optional) json to send in the body of the\n    :class:`Request`.\n:param headers: (optional) Dictionary of HTTP Headers to send with the\n    :class:`Request`.\n:param cookies: (optional) Dict or CookieJar object to send with the\n    :class:`Request`.\n:param files: (optional) Dictionary of ``'filename': file-like-objects``\n    for multipart encoding upload.\n:param auth: (optional) Auth tuple or callable to enable\n    Basic/Digest/Custom HTTP Auth.\n:param timeout: (optional) How many seconds to wait for the server to send\n    data before giving up, as a float, or a :ref:`(connect timeout,\n    read timeout) <timeouts>` tuple.\n:type timeout: float or tuple\n:param allow_redirects: (optional) Set to True by default.\n:type allow_redirects: bool\n:param proxies: (optional) Dictionary mapping protocol or protocol and\n    hostname to the URL of the proxy.\n:param hooks: (optional) Dictionary mapping hook name to one event or\n    list of events, event must be callable.\n:param stream: (optional) whether to immediately download the response\n    content. Defaults to ``False``.\n:param verify: (optional) Either a boolean, in which case it controls whether we verify\n    the server's TLS certificate, or a string, in which case it must be a path\n    to a CA bundle to use. Defaults to ``True``. When set to\n    ``False``, requests will accept any TLS certificate presented by\n    the server, and will ignore hostname mismatches and/or expired\n    certificates, which will make your application vulnerable to\n    man-in-the-middle (MitM) attacks. Setting verify to ``False``\n    may be useful during local development or testing.\n:param cert: (optional) if String, path to ssl client cert file (.pem).\n    If Tuple, ('cert', 'key') pair.\n:rtype: requests.Response", "source": "    def request(\n        self,\n        method: str,\n        url: _t.UriType,\n        params: _t.ParamsType = None,\n        data: _t.DataType = None,\n        headers: _t.HeadersType = None,\n        cookies: RequestsCookieJar | CookieJar | dict[str, str] | None = None,\n        files: _t.FilesType = None,\n        auth: _t.AuthType = None,\n        timeout: _t.TimeoutType = None,\n        allow_redirects: bool = True,\n        proxies: dict[str, str] | None = None,\n        hooks: _t.HooksInputType | None = None,\n        stream: bool | None = None,\n        verify: _t.VerifyType | None = None,\n        cert: _t.CertType = None,\n        json: _t.JsonType = None,\n    ) -> Response:\n        \"\"\"Constructs a :class:`Request <Request>`, prepares it and sends it.\n        Returns :class:`Response <Response>` object.\n\n        :param method: method for the new :class:`Request` object.\n        :param url: URL for the new :class:`Request` object.\n        :param params: (optional) Dictionary or bytes to be sent in the query\n            string for the :class:`Request`.\n        :param data: (optional) Dictionary, list of tuples, bytes, or file-like\n            object to send in the body of the :class:`Request`.\n        :param json: (optional) json to send in the body of the\n            :class:`Request`.\n        :param headers: (optional) Dictionary of HTTP Headers to send with the\n            :class:`Request`.\n        :param cookies: (optional) Dict or CookieJar object to send with the\n            :c"}, {"id": "src/requests/sessions.py::Session.get", "kind": "function", "name": "get", "file": "src/requests/sessions.py", "lineno": 655, "end_lineno": 671, "language": "python", "docstring": "Sends a GET request. Returns :class:`Response` object.\n\n:param url: URL for the new :class:`Request` object.\n:param params: (optional) Dictionary, list of tuples or bytes to send\n    in the query string for the :class:`Request`.\n:param \\*\\*kwargs: Optional arguments that ``request`` takes.\n:rtype: requests.Response", "source": "    def get(\n        self,\n        url: _t.UriType,\n        params: _t.ParamsType = None,\n        **kwargs: Unpack[_t.GetKwargs],\n    ) -> Response:\n        r\"\"\"Sends a GET request. Returns :class:`Response` object.\n\n        :param url: URL for the new :class:`Request` object.\n        :param params: (optional) Dictionary, list of tuples or bytes to send\n            in the query string for the :class:`Request`.\n        :param \\*\\*kwargs: Optional arguments that ``request`` takes.\n        :rtype: requests.Response\n        \"\"\"\n\n        kwargs.setdefault(\"allow_redirects\", True)\n        return self.request(\"GET\", url, params=params, **kwargs)"}, {"id": "src/requests/sessions.py::Session.options", "kind": "function", "name": "options", "file": "src/requests/sessions.py", "lineno": 673, "end_lineno": 682, "language": "python", "docstring": "Sends a OPTIONS request. Returns :class:`Response` object.\n\n:param url: URL for the new :class:`Request` object.\n:param \\*\\*kwargs: Optional arguments that ``request`` takes.\n:rtype: requests.Response", "source": "    def options(self, url: _t.UriType, **kwargs: Unpack[_t.RequestKwargs]) -> Response:\n        r\"\"\"Sends a OPTIONS request. Returns :class:`Response` object.\n\n        :param url: URL for the new :class:`Request` object.\n        :param \\*\\*kwargs: Optional arguments that ``request`` takes.\n        :rtype: requests.Response\n        \"\"\"\n\n        kwargs.setdefault(\"allow_redirects\", True)\n        return self.request(\"OPTIONS\", url, **kwargs)"}, {"id": "src/requests/sessions.py::Session.head", "kind": "function", "name": "head", "file": "src/requests/sessions.py", "lineno": 684, "end_lineno": 693, "language": "python", "docstring": "Sends a HEAD request. Returns :class:`Response` object.\n\n:param url: URL for the new :class:`Request` object.\n:param \\*\\*kwargs: Optional arguments that ``request`` takes.\n:rtype: requests.Response", "source": "    def head(self, url: _t.UriType, **kwargs: Unpack[_t.RequestKwargs]) -> Response:\n        r\"\"\"Sends a HEAD request. Returns :class:`Response` object.\n\n        :param url: URL for the new :class:`Request` object.\n        :param \\*\\*kwargs: Optional arguments that ``request`` takes.\n        :rtype: requests.Response\n        \"\"\"\n\n        kwargs.setdefault(\"allow_redirects\", False)\n        return self.request(\"HEAD\", url, **kwargs)"}, {"id": "src/requests/sessions.py::Session.post", "kind": "function", "name": "post", "file": "src/requests/sessions.py", "lineno": 695, "end_lineno": 712, "language": "python", "docstring": "Sends a POST request. Returns :class:`Response` object.\n\n:param url: URL for the new :class:`Request` object.\n:param data: (optional) Dictionary, list of tuples, bytes, or file-like\n    object to send in the body of the :class:`Request`.\n:param json: (optional) json to send in the body of the :class:`Request`.\n:param \\*\\*kwargs: Optional arguments that ``request`` takes.\n:rtype: requests.Response", "source": "    def post(\n        self,\n        url: _t.UriType,\n        data: _t.DataType = None,\n        json: _t.JsonType = None,\n        **kwargs: Unpack[_t.PostKwargs],\n    ) -> Response:\n        r\"\"\"Sends a POST request. Returns :class:`Response` object.\n\n        :param url: URL for the new :class:`Request` object.\n        :param data: (optional) Dictionary, list of tuples, bytes, or file-like\n            object to send in the body of the :class:`Request`.\n        :param json: (optional) json to send in the body of the :class:`Request`.\n        :param \\*\\*kwargs: Optional arguments that ``request`` takes.\n        :rtype: requests.Response\n        \"\"\"\n\n        return self.request(\"POST\", url, data=data, json=json, **kwargs)"}, {"id": "src/requests/sessions.py::Session.put", "kind": "function", "name": "put", "file": "src/requests/sessions.py", "lineno": 714, "end_lineno": 726, "language": "python", "docstring": "Sends a PUT request. Returns :class:`Response` object.\n\n:param url: URL for the new :class:`Request` object.\n:param data: (optional) Dictionary, list of tuples, bytes, or file-like\n    object to send in the body of the :class:`Request`.\n:param \\*\\*kwargs: Optional arguments that ``request`` takes.\n:rtype: requests.Response", "source": "    def put(\n        self, url: _t.UriType, data: _t.DataType = None, **kwargs: Unpack[_t.DataKwargs]\n    ) -> Response:\n        r\"\"\"Sends a PUT request. Returns :class:`Response` object.\n\n        :param url: URL for the new :class:`Request` object.\n        :param data: (optional) Dictionary, list of tuples, bytes, or file-like\n            object to send in the body of the :class:`Request`.\n        :param \\*\\*kwargs: Optional arguments that ``request`` takes.\n        :rtype: requests.Response\n        \"\"\"\n\n        return self.request(\"PUT\", url, data=data, **kwargs)"}, {"id": "src/requests/sessions.py::Session.patch", "kind": "function", "name": "patch", "file": "src/requests/sessions.py", "lineno": 728, "end_lineno": 740, "language": "python", "docstring": "Sends a PATCH request. Returns :class:`Response` object.\n\n:param url: URL for the new :class:`Request` object.\n:param data: (optional) Dictionary, list of tuples, bytes, or file-like\n    object to send in the body of the :class:`Request`.\n:param \\*\\*kwargs: Optional arguments that ``request`` takes.\n:rtype: requests.Response", "source": "    def patch(\n        self, url: _t.UriType, data: _t.DataType = None, **kwargs: Unpack[_t.DataKwargs]\n    ) -> Response:\n        r\"\"\"Sends a PATCH request. Returns :class:`Response` object.\n\n        :param url: URL for the new :class:`Request` object.\n        :param data: (optional) Dictionary, list of tuples, bytes, or file-like\n            object to send in the body of the :class:`Request`.\n        :param \\*\\*kwargs: Optional arguments that ``request`` takes.\n        :rtype: requests.Response\n        \"\"\"\n\n        return self.request(\"PATCH\", url, data=data, **kwargs)"}, {"id": "src/requests/sessions.py::Session.delete", "kind": "function", "name": "delete", "file": "src/requests/sessions.py", "lineno": 742, "end_lineno": 750, "language": "python", "docstring": "Sends a DELETE request. Returns :class:`Response` object.\n\n:param url: URL for the new :class:`Request` object.\n:param \\*\\*kwargs: Optional arguments that ``request`` takes.\n:rtype: requests.Response", "source": "    def delete(self, url: _t.UriType, **kwargs: Unpack[_t.RequestKwargs]) -> Response:\n        r\"\"\"Sends a DELETE request. Returns :class:`Response` object.\n\n        :param url: URL for the new :class:`Request` object.\n        :param \\*\\*kwargs: Optional arguments that ``request`` takes.\n        :rtype: requests.Response\n        \"\"\"\n\n        return self.request(\"DELETE\", url, **kwargs)"}, {"id": "src/requests/sessions.py::Session.send", "kind": "function", "name": "send", "file": "src/requests/sessions.py", "lineno": 752, "end_lineno": 829, "language": "python", "docstring": "Send a given PreparedRequest.\n\n:rtype: requests.Response", "source": "    def send(self, request: PreparedRequest, **kwargs: Any) -> Response:\n        \"\"\"Send a given PreparedRequest.\n\n        :rtype: requests.Response\n        \"\"\"\n        # Set defaults that the hooks can utilize to ensure they always have\n        # the correct parameters to reproduce the previous request.\n        kwargs.setdefault(\"stream\", self.stream)\n        kwargs.setdefault(\"verify\", self.verify)\n        kwargs.setdefault(\"cert\", self.cert)\n        if \"proxies\" not in kwargs:\n            kwargs[\"proxies\"] = resolve_proxies(request, self.proxies, self.trust_env)\n\n        # It's possible that users might accidentally send a Request object.\n        # Guard against that specific failure case.\n        if isinstance(request, Request):\n            raise ValueError(\"You can only send PreparedRequests.\")\n\n        assert _is_prepared(request)\n\n        # Set up variables needed for resolve_redirects and dispatching of hooks\n        allow_redirects = kwargs.pop(\"allow_redirects\", True)\n        stream = kwargs.get(\"stream\")\n        hooks = request.hooks\n\n        # Get the appropriate adapter to use\n        adapter = self.get_adapter(url=request.url)\n\n        # Start time (approximately) of the request\n        start = preferred_clock()\n\n        # Send the request\n        r = adapter.send(request, **kwargs)\n\n        # Total elapsed time of the request (approximately)\n        elapsed = preferred_clock() - start\n        r.elapsed = timedelta(seconds=elapsed)\n\n        # Response manipulati"}, {"id": "src/requests/sessions.py::Session.merge_environment_settings", "kind": "function", "name": "merge_environment_settings", "file": "src/requests/sessions.py", "lineno": 831, "end_lineno": 868, "language": "python", "docstring": "Check the environment and merge it with some settings.\n\n:rtype: dict", "source": "    def merge_environment_settings(\n        self,\n        url: str,\n        proxies: dict[str, str] | None,\n        stream: bool | None,\n        verify: _t.VerifyType | None,\n        cert: _t.CertType,\n    ) -> dict[str, Any]:\n        \"\"\"\n        Check the environment and merge it with some settings.\n\n        :rtype: dict\n        \"\"\"\n        # Gather clues from the surrounding environment.\n        if self.trust_env:\n            # Set environment's proxies.\n            no_proxy = proxies.get(\"no_proxy\") if proxies is not None else None\n            env_proxies = get_environ_proxies(url, no_proxy=no_proxy)\n            if proxies is not None:\n                for k, v in env_proxies.items():\n                    proxies.setdefault(k, v)\n\n            # Look for requests environment configuration\n            # and be compatible with cURL.\n            if verify is True or verify is None:\n                verify = (\n                    os.environ.get(\"REQUESTS_CA_BUNDLE\")\n                    or os.environ.get(\"CURL_CA_BUNDLE\")\n                    or verify\n                )\n\n        # Merge all the kwargs.\n        proxies = merge_setting(proxies, self.proxies)\n        stream = merge_setting(stream, self.stream)\n        verify = merge_setting(verify, self.verify)\n        cert = merge_setting(cert, self.cert)\n\n        return {\"proxies\": proxies, \"stream\": stream, \"verify\": verify, \"cert\": cert}"}, {"id": "src/requests/sessions.py::Session.get_adapter", "kind": "function", "name": "get_adapter", "file": "src/requests/sessions.py", "lineno": 870, "end_lineno": 881, "language": "python", "docstring": "Returns the appropriate connection adapter for the given URL.\n\n:rtype: requests.adapters.BaseAdapter", "source": "    def get_adapter(self, url: str) -> BaseAdapter:\n        \"\"\"\n        Returns the appropriate connection adapter for the given URL.\n\n        :rtype: requests.adapters.BaseAdapter\n        \"\"\"\n        for prefix, adapter in self.adapters.items():\n            if url.lower().startswith(prefix.lower()):\n                return adapter\n\n        # Nothing matches :-/\n        raise InvalidSchema(f\"No connection adapters were found for {url!r}\")"}, {"id": "src/requests/sessions.py::Session.close", "kind": "function", "name": "close", "file": "src/requests/sessions.py", "lineno": 883, "end_lineno": 886, "language": "python", "docstring": "Closes all adapters and as such the session", "source": "    def close(self) -> None:\n        \"\"\"Closes all adapters and as such the session\"\"\"\n        for v in self.adapters.values():\n            v.close()"}, {"id": "src/requests/sessions.py::Session.mount", "kind": "function", "name": "mount", "file": "src/requests/sessions.py", "lineno": 888, "end_lineno": 897, "language": "python", "docstring": "Registers a connection adapter to a prefix.\n\nAdapters are sorted in descending order by prefix length.", "source": "    def mount(self, prefix: str, adapter: BaseAdapter) -> None:\n        \"\"\"Registers a connection adapter to a prefix.\n\n        Adapters are sorted in descending order by prefix length.\n        \"\"\"\n        self.adapters[prefix] = adapter\n        keys_to_move = [k for k in self.adapters if len(k) < len(prefix)]\n\n        for key in keys_to_move:\n            self.adapters[key] = self.adapters.pop(key)"}, {"id": "src/requests/sessions.py::Session.__getstate__", "kind": "function", "name": "__getstate__", "file": "src/requests/sessions.py", "lineno": 899, "end_lineno": 901, "language": "python", "docstring": "", "source": "    def __getstate__(self) -> dict[str, Any]:\n        state = {attr: getattr(self, attr, None) for attr in self.__attrs__}\n        return state"}, {"id": "src/requests/sessions.py::Session.__setstate__", "kind": "function", "name": "__setstate__", "file": "src/requests/sessions.py", "lineno": 903, "end_lineno": 905, "language": "python", "docstring": "", "source": "    def __setstate__(self, state: dict[str, Any]) -> None:\n        for attr, value in state.items():\n            setattr(self, attr, value)"}, {"id": "src/requests/sessions.py::session", "kind": "function", "name": "session", "file": "src/requests/sessions.py", "lineno": 908, "end_lineno": 920, "language": "python", "docstring": "Returns a :class:`Session` for context-management.\n\n.. deprecated:: 1.0.0\n\n    This method has been deprecated since version 1.0.0 and is only kept for\n    backwards compatibility. New code should use :class:`~requests.sessions.Session`\n    to create a session. This may be removed at a future date.\n\n:rtype: Session", "source": "def session() -> Session:\n    \"\"\"\n    Returns a :class:`Session` for context-management.\n\n    .. deprecated:: 1.0.0\n\n        This method has been deprecated since version 1.0.0 and is only kept for\n        backwards compatibility. New code should use :class:`~requests.sessions.Session`\n        to create a session. This may be removed at a future date.\n\n    :rtype: Session\n    \"\"\"\n    return Session()"}, {"id": "src/requests/status_codes.py", "kind": "module", "name": "src/requests/status_codes.py", "file": "src/requests/status_codes.py", "lineno": 1, "end_lineno": 128, "language": "python", "docstring": "The ``codes`` object defines a mapping from common names for HTTP statuses\nto their numerical codes, accessible either as attributes or as dictionary\nitems.\n\nExample::\n\n    >>> import requests\n    >>> requests.codes['temporary_redirect']\n    307\n    >>> requests.codes.teapot\n    418\n    >>> requests.codes['\\o/']\n    200\n\nSome codes have multiple names, and both upper- and lower-case versions of\nthe names are allowed. For example, ``codes.ok``, ``codes.OK``, and\n``codes.okay`` all correspond to the HTTP status code 200.", "source": ""}, {"id": "src/requests/status_codes.py::_init", "kind": "function", "name": "_init", "file": "src/requests/status_codes.py", "lineno": 109, "end_lineno": 125, "language": "python", "docstring": "", "source": "def _init():\n    for code, titles in _codes.items():\n        for title in titles:\n            setattr(codes, title, code)\n            if not title.startswith((\"\\\\\", \"/\")):\n                setattr(codes, title.upper(), code)\n\n    def doc(code: int) -> str:\n        names = \", \".join(f\"``{n}``\" for n in _codes[code])\n        return \"* %d: %s\" % (code, names)\n\n    global __doc__\n    __doc__ = (\n        __doc__ + \"\\n\" + \"\\n\".join(doc(code) for code in sorted(_codes))\n        if __doc__ is not None\n        else None\n    )"}, {"id": "src/requests/status_codes.py::_init.doc", "kind": "function", "name": "doc", "file": "src/requests/status_codes.py", "lineno": 116, "end_lineno": 118, "language": "python", "docstring": "", "source": "    def doc(code: int) -> str:\n        names = \", \".join(f\"``{n}``\" for n in _codes[code])\n        return \"* %d: %s\" % (code, names)"}, {"id": "src/requests/structures.py", "kind": "module", "name": "src/requests/structures.py", "file": "src/requests/structures.py", "lineno": 1, "end_lineno": 130, "language": "python", "docstring": "requests.structures\n~~~~~~~~~~~~~~~~~~~\n\nData structures that power Requests.", "source": ""}, {"id": "src/requests/structures.py::CaseInsensitiveDict", "kind": "class", "name": "CaseInsensitiveDict", "file": "src/requests/structures.py", "lineno": 20, "end_lineno": 93, "language": "python", "docstring": "A case-insensitive ``dict``-like object.\n\nImplements all methods and operations of\n``MutableMapping`` as well as dict's ``copy``. Also\nprovides ``lower_items``.\n\nAll keys are expected to be strings. The structure remembers the\ncase of the last key to be set, and ``iter(instance)``,\n``keys()``, ``items()``, ``iterkeys()``, and ``iteritems()``\nwill contain case-sensitive keys. However, querying and contains\ntesting is case insensitive::\n\n    cid = CaseInsensitiveDict()\n    cid['Accept'] = 'application/json'\n    cid['aCCEPT'] == 'application/json'  # True\n    list(cid) == ['Accept']  # True\n\nFor example, ``headers['content-encoding']`` will return the\nvalue of a ``'Content-Encoding'`` response header, regardless\nof how the header name was originally stored.\n\nIf the constructor, ``.update``, or equality comparison\noperations are given keys that have equal ``.lower()``s, the\nbehavior is undefined.", "source": "class CaseInsensitiveDict(MutableMapping[str, _VT], Generic[_VT]):\n    \"\"\"A case-insensitive ``dict``-like object.\n\n    Implements all methods and operations of\n    ``MutableMapping`` as well as dict's ``copy``. Also\n    provides ``lower_items``.\n\n    All keys are expected to be strings. The structure remembers the\n    case of the last key to be set, and ``iter(instance)``,\n    ``keys()``, ``items()``, ``iterkeys()``, and ``iteritems()``\n    will contain case-sensitive keys. However, querying and contains\n    testing is case insensitive::\n\n        cid = CaseInsensitiveDict()\n        cid['Accept'] = 'application/json'\n        cid['aCCEPT'] == 'application/json'  # True\n        list(cid) == ['Accept']  # True\n\n    For example, ``headers['content-encoding']`` will return the\n    value of a ``'Content-Encoding'`` response header, regardless\n    of how the header name was originally stored.\n\n    If the constructor, ``.update``, or equality comparison\n    operations are given keys that have equal ``.lower()``s, the\n    behavior is undefined.\n    \"\"\"\n\n    _store: OrderedDict[str, tuple[str, _VT]]\n\n    def __init__(\n        self,\n        data: Mapping[str, _VT] | Iterable[tuple[str, _VT]] | None = None,\n        **kwargs: _VT,\n    ) -> None:\n        self._store = OrderedDict()\n        if data is None:\n            data = {}\n        self.update(data, **kwargs)\n\n    def __setitem__(self, key: str, value: _VT) -> None:\n        # Use the lowercased key for lookups, but store the actual\n   "}, {"id": "src/requests/structures.py::CaseInsensitiveDict.__init__", "kind": "function", "name": "__init__", "file": "src/requests/structures.py", "lineno": 49, "end_lineno": 57, "language": "python", "docstring": "", "source": "    def __init__(\n        self,\n        data: Mapping[str, _VT] | Iterable[tuple[str, _VT]] | None = None,\n        **kwargs: _VT,\n    ) -> None:\n        self._store = OrderedDict()\n        if data is None:\n            data = {}\n        self.update(data, **kwargs)"}, {"id": "src/requests/structures.py::CaseInsensitiveDict.__setitem__", "kind": "function", "name": "__setitem__", "file": "src/requests/structures.py", "lineno": 59, "end_lineno": 62, "language": "python", "docstring": "", "source": "    def __setitem__(self, key: str, value: _VT) -> None:\n        # Use the lowercased key for lookups, but store the actual\n        # key alongside the value.\n        self._store[key.lower()] = (key, value)"}, {"id": "src/requests/structures.py::CaseInsensitiveDict.__getitem__", "kind": "function", "name": "__getitem__", "file": "src/requests/structures.py", "lineno": 64, "end_lineno": 65, "language": "python", "docstring": "", "source": "    def __getitem__(self, key: str) -> _VT:\n        return self._store[key.lower()][1]"}, {"id": "src/requests/structures.py::CaseInsensitiveDict.__delitem__", "kind": "function", "name": "__delitem__", "file": "src/requests/structures.py", "lineno": 67, "end_lineno": 68, "language": "python", "docstring": "", "source": "    def __delitem__(self, key: str) -> None:\n        del self._store[key.lower()]"}, {"id": "src/requests/structures.py::CaseInsensitiveDict.__iter__", "kind": "function", "name": "__iter__", "file": "src/requests/structures.py", "lineno": 70, "end_lineno": 71, "language": "python", "docstring": "", "source": "    def __iter__(self) -> Iterator[str]:\n        return (casedkey for casedkey, _ in self._store.values())"}, {"id": "src/requests/structures.py::CaseInsensitiveDict.__len__", "kind": "function", "name": "__len__", "file": "src/requests/structures.py", "lineno": 73, "end_lineno": 74, "language": "python", "docstring": "", "source": "    def __len__(self) -> int:\n        return len(self._store)"}, {"id": "src/requests/structures.py::CaseInsensitiveDict.lower_items", "kind": "function", "name": "lower_items", "file": "src/requests/structures.py", "lineno": 76, "end_lineno": 78, "language": "python", "docstring": "Like iteritems(), but with all lowercase keys.", "source": "    def lower_items(self) -> Iterator[tuple[str, _VT]]:\n        \"\"\"Like iteritems(), but with all lowercase keys.\"\"\"\n        return ((lowerkey, keyval[1]) for (lowerkey, keyval) in self._store.items())"}, {"id": "src/requests/structures.py::CaseInsensitiveDict.__eq__", "kind": "function", "name": "__eq__", "file": "src/requests/structures.py", "lineno": 80, "end_lineno": 86, "language": "python", "docstring": "", "source": "    def __eq__(self, other: object) -> bool:\n        if isinstance(other, Mapping):\n            other_dict: CaseInsensitiveDict[Any] = CaseInsensitiveDict(other)  # type: ignore[reportUnknownArgumentType]\n        else:\n            return NotImplemented\n        # Compare insensitively\n        return dict(self.lower_items()) == dict(other_dict.lower_items())"}, {"id": "src/requests/structures.py::CaseInsensitiveDict.copy", "kind": "function", "name": "copy", "file": "src/requests/structures.py", "lineno": 89, "end_lineno": 90, "language": "python", "docstring": "", "source": "    def copy(self) -> CaseInsensitiveDict[_VT]:\n        return CaseInsensitiveDict(self._store.values())"}, {"id": "src/requests/structures.py::CaseInsensitiveDict.__repr__", "kind": "function", "name": "__repr__", "file": "src/requests/structures.py", "lineno": 92, "end_lineno": 93, "language": "python", "docstring": "", "source": "    def __repr__(self) -> str:\n        return str(dict(self.items()))"}, {"id": "src/requests/structures.py::LookupDict", "kind": "class", "name": "LookupDict", "file": "src/requests/structures.py", "lineno": 96, "end_lineno": 130, "language": "python", "docstring": "Dictionary lookup object.", "source": "class LookupDict(dict[str, _VT]):\n    \"\"\"Dictionary lookup object.\"\"\"\n\n    name: Any\n\n    def __init__(self, name: Any = None) -> None:\n        self.name = name\n        super().__init__()\n\n    def __repr__(self) -> str:\n        return f\"<lookup '{self.name}'>\"\n\n    def __getattr__(self, key: str) -> _VT | None:\n        # We need this for type checkers to infer typing\n        # on attribute access with status_codes.py\n        if key in self.__dict__:\n            return self.__dict__[key]\n        else:\n            raise AttributeError(\n                f\"'{type(self).__name__}' object has no attribute '{key}'\"\n            )\n\n    def __getitem__(self, key: str) -> _VT | None:  # type: ignore[override]\n        # We allow fall-through here, so values default to None\n\n        return self.__dict__.get(key, None)\n\n    @overload\n    def get(self, key: str, default: None = None) -> _VT | None: ...\n\n    @overload\n    def get(self, key: str, default: _D | _VT) -> _D | _VT: ...\n\n    def get(self, key: str, default: _D | None = None) -> _VT | _D | None:\n        return self.__dict__.get(key, default)"}, {"id": "src/requests/structures.py::LookupDict.__init__", "kind": "function", "name": "__init__", "file": "src/requests/structures.py", "lineno": 101, "end_lineno": 103, "language": "python", "docstring": "", "source": "    def __init__(self, name: Any = None) -> None:\n        self.name = name\n        super().__init__()"}, {"id": "src/requests/structures.py::LookupDict.__repr__", "kind": "function", "name": "__repr__", "file": "src/requests/structures.py", "lineno": 105, "end_lineno": 106, "language": "python", "docstring": "", "source": "    def __repr__(self) -> str:\n        return f\"<lookup '{self.name}'>\""}, {"id": "src/requests/structures.py::LookupDict.__getattr__", "kind": "function", "name": "__getattr__", "file": "src/requests/structures.py", "lineno": 108, "end_lineno": 116, "language": "python", "docstring": "", "source": "    def __getattr__(self, key: str) -> _VT | None:\n        # We need this for type checkers to infer typing\n        # on attribute access with status_codes.py\n        if key in self.__dict__:\n            return self.__dict__[key]\n        else:\n            raise AttributeError(\n                f\"'{type(self).__name__}' object has no attribute '{key}'\"\n            )"}, {"id": "src/requests/structures.py::LookupDict.__getitem__", "kind": "function", "name": "__getitem__", "file": "src/requests/structures.py", "lineno": 118, "end_lineno": 121, "language": "python", "docstring": "", "source": "    def __getitem__(self, key: str) -> _VT | None:  # type: ignore[override]\n        # We allow fall-through here, so values default to None\n\n        return self.__dict__.get(key, None)"}, {"id": "src/requests/structures.py::LookupDict.get", "kind": "function", "name": "get", "file": "src/requests/structures.py", "lineno": 129, "end_lineno": 130, "language": "python", "docstring": "", "source": "    def get(self, key: str, default: _D | None = None) -> _VT | _D | None:\n        return self.__dict__.get(key, default)"}, {"id": "src/requests/utils.py", "kind": "module", "name": "src/requests/utils.py", "file": "src/requests/utils.py", "lineno": 1, "end_lineno": 1155, "language": "python", "docstring": "requests.utils\n~~~~~~~~~~~~~~\n\nThis module provides utility functions that are used within Requests\nthat are also useful for external consumption.", "source": ""}, {"id": "src/requests/utils.py::proxy_bypass_registry", "kind": "function", "name": "proxy_bypass_registry", "file": "src/requests/utils.py", "lineno": 99, "end_lineno": 135, "language": "python", "docstring": "", "source": "    def proxy_bypass_registry(host: str) -> bool:\n        try:\n            import winreg\n        except ImportError:\n            return False\n\n        try:\n            internetSettings = winreg.OpenKey(\n                winreg.HKEY_CURRENT_USER,\n                r\"Software\\Microsoft\\Windows\\CurrentVersion\\Internet Settings\",\n            )\n            # ProxyEnable could be REG_SZ or REG_DWORD, normalizing it\n            proxyEnable = int(winreg.QueryValueEx(internetSettings, \"ProxyEnable\")[0])\n            # ProxyOverride is almost always a string\n            proxyOverride = winreg.QueryValueEx(internetSettings, \"ProxyOverride\")[0]\n        except (OSError, ValueError):\n            return False\n        if not proxyEnable or not proxyOverride:\n            return False\n\n        # make a check value list from the registry entry: replace the\n        # '<local>' string by the localhost entry and the corresponding\n        # canonical entry.\n        proxyOverride = proxyOverride.split(\";\")\n        # filter out empty strings to avoid re.match return true in the following code.\n        proxyOverride = filter(None, proxyOverride)\n        # now check if we match one of the registry values.\n        for test in proxyOverride:\n            if test == \"<local>\":\n                if \".\" not in host:\n                    return True\n            test = test.replace(\".\", r\"\\.\")  # mask dots\n            test = test.replace(\"*\", r\".*\")  # change glob sequence\n            test = test.replace(\"?\", r\".\")  "}, {"id": "src/requests/utils.py::proxy_bypass", "kind": "function", "name": "proxy_bypass", "file": "src/requests/utils.py", "lineno": 137, "end_lineno": 146, "language": "python", "docstring": "Return True, if the host should be bypassed.\n\nChecks proxy settings gathered from the environment, if specified,\nor the registry.", "source": "    def proxy_bypass(host: str) -> bool:  # noqa\n        \"\"\"Return True, if the host should be bypassed.\n\n        Checks proxy settings gathered from the environment, if specified,\n        or the registry.\n        \"\"\"\n        if getproxies_environment():\n            return proxy_bypass_environment(host)\n        else:\n            return proxy_bypass_registry(host)"}, {"id": "src/requests/utils.py::dict_to_sequence", "kind": "function", "name": "dict_to_sequence", "file": "src/requests/utils.py", "lineno": 149, "end_lineno": 157, "language": "python", "docstring": "Returns an internal sequence dictionary update.", "source": "def dict_to_sequence(\n    d: _t.SupportsItems[Any, Any] | Iterable[tuple[Any, Any]],\n) -> Iterable[tuple[Any, Any]]:\n    \"\"\"Returns an internal sequence dictionary update.\"\"\"\n\n    if isinstance(d, _SupportsItems):\n        return d.items()\n\n    return d"}, {"id": "src/requests/utils.py::super_len", "kind": "function", "name": "super_len", "file": "src/requests/utils.py", "lineno": 160, "end_lineno": 228, "language": "python", "docstring": "", "source": "def super_len(o: Any) -> int:\n    total_length = None\n    current_position = 0\n\n    if not is_urllib3_1 and isinstance(o, str):\n        # urllib3 2.x+ treats all strings as utf-8 instead\n        # of latin-1 (iso-8859-1) like http.client.\n        o = o.encode(\"utf-8\")\n\n    if hasattr(o, \"__len__\"):\n        total_length = len(o)\n\n    elif hasattr(o, \"len\"):\n        total_length = o.len\n\n    elif hasattr(o, \"fileno\"):\n        try:\n            fileno = o.fileno()\n        except (io.UnsupportedOperation, AttributeError):\n            # AttributeError is a surprising exception, seeing as how we've just checked\n            # that `hasattr(o, 'fileno')`.  It happens for objects obtained via\n            # `Tarfile.extractfile()`, per issue 5229.\n            pass\n        else:\n            total_length = os.fstat(fileno).st_size\n\n            # Having used fstat to determine the file length, we need to\n            # confirm that this file was opened up in binary mode.\n            if \"b\" not in o.mode:\n                warnings.warn(\n                    (\n                        \"Requests has determined the content-length for this \"\n                        \"request using the binary size of the file: however, the \"\n                        \"file has been opened in text mode (i.e. without the 'b' \"\n                        \"flag in the mode). This may lead to an incorrect \"\n                        \"content-length. In Requests 3.0, support will be removed \"\n                        \"for files in"}, {"id": "src/requests/utils.py::get_netrc_auth", "kind": "function", "name": "get_netrc_auth", "file": "src/requests/utils.py", "lineno": 231, "end_lineno": 280, "language": "python", "docstring": "Returns the Requests tuple auth for a given url from netrc.", "source": "def get_netrc_auth(\n    url: _t.UriType, raise_errors: bool = False\n) -> tuple[str, str] | None:\n    \"\"\"Returns the Requests tuple auth for a given url from netrc.\"\"\"\n\n    if isinstance(url, bytes):\n        url = url.decode(\"utf-8\")\n\n    netrc_file = os.environ.get(\"NETRC\")\n    if netrc_file is not None:\n        netrc_locations = (netrc_file,)\n    else:\n        netrc_locations = (f\"~/{f}\" for f in NETRC_FILES)\n\n    try:\n        from netrc import NetrcParseError, netrc\n\n        netrc_path = None\n\n        for f in netrc_locations:\n            loc = os.path.expanduser(f)\n            if os.path.exists(loc):\n                netrc_path = loc\n                break\n\n        # Abort early if there isn't one.\n        if netrc_path is None:\n            return\n\n        ri = urlparse(url)\n        host = ri.hostname\n\n        if host is None:\n            return\n\n        try:\n            _netrc = netrc(netrc_path).authenticators(host)\n            if _netrc and any(_netrc):\n                # Return with login / password\n                login_i = 0 if _netrc[0] else 1\n                return (_netrc[login_i] or \"\", _netrc[2] or \"\")\n        except (NetrcParseError, OSError):\n            # If there was a parsing error or a permissions issue reading the file,\n            # we'll just skip netrc auth unless explicitly asked to raise errors.\n            if raise_errors:\n                raise\n\n    # App Engine hackiness.\n    except (ImportError, AttributeError):\n        pass"}, {"id": "src/requests/utils.py::guess_filename", "kind": "function", "name": "guess_filename", "file": "src/requests/utils.py", "lineno": 283, "end_lineno": 287, "language": "python", "docstring": "Tries to guess the filename of the given object.", "source": "def guess_filename(obj: Any) -> str | None:\n    \"\"\"Tries to guess the filename of the given object.\"\"\"\n    name = getattr(obj, \"name\", None)\n    if name and isinstance(name, (str, bytes)) and name[0] != \"<\" and name[-1] != \">\":\n        return os.path.basename(name)  # type: ignore[return-value]  # urllib3 accepts bytes but types str only"}, {"id": "src/requests/utils.py::extract_zipped_paths", "kind": "function", "name": "extract_zipped_paths", "file": "src/requests/utils.py", "lineno": 290, "end_lineno": 325, "language": "python", "docstring": "Replace nonexistent paths that look like they refer to a member of a zip\narchive with the location of an extracted copy of the target, or else\njust return the provided path unchanged.", "source": "def extract_zipped_paths(path: str) -> str:\n    \"\"\"Replace nonexistent paths that look like they refer to a member of a zip\n    archive with the location of an extracted copy of the target, or else\n    just return the provided path unchanged.\n    \"\"\"\n    if os.path.exists(path):\n        # this is already a valid path, no need to do anything further\n        return path\n\n    # find the first valid part of the provided path and treat that as a zip archive\n    # assume the rest of the path is the name of a member in the archive\n    archive, member = os.path.split(path)\n    while archive and not os.path.exists(archive):\n        archive, prefix = os.path.split(archive)\n        if not prefix:\n            # If we don't check for an empty prefix after the split (in other words, archive remains unchanged after the split),\n            # we _can_ end up in an infinite loop on a rare corner case affecting a small number of users\n            break\n        member = \"/\".join([prefix, member])\n\n    i
