ide]\n        \"\"\"Dict-like keys() that returns a list of names of cookies from the\n        jar.\n\n        .. seealso:: values() and items().\n        \"\"\"\n        return list(self.iterkeys())"}, {"id": "src/requests/cookies.py::RequestsCookieJar.itervalues", "kind": "function", "name": "itervalues", "file": "src/requests/cookies.py", "lineno": 267, "end_lineno": 274, "language": "python", "docstring": "Dict-like itervalues() that returns an iterator of values of cookies\nfrom the jar.\n\n.. seealso:: iterkeys() and iteritems().", "source": "    def itervalues(self) -> Iterator[str | None]:\n        \"\"\"Dict-like itervalues() that returns an iterator of values of cookies\n        from the jar.\n\n        .. seealso:: iterkeys() and iteritems().\n        \"\"\"\n        for cookie in iter(self):\n            yield cookie.value"}, {"id": "src/requests/cookies.py::RequestsCookieJar.values", "kind": "function", "name": "values", "file": "src/requests/cookies.py", "lineno": 276, "end_lineno": 282, "language": "python", "docstring": "Dict-like values() that returns a list of values of cookies from the\njar.\n\n.. seealso:: keys() and items().", "source": "    def values(self) -> list[str | None]:  # type: ignore[override]\n        \"\"\"Dict-like values() that returns a list of values of cookies from the\n        jar.\n\n        .. seealso:: keys() and items().\n        \"\"\"\n        return list(self.itervalues())"}, {"id": "src/requests/cookies.py::RequestsCookieJar.iteritems", "kind": "function", "name": "iteritems", "file": "src/requests/cookies.py", "lineno": 284, "end_lineno": 291, "language": "python", "docstring": "Dict-like iteritems() that returns an iterator of name-value tuples\nfrom the jar.\n\n.. seealso:: iterkeys() and itervalues().", "source": "    def iteritems(self) -> Iterator[tuple[str, str | None]]:\n        \"\"\"Dict-like iteritems() that returns an iterator of name-value tuples\n        from the jar.\n\n        .. seealso:: iterkeys() and itervalues().\n        \"\"\"\n        for cookie in iter(self):\n            yield cookie.name, cookie.value"}, {"id": "src/requests/cookies.py::RequestsCookieJar.items", "kind": "function", "name": "items", "file": "src/requests/cookies.py", "lineno": 293, "end_lineno": 300, "language": "python", "docstring": "Dict-like items() that returns a list of name-value tuples from the\njar. Allows client-code to call ``dict(RequestsCookieJar)`` and get a\nvanilla python dict of key value pairs.\n\n.. seealso:: keys() and values().", "source": "    def items(self) -> list[tuple[str, str | None]]:  # type: ignore[override]\n        \"\"\"Dict-like items() that returns a list of name-value tuples from the\n        jar. Allows client-code to call ``dict(RequestsCookieJar)`` and get a\n        vanilla python dict of key value pairs.\n\n        .. seealso:: keys() and values().\n        \"\"\"\n        return list(self.iteritems())"}, {"id": "src/requests/cookies.py::RequestsCookieJar.list_domains", "kind": "function", "name": "list_domains", "file": "src/requests/cookies.py", "lineno": 302, "end_lineno": 308, "language": "python", "docstring": "Utility method to list all the domains in the jar.", "source": "    def list_domains(self) -> list[str]:\n        \"\"\"Utility method to list all the domains in the jar.\"\"\"\n        domains: list[str] = []\n        for cookie in iter(self):\n            if cookie.domain not in domains:\n                domains.append(cookie.domain)\n        return domains"}, {"id": "src/requests/cookies.py::RequestsCookieJar.list_paths", "kind": "function", "name": "list_paths", "file": "src/requests/cookies.py", "lineno": 310, "end_lineno": 316, "language": "python", "docstring": "Utility method to list all the paths in the jar.", "source": "    def list_paths(self) -> list[str]:\n        \"\"\"Utility method to list all the paths in the jar.\"\"\"\n        paths: list[str] = []\n        for cookie in iter(self):\n            if cookie.path not in paths:\n                paths.append(cookie.path)\n        return paths"}, {"id": "src/requests/cookies.py::RequestsCookieJar.multiple_domains", "kind": "function", "name": "multiple_domains", "file": "src/requests/cookies.py", "lineno": 318, "end_lineno": 329, "language": "python", "docstring": "Returns True if there are multiple domains in the jar.\nReturns False otherwise.\n\n:rtype: bool", "source": "    def multiple_domains(self) -> bool:\n        \"\"\"Returns True if there are multiple domains in the jar.\n        Returns False otherwise.\n\n        :rtype: bool\n        \"\"\"\n        domains: list[str] = []\n        for cookie in iter(self):\n            if cookie.domain is not None and cookie.domain in domains:  # type: ignore[reportUnnecessaryComparison]  # defensive check\n                return True\n            domains.append(cookie.domain)\n        return False  # there is only one domain in jar"}, {"id": "src/requests/cookies.py::RequestsCookieJar.get_dict", "kind": "function", "name": "get_dict", "file": "src/requests/cookies.py", "lineno": 331, "end_lineno": 346, "language": "python", "docstring": "Takes as an argument an optional domain and path and returns a plain\nold Python dict of name-value pairs of cookies that meet the\nrequirements.\n\n:rtype: dict", "source": "    def get_dict(\n        self, domain: str | None = None, path: str | None = None\n    ) -> dict[str, str | None]:\n        \"\"\"Takes as an argument an optional domain and path and returns a plain\n        old Python dict of name-value pairs of cookies that meet the\n        requirements.\n\n        :rtype: dict\n        \"\"\"\n        dictionary: dict[str, str | None] = {}\n        for cookie in iter(self):\n            if (domain is None or cookie.domain == domain) and (\n                path is None or cookie.path == path\n            ):\n                dictionary[cookie.name] = cookie.value\n        return dictionary"}, {"id": "src/requests/cookies.py::RequestsCookieJar.__iter__", "kind": "function", "name": "__iter__", "file": "src/requests/cookies.py", "lineno": 348, "end_lineno": 350, "language": "python", "docstring": "RequestCookieJar's __iter__ comes from CookieJar not MutableMapping.", "source": "    def __iter__(self) -> Iterator[Cookie]:  # type: ignore[override]\n        \"\"\"RequestCookieJar's __iter__ comes from CookieJar not MutableMapping.\"\"\"\n        return super().__iter__()"}, {"id": "src/requests/cookies.py::RequestsCookieJar.__contains__", "kind": "function", "name": "__contains__", "file": "src/requests/cookies.py", "lineno": 352, "end_lineno": 356, "language": "python", "docstring": "", "source": "    def __contains__(self, name: object) -> bool:\n        try:\n            return super().__contains__(name)\n        except CookieConflictError:\n            return True"}, {"id": "src/requests/cookies.py::RequestsCookieJar.__getitem__", "kind": "function", "name": "__getitem__", "file": "src/requests/cookies.py", "lineno": 358, "end_lineno": 365, "language": "python", "docstring": "Dict-like __getitem__() for compatibility with client code. Throws\nexception if there are more than one cookie with name. In that case,\nuse the more explicit get() method instead.\n\n.. warning:: operation is O(n), not O(1).", "source": "    def __getitem__(self, name: str) -> str | None:\n        \"\"\"Dict-like __getitem__() for compatibility with client code. Throws\n        exception if there are more than one cookie with name. In that case,\n        use the more explicit get() method instead.\n\n        .. warning:: operation is O(n), not O(1).\n        \"\"\"\n        return self._find_no_duplicates(name)"}, {"id": "src/requests/cookies.py::RequestsCookieJar.__setitem__", "kind": "function", "name": "__setitem__", "file": "src/requests/cookies.py", "lineno": 367, "end_lineno": 374, "language": "python", "docstring": "Dict-like __setitem__ for compatibility with client code. Throws\nexception if there is already a cookie of that name in the jar. In that\ncase, use the more explicit set() method instead.", "source": "    def __setitem__(\n        self, name: str, value: str | Morsel[dict[str, str]] | None\n    ) -> None:\n        \"\"\"Dict-like __setitem__ for compatibility with client code. Throws\n        exception if there is already a cookie of that name in the jar. In that\n        case, use the more explicit set() method instead.\n        \"\"\"\n        self.set(name, value)"}, {"id": "src/requests/cookies.py::RequestsCookieJar.__delitem__", "kind": "function", "name": "__delitem__", "file": "src/requests/cookies.py", "lineno": 376, "end_lineno": 380, "language": "python", "docstring": "Deletes a cookie given a name. Wraps ``http.cookiejar.CookieJar``'s\n``remove_cookie_by_name()``.", "source": "    def __delitem__(self, name: str) -> None:\n        \"\"\"Deletes a cookie given a name. Wraps ``http.cookiejar.CookieJar``'s\n        ``remove_cookie_by_name()``.\n        \"\"\"\n        remove_cookie_by_name(self, name)"}, {"id": "src/requests/cookies.py::RequestsCookieJar.set_cookie", "kind": "function", "name": "set_cookie", "file": "src/requests/cookies.py", "lineno": 382, "end_lineno": 389, "language": "python", "docstring": "", "source": "    def set_cookie(self, cookie: Cookie, *args: Any, **kwargs: Any) -> None:\n        if (\n            (value := cookie.value) is not None\n            and value.startswith('\"')\n            and value.endswith('\"')\n        ):\n            cookie.value = value.replace('\\\\\"', \"\")\n        return super().set_cookie(cookie, *args, **kwargs)"}, {"id": "src/requests/cookies.py::RequestsCookieJar.update", "kind": "function", "name": "update", "file": "src/requests/cookies.py", "lineno": 391, "end_lineno": 399, "language": "python", "docstring": "Updates this jar with cookies from another CookieJar or dict-like", "source": "    def update(  # type: ignore[override]\n        self, other: CookieJar | SupportsKeysAndGetItem[str, str]\n    ) -> None:\n        \"\"\"Updates this jar with cookies from another CookieJar or dict-like\"\"\"\n        if isinstance(other, cookielib.CookieJar):\n            for cookie in other:\n                self.set_cookie(copy.copy(cookie))\n        else:\n            super().update(other)"}, {"id": "src/requests/cookies.py::RequestsCookieJar._find", "kind": "function", "name": "_find", "file": "src/requests/cookies.py", "lineno": 401, "end_lineno": 421, "language": "python", "docstring": "Requests uses this method internally to get cookie values.\n\nIf there are conflicting cookies, _find arbitrarily chooses one.\nSee _find_no_duplicates if you want an exception thrown if there are\nconflicting cookies.\n\n:param name: a string containing name of cookie\n:param domain: (optional) string containing domain of cookie\n:param path: (optional) string containing path of cookie\n:return: cookie.value", "source": "    def _find(\n        self, name: str, domain: str | None = None, path: str | None = None\n    ) -> str | None:\n        \"\"\"Requests uses this method internally to get cookie values.\n\n        If there are conflicting cookies, _find arbitrarily chooses one.\n        See _find_no_duplicates if you want an exception thrown if there are\n        conflicting cookies.\n\n        :param name: a string containing name of cookie\n        :param domain: (optional) string containing domain of cookie\n        :param path: (optional) string containing path of cookie\n        :return: cookie.value\n        \"\"\"\n        for cookie in iter(self):\n            if cookie.name == name:\n                if domain is None or cookie.domain == domain:\n                    if path is None or cookie.path == path:\n                        return cookie.value\n\n        raise KeyError(f\"name={name!r}, domain={domain!r}, path={path!r}\")"}, {"id": "src/requests/cookies.py::RequestsCookieJar._find_no_duplicates", "kind": "function", "name": "_find_no_duplicates", "file": "src/requests/cookies.py", "lineno": 423, "end_lineno": 452, "language": "python", "docstring": "Both ``__get_item__`` and ``get`` call this function: it's never\nused elsewhere in Requests.\n\n:param name: a string containing name of cookie\n:param domain: (optional) string containing domain of cookie\n:param path: (optional) string containing path of cookie\n:raises KeyError: if cookie is not found\n:raises CookieConflictError: if there are multiple cookies\n    that match name and optionally domain and path\n:return: cookie.value", "source": "    def _find_no_duplicates(\n        self, name: str, domain: str | None = None, path: str | None = None\n    ) -> str:\n        \"\"\"Both ``__get_item__`` and ``get`` call this function: it's never\n        used elsewhere in Requests.\n\n        :param name: a string containing name of cookie\n        :param domain: (optional) string containing domain of cookie\n        :param path: (optional) string containing path of cookie\n        :raises KeyError: if cookie is not found\n        :raises CookieConflictError: if there are multiple cookies\n            that match name and optionally domain and path\n        :return: cookie.value\n        \"\"\"\n        toReturn = None\n        for cookie in iter(self):\n            if cookie.name == name:\n                if domain is None or cookie.domain == domain:\n                    if path is None or cookie.path == path:\n                        if toReturn is not None:\n                            # if there are multiple cookies that meet passed in criteria\n                            raise CookieConflictError(\n                                f\"There are multiple cookies with name, {name!r}\"\n                            )\n                        # we will eventually return this as long as no cookie conflict\n                        toReturn = cookie.value\n\n        if toReturn is not None:\n            return toReturn\n        raise KeyError(f\"name={name!r}, domain={domain!r}, path={path!r}\")"}, {"id": "src/requests/cookies.py::RequestsCookieJar.__getstate__", "kind": "function", "name": "__getstate__", "file": "src/requests/cookies.py", "lineno": 454, "end_lineno": 459, "language": "python", "docstring": "Unlike a normal CookieJar, this class is pickleable.", "source": "    def __getstate__(self) -> dict[str, Any]:\n        \"\"\"Unlike a normal CookieJar, this class is pickleable.\"\"\"\n        state = self.__dict__.copy()\n        # remove the unpickleable RLock object\n        state.pop(\"_cookies_lock\")\n        return state"}, {"id": "src/requests/cookies.py::RequestsCookieJar.__setstate__", "kind": "function", "name": "__setstate__", "file": "src/requests/cookies.py", "lineno": 461, "end_lineno": 465, "language": "python", "docstring": "Unlike a normal CookieJar, this class is pickleable.", "source": "    def __setstate__(self, state: dict[str, Any]) -> None:\n        \"\"\"Unlike a normal CookieJar, this class is pickleable.\"\"\"\n        self.__dict__.update(state)\n        if \"_cookies_lock\" not in self.__dict__:\n            self._cookies_lock = threading.RLock()"}, {"id": "src/requests/cookies.py::RequestsCookieJar.copy", "kind": "function", "name": "copy", "file": "src/requests/cookies.py", "lineno": 467, "end_lineno": 472, "language": "python", "docstring": "Return a copy of this RequestsCookieJar.", "source": "    def copy(self) -> RequestsCookieJar:\n        \"\"\"Return a copy of this RequestsCookieJar.\"\"\"\n        new_cj = RequestsCookieJar()\n        new_cj.set_policy(self.get_policy())\n        new_cj.update(self)\n        return new_cj"}, {"id": "src/requests/cookies.py::RequestsCookieJar.get_policy", "kind": "function", "name": "get_policy", "file": "src/requests/cookies.py", "lineno": 474, "end_lineno": 476, "language": "python", "docstring": "Return the CookiePolicy instance used.", "source": "    def get_policy(self) -> CookiePolicy:\n        \"\"\"Return the CookiePolicy instance used.\"\"\"\n        return self._policy"}, {"id": "src/requests/cookies.py::_copy_cookie_jar", "kind": "function", "name": "_copy_cookie_jar", "file": "src/requests/cookies.py", "lineno": 479, "end_lineno": 491, "language": "python", "docstring": "", "source": "def _copy_cookie_jar(jar: CookieJar | None) -> CookieJar | None:  # type: ignore[reportUnusedFunction]  # cross-module usage in models.py\n    if jar is None:\n        return None\n\n    if copy_method := getattr(jar, \"copy\", None):\n        # We're dealing with an instance of RequestsCookieJar\n        return copy_method()\n    # We're dealing with a generic CookieJar instance\n    new_jar = copy.copy(jar)\n    new_jar.clear()\n    for cookie in jar:\n        new_jar.set_cookie(copy.copy(cookie))\n    return new_jar"}, {"id": "src/requests/cookies.py::create_cookie", "kind": "function", "name": "create_cookie", "file": "src/requests/cookies.py", "lineno": 494, "end_lineno": 528, "language": "python", "docstring": "Make a cookie from underspecified parameters.\n\nBy default, the pair of `name` and `value` will be set for the domain ''\nand sent on every request (this is sometimes called a \"supercookie\").", "source": "def create_cookie(name: str, value: str, **kwargs: Any) -> Cookie:\n    \"\"\"Make a cookie from underspecified parameters.\n\n    By default, the pair of `name` and `value` will be set for the domain ''\n    and sent on every request (this is sometimes called a \"supercookie\").\n    \"\"\"\n    result: dict[str, Any] = {\n        \"version\": 0,\n        \"name\": name,\n        \"value\": value,\n        \"port\": None,\n        \"domain\": \"\",\n        \"path\": \"/\",\n        \"secure\": False,\n        \"expires\": None,\n        \"discard\": True,\n        \"comment\": None,\n        \"comment_url\": None,\n        \"rest\": {\"HttpOnly\": None},\n        \"rfc2109\": False,\n    }\n\n    badargs = set(kwargs) - set(result)\n    if badargs:\n        raise TypeError(\n            f\"create_cookie() got unexpected keyword arguments: {list(badargs)}\"\n        )\n\n    result.update(kwargs)\n    result[\"port_specified\"] = bool(result[\"port\"])\n    result[\"domain_specified\"] = bool(result[\"domain\"])\n    result[\"domain_initial_dot\"] = result[\"domain\"].startswith(\".\")\n    result[\"path_specified\"] = bool(result[\"path\"])\n\n    return cookielib.Cookie(**result)"}, {"id": "src/requests/cookies.py::morsel_to_cookie", "kind": "function", "name": "morsel_to_cookie", "file": "src/requests/cookies.py", "lineno": 531, "end_lineno": 557, "language": "python", "docstring": "Convert a Morsel object into a Cookie containing the one k/v pair.", "source": "def morsel_to_cookie(morsel: Morsel[Any]) -> Cookie:\n    \"\"\"Convert a Morsel object into a Cookie containing the one k/v pair.\"\"\"\n\n    expires: int | None = None\n    if morsel[\"max-age\"]:\n        try:\n            expires = int(time.time() + int(morsel[\"max-age\"]))\n        except ValueError:\n            raise TypeError(f\"max-age: {morsel['max-age']} must be integer\")\n    elif morsel[\"expires\"]:\n        time_template = \"%a, %d-%b-%Y %H:%M:%S GMT\"\n        expires = calendar.timegm(time.strptime(morsel[\"expires\"], time_template))\n    return create_cookie(\n        comment=morsel[\"comment\"],\n        comment_url=bool(morsel[\"comment\"]),\n        discard=False,\n        domain=morsel[\"domain\"],\n        expires=expires,\n        name=morsel.key,\n        path=morsel[\"path\"],\n        port=None,\n        rest={\"HttpOnly\": morsel[\"httponly\"]},\n        rfc2109=False,\n        secure=bool(morsel[\"secure\"]),\n        value=morsel.value,\n        version=morsel[\"version\"] or 0,\n    )"}, {"id": "src/requests/cookies.py::cookiejar_from_dict", "kind": "function", "name": "cookiejar_from_dict", "file": "src/requests/cookies.py", "lineno": 579, "end_lineno": 601, "language": "python", "docstring": "Returns a CookieJar from a key/value dictionary.\n\n:param cookie_dict: Dict of key/values to insert into CookieJar.\n:param cookiejar: (optional) A cookiejar to add the cookies to.\n:param overwrite: (optional) If False, will not replace cookies\n    already in the jar with new ones.\n:rtype: CookieJar", "source": "def cookiejar_from_dict(\n    cookie_dict: dict[str, str] | None,\n    cookiejar: CookieJar | None = None,\n    overwrite: bool = True,\n) -> CookieJar:\n    \"\"\"Returns a CookieJar from a key/value dictionary.\n\n    :param cookie_dict: Dict of key/values to insert into CookieJar.\n    :param cookiejar: (optional) A cookiejar to add the cookies to.\n    :param overwrite: (optional) If False, will not replace cookies\n        already in the jar with new ones.\n    :rtype: CookieJar\n    \"\"\"\n    if cookiejar is None:\n        cookiejar = RequestsCookieJar()\n\n    if cookie_dict is not None:\n        names_from_jar = [cookie.name for cookie in cookiejar]\n        for name in cookie_dict:\n            if overwrite or (name not in names_from_jar):\n                cookiejar.set_cookie(create_cookie(name, cookie_dict[name]))\n\n    return cookiejar"}, {"id": "src/requests/cookies.py::merge_cookies", "kind": "function", "name": "merge_cookies", "file": "src/requests/cookies.py", "lineno": 604, "end_lineno": 625, "language": "python", "docstring": "Add cookies to cookiejar and returns a merged CookieJar.\n\n:param cookiejar: CookieJar object to add the cookies to.\n:param cookies: Dictionary or CookieJar object to be added.\n:rtype: CookieJar", "source": "def merge_cookies(\n    cookiejar: CookieJar, cookies: dict[str, str] | CookieJar | None\n) -> CookieJar:\n    \"\"\"Add cookies to cookiejar and returns a merged CookieJar.\n\n    :param cookiejar: CookieJar object to add the cookies to.\n    :param cookies: Dictionary or CookieJar object to be added.\n    :rtype: CookieJar\n    \"\"\"\n    if not isinstance(cookiejar, cookielib.CookieJar):  # runtime guard\n        raise ValueError(\"You can only merge into CookieJar\")\n\n    if isinstance(cookies, dict):\n        cookiejar = cookiejar_from_dict(cookies, cookiejar=cookiejar, overwrite=False)\n    elif isinstance(cookies, cookielib.CookieJar):\n        if update_method := getattr(cookiejar, \"update\", None):\n            update_method(cookies)\n        else:\n            for cookie_in_jar in cookies:\n                cookiejar.set_cookie(cookie_in_jar)\n\n    return cookiejar"}, {"id": "src/requests/exceptions.py", "kind": "module", "name": "src/requests/exceptions.py", "file": "src/requests/exceptions.py", "lineno": 1, "end_lineno": 162, "language": "python", "docstring": "requests.exceptions\n~~~~~~~~~~~~~~~~~~~\n\nThis module contains the set of Requests' exceptions.", "source": ""}, {"id": "src/requests/exceptions.py::RequestException", "kind": "class", "name": "RequestException", "file": "src/requests/exceptions.py", "lineno": 20, "end_lineno": 35, "language": "python", "docstring": "There was an ambiguous exception that occurred while handling your\nrequest.", "source": "class RequestException(IOError):\n    \"\"\"There was an ambiguous exception that occurred while handling your\n    request.\n    \"\"\"\n\n    response: Response | None\n    request: Request | PreparedRequest | None\n\n    def __init__(self, *args: Any, **kwargs: Any) -> None:\n        \"\"\"Initialize RequestException with `request` and `response` objects.\"\"\"\n        response: Response | None = kwargs.pop(\"response\", None)\n        self.response = response\n        self.request = kwargs.pop(\"request\", None)\n        if response is not None and not self.request and hasattr(response, \"request\"):\n            self.request = response.request\n        super().__init__(*args, **kwargs)"}, {"id": "src/requests/exceptions.py::RequestException.__init__", "kind": "function", "name": "__init__", "file": "src/requests/exceptions.py", "lineno": 28, "end_lineno": 35, "language": "python", "docstring": "Initialize RequestException with `request` and `response` objects.", "source": "    def __init__(self, *args: Any, **kwargs: Any) -> None:\n        \"\"\"Initialize RequestException with `request` and `response` objects.\"\"\"\n        response: Response | None = kwargs.pop(\"response\", None)\n        self.response = response\n        self.request = kwargs.pop(\"request\", None)\n        if response is not None and not self.request and hasattr(response, \"request\"):\n            self.request = response.request\n        super().__init__(*args, **kwargs)"}, {"id": "src/requests/exceptions.py::InvalidJSONError", "kind": "class", "name": "InvalidJSONError", "file": "src/requests/exceptions.py", "lineno": 38, "end_lineno": 39, "language": "python", "docstring": "A JSON error occurred.", "source": "class InvalidJSONError(RequestException):\n    \"\"\"A JSON error occurred.\"\"\""}, {"id": "src/requests/exceptions.py::JSONDecodeError", "kind": "class", "name": "JSONDecodeError", "file": "src/requests/exceptions.py", "lineno": 42, "end_lineno": 63, "language": "python", "docstring": "Couldn't decode the text into json", "source": "class JSONDecodeError(InvalidJSONError, CompatJSONDecodeError):\n    \"\"\"Couldn't decode the text into json\"\"\"\n\n    def __init__(self, *args: Any, **kwargs: Any) -> None:\n        \"\"\"\n        Construct the JSONDecodeError instance first with all\n        args. Then use it's args to construct the IOError so that\n        the json specific args aren't used as IOError specific args\n        and the error message from JSONDecodeError is preserved.\n        \"\"\"\n        CompatJSONDecodeError.__init__(self, *args)\n        InvalidJSONError.__init__(self, *self.args, **kwargs)\n\n    def __reduce__(self) -> tuple[Any, ...] | str:\n        \"\"\"\n        The __reduce__ method called when pickling the object must\n        be the one from the JSONDecodeError (be it json/simplejson)\n        as it expects all the arguments for instantiation, not just\n        one like the IOError, and the MRO would by default call the\n        __reduce__ method from the IOError due to the inheritance order.\n        \"\"\"\n        return CompatJSONDecodeError.__reduce__(self)"}, {"id": "src/requests/exceptions.py::JSONDecodeError.__init__", "kind": "function", "name": "__init__", "file": "src/requests/exceptions.py", "lineno": 45, "end_lineno": 53, "language": "python", "docstring": "Construct the JSONDecodeError instance first with all\nargs. Then use it's args to construct the IOError so that\nthe json specific args aren't used as IOError specific args\nand the error message from JSONDecodeError is preserved.", "source": "    def __init__(self, *args: Any, **kwargs: Any) -> None:\n        \"\"\"\n        Construct the JSONDecodeError instance first with all\n        args. Then use it's args to construct the IOError so that\n        the json specific args aren't used as IOError specific args\n        and the error message from JSONDecodeError is preserved.\n        \"\"\"\n        CompatJSONDecodeError.__init__(self, *args)\n        InvalidJSONError.__init__(self, *self.args, **kwargs)"}, {"id": "src/requests/exceptions.py::JSONDecodeError.__reduce__", "kind": "function", "name": "__reduce__", "file": "src/requests/exceptions.py", "lineno": 55, "end_lineno": 63, "language": "python", "docstring": "The __reduce__ method called when pickling the object must\nbe the one from the JSONDecodeError (be it json/simplejson)\nas it expects all the arguments for instantiation, not just\none like the IOError, and the MRO would by default call the\n__reduce__ method from the IOError due to the inheritance order.", "source": "    def __reduce__(self) -> tuple[Any, ...] | str:\n        \"\"\"\n        The __reduce__ method called when pickling the object must\n        be the one from the JSONDecodeError (be it json/simplejson)\n        as it expects all the arguments for instantiation, not just\n        one like the IOError, and the MRO would by default call the\n        __reduce__ method from the IOError due to the inheritance order.\n        \"\"\"\n        return CompatJSONDecodeError.__reduce__(self)"}, {"id": "src/requests/exceptions.py::HTTPError", "kind": "class", "name": "HTTPError", "file": "src/requests/exceptions.py", "lineno": 66, "end_lineno": 67, "language": "python", "docstring": "An HTTP error occurred.", "source": "class HTTPError(RequestException):\n    \"\"\"An HTTP error occurred.\"\"\""}, {"id": "src/requests/exceptions.py::ConnectionError", "kind": "class", "name": "ConnectionError", "file": "src/requests/exceptions.py", "lineno": 70, "end_lineno": 71, "language": "python", "docstring": "A Connection error occurred.", "source": "class ConnectionError(RequestException):\n    \"\"\"A Connection error occurred.\"\"\""}, {"id": "src/requests/exceptions.py::ProxyError", "kind": "class", "name": "ProxyError", "file": "src/requests/exceptions.py", "lineno": 74, "end_lineno": 75, "language": "python", "docstring": "A proxy error occurred.", "source": "class ProxyError(ConnectionError):\n    \"\"\"A proxy error occurred.\"\"\""}, {"id": "src/requests/exceptions.py::SSLError", "kind": "class", "name": "SSLError", "file": "src/requests/exceptions.py", "lineno": 78, "end_lineno": 79, "language": "python", "docstring": "An SSL error occurred.", "source": "class SSLError(ConnectionError):\n    \"\"\"An SSL error occurred.\"\"\""}, {"id": "src/requests/exceptions.py::Timeout", "kind": "class", "name": "Timeout", "file": "src/requests/exceptions.py", "lineno": 82, "end_lineno": 88, "language": "python", "docstring": "The request timed out.\n\nCatching this error will catch both\n:exc:`~requests.exceptions.ConnectTimeout` and\n:exc:`~requests.exceptions.ReadTimeout` errors.", "source": "class Timeout(RequestException):\n    \"\"\"The request timed out.\n\n    Catching this error will catch both\n    :exc:`~requests.exceptions.ConnectTimeout` and\n    :exc:`~requests.exceptions.ReadTimeout` errors.\n    \"\"\""}, {"id": "src/requests/exceptions.py::ConnectTimeout", "kind": "class", "name": "ConnectTimeout", "file": "src/requests/exceptions.py", "lineno": 91, "end_lineno": 95, "language": "python", "docstring": "The request timed out while trying to connect to the remote server.\n\nRequests that produced this error are safe to retry.", "source": "class ConnectTimeout(ConnectionError, Timeout):\n    \"\"\"The request timed out while trying to connect to the remote server.\n\n    Requests that produced this error are safe to retry.\n    \"\"\""}, {"id": "src/requests/exceptions.py::ReadTimeout", "kind": "class", "name": "ReadTimeout", "file": "src/requests/exceptions.py", "lineno": 98, "end_lineno": 99, "language": "python", "docstring": "The server did not send any data in the allotted amount of time.", "source": "class ReadTimeout(Timeout):\n    \"\"\"The server did not send any data in the allotted amount of time.\"\"\""}, {"id": "src/requests/exceptions.py::URLRequired", "kind": "class", "name": "URLRequired", "file": "src/requests/exceptions.py", "lineno": 102, "end_lineno": 103, "language": "python", "docstring": "A valid URL is required to make a request.", "source": "class URLRequired(RequestException):\n    \"\"\"A valid URL is required to make a request.\"\"\""}, {"id": "src/requests/exceptions.py::TooManyRedirects", "kind": "class", "name": "TooManyRedirects", "file": "src/requests/exceptions.py", "lineno": 106, "end_lineno": 107, "language": "python", "docstring": "Too many redirects.", "source": "class TooManyRedirects(RequestException):\n    \"\"\"Too many redirects.\"\"\""}, {"id": "src/requests/exceptions.py::MissingSchema", "kind": "class", "name": "MissingSchema", "file": "src/requests/exceptions.py", "lineno": 110, "end_lineno": 111, "language": "python", "docstring": "The URL scheme (e.g. http or https) is missing.", "source": "class MissingSchema(RequestException, ValueError):\n    \"\"\"The URL scheme (e.g. http or https) is missing.\"\"\""}, {"id": "src/requests/exceptions.py::InvalidSchema", "kind": "class", "name": "InvalidSchema", "file": "src/requests/exceptions.py", "lineno": 114, "end_lineno": 115, "language": "python", "docstring": "The URL scheme provided is either invalid or unsupported.", "source": "class InvalidSchema(RequestException, ValueError):\n    \"\"\"The URL scheme provided is either invalid or unsupported.\"\"\""}, {"id": "src/requests/exceptions.py::InvalidURL", "kind": "class", "name": "InvalidURL", "file": "src/requests/exceptions.py", "lineno": 118, "end_lineno": 119, "language": "python", "docstring": "The URL provided was somehow invalid.", "source": "class InvalidURL(RequestException, ValueError):\n    \"\"\"The URL provided was somehow invalid.\"\"\""}, {"id": "src/requests/exceptions.py::InvalidHeader", "kind": "class", "name": "InvalidHeader", "file": "src/requests/exceptions.py", "lineno": 122, "end_lineno": 123, "language": "python", "docstring": "The header value provided was somehow invalid.", "source": "class InvalidHeader(RequestException, ValueError):\n    \"\"\"The header value provided was somehow invalid.\"\"\""}, {"id": "src/requests/exceptions.py::InvalidProxyURL", "kind": "class", "name": "InvalidProxyURL", "file": "src/requests/exceptions.py", "lineno": 126, "end_lineno": 127, "language": "python", "docstring": "The proxy URL provided is invalid.", "source": "class InvalidProxyURL(InvalidURL):\n    \"\"\"The proxy URL provided is invalid.\"\"\""}, {"id": "src/requests/exceptions.py::ChunkedEncodingError", "kind": "class", "name": "ChunkedEncodingError", "file": "src/requests/exceptions.py", "lineno": 130, "end_lineno": 131, "language": "python", "docstring": "The server declared chunked encoding but sent an invalid chunk.", "source": "class ChunkedEncodingError(RequestException):\n    \"\"\"The server declared chunked encoding but sent an invalid chunk.\"\"\""}, {"id": "src/requests/exceptions.py::ContentDecodingError", "kind": "class", "name": "ContentDecodingError", "file": "src/requests/exceptions.py", "lineno": 134, "end_lineno": 135, "language": "python", "docstring": "Failed to decode response content.", "source": "class ContentDecodingError(RequestException, BaseHTTPError):\n    \"\"\"Failed to decode response content.\"\"\""}, {"id": "src/requests/exceptions.py::StreamConsumedError", "kind": "class", "name": "StreamConsumedError", "file": "src/requests/exceptions.py", "lineno": 138, "end_lineno": 139, "language": "python", "docstring": "The content for this response was already consumed.", "source": "class StreamConsumedError(RequestException, TypeError):\n    \"\"\"The content for this response was already consumed.\"\"\""}, {"id": "src/requests/exceptions.py::RetryError", "kind": "class", "name": "RetryError", "file": "src/requests/exceptions.py", "lineno": 142, "end_lineno": 143, "language": "python", "docstring": "Custom retries logic failed", "source": "class RetryError(RequestException):\n    \"\"\"Custom retries logic failed\"\"\""}, {"id": "src/requests/exceptions.py::UnrewindableBodyError", "kind": "class", "name": "UnrewindableBodyError", "file": "src/requests/exceptions.py", "lineno": 146, "end_lineno": 147, "language": "python", "docstring": "Requests encountered an error when trying to rewind a body.", "source": "class UnrewindableBodyError(RequestException):\n    \"\"\"Requests encountered an error when trying to rewind a body.\"\"\""}, {"id": "src/requests/exceptions.py::RequestsWarning", "kind": "class", "name": "RequestsWarning", "file": "src/requests/exceptions.py", "lineno": 153, "end_lineno": 154, "language": "python", "docstring": "Base warning for Requests.", "source": "class RequestsWarning(Warning):\n    \"\"\"Base warning for Requests.\"\"\""}, {"id": "src/requests/exceptions.py::FileModeWarning", "kind": "class", "name": "FileModeWarning", "file": "src/requests/exceptions.py", "lineno": 157, "end_lineno": 158, "language": "python", "docstring": "A file was opened in text mode, but Requests determined its binary length.", "source": "class FileModeWarning(RequestsWarning, DeprecationWarning):\n    \"\"\"A file was opened in text mode, but Requests determined its binary length.\"\"\""}, {"id": "src/requests/exceptions.py::RequestsDependencyWarning", "kind": "class", "name": "RequestsDependencyWarning", "file": "src/requests/exceptions.py", "lineno": 161, "end_lineno": 162, "language": "python", "docstring": "An imported dependency doesn't match the expected version range.", "source": "class RequestsDependencyWarning(RequestsWarning):\n    \"\"\"An imported dependency doesn't match the expected version range.\"\"\""}, {"id": "src/requests/help.py", "kind": "module", "name": "src/requests/help.py", "file": "src/requests/help.py", "lineno": 1, "end_lineno": 132, "language": "python", "docstring": "Module containing bug report helper(s).", "source": ""}, {"id": "src/requests/help.py::_implementation", "kind": "function", "name": "_implementation", "file": "src/requests/help.py", "lineno": 35, "end_lineno": 64, "language": "python", "docstring": "Return a dict with the Python implementation and version.\n\nProvide both the name and the version of the Python implementation\ncurrently running. For example, on CPython 3.10.3 it will return\n{'name': 'CPython', 'version': '3.10.3'}.\n\nThis function works best on CPython and PyPy: in particular, it probably\ndoesn't work for Jython or IronPython. Future investigation should be done\nto work out the correct shape of the code for those platforms.", "source": "def _implementation():\n    \"\"\"Return a dict with the Python implementation and version.\n\n    Provide both the name and the version of the Python implementation\n    currently running. For example, on CPython 3.10.3 it will return\n    {'name': 'CPython', 'version': '3.10.3'}.\n\n    This function works best on CPython and PyPy: in particular, it probably\n    doesn't work for Jython or IronPython. Future investigation should be done\n    to work out the correct shape of the code for those platforms.\n    \"\"\"\n    implementation = platform.python_implementation()\n\n    if implementation == \"CPython\":\n        implementation_version = platform.python_version()\n    elif implementation == \"PyPy\":\n        pypy = sys.pypy_version_info  # type: ignore[attr-defined]\n        implementation_version = f\"{pypy.major}.{pypy.minor}.{pypy.micro}\"  # pyright: ignore[reportUnknownMemberType]\n        if sys.pypy_version_info.releaselevel != \"final\":  # type: ignore[attr-defined]\n            implementation_version = \"\".join(\n                [implementation_version, sys.pypy_version_info.releaselevel]  # type: ignore[attr-defined]\n            )\n    elif implementation == \"Jython\":\n        implementation_version = platform.python_version()  # Complete Guess\n    elif implementation == \"IronPython\":\n        implementation_version = platform.python_version()  # Complete Guess\n    else:\n        implementation_version = \"Unknown\"\n\n    return {\"name\": implementation, \"version\": implementation_version}"}, {"id": "src/requests/help.py::info", "kind": "function", "name": "info", "file": "src/requests/help.py", "lineno": 67, "end_lineno": 123, "language": "python", "docstring": "Generate information for a bug report.", "source": "def info() -> dict[str, Any]:\n    \"\"\"Generate information for a bug report.\"\"\"\n    try:\n        platform_info = {\n            \"system\": platform.system(),\n            \"release\": platform.release(),\n        }\n    except OSError:\n        platform_info = {\n            \"system\": \"Unknown\",\n            \"release\": \"Unknown\",\n        }\n\n    implementation_info = _implementation()\n    urllib3_info = {\"version\": urllib3.__version__}\n    charset_normalizer_info = {\"version\": None}\n    chardet_info: dict[str, str | None] = {\"version\": None}\n    if charset_normalizer:\n        charset_normalizer_info = {\"version\": charset_normalizer.__version__}\n    if chardet:\n        chardet_info = {\"version\": chardet.__version__}\n\n    pyopenssl_info: dict[str, str | None] = {\n        \"version\": None,\n        \"openssl_version\": \"\",\n    }\n    if OpenSSL:\n        pyopenssl_info = {\n            \"version\": OpenSSL.__version__,\n            \"openssl_version\": f\"{OpenSSL.SSL.OPENSSL_VERSION_NUMBER:x}\",\n        }\n    cryptography_info = {\n        \"version\": getattr(cryptography, \"__version__\", \"\"),\n    }\n    idna_info = {\n        \"version\": getattr(idna, \"__version__\", \"\"),\n    }\n\n    system_ssl = ssl.OPENSSL_VERSION_NUMBER\n    system_ssl_info = {\"version\": f\"{system_ssl:x}\" if system_ssl is not None else \"\"}  # type: ignore[reportUnnecessaryComparison]\n\n    return {\n        \"platform\": platform_info,\n        \"implementation\": implementation_info,\n        \"system_ssl\": system_ssl_info,\n        \"using_pyopenssl\""}, {"id": "src/requests/help.py::main", "kind": "function", "name": "main", "file": "src/requests/help.py", "lineno": 126, "end_lineno": 128, "language": "python", "docstring": "Pretty-print the bug information as JSON.", "source": "def main():\n    \"\"\"Pretty-print the bug information as JSON.\"\"\"\n    print(json.dumps(info(), sort_keys=True, indent=2))"}, {"id": "src/requests/hooks.py", "kind": "module", "name": "src/requests/hooks.py", "file": "src/requests/hooks.py", "lineno": 1, "end_lineno": 48, "language": "python", "docstring": "requests.hooks\n~~~~~~~~~~~~~~\n\nThis module provides the capabilities for the Requests hooks system.\n\nAvailable hooks:\n\n``response``:\n    The response generated from a Request.", "source": ""}, {"id": "src/requests/hooks.py::default_hooks", "kind": "function", "name": "default_hooks", "file": "src/requests/hooks.py", "lineno": 25, "end_lineno": 26, "language": "python", "docstring": "", "source": "def default_hooks() -> dict[str, list[_t.HookType]]:\n    return {event: [] for event in HOOKS}"}, {"id": "src/requests/hooks.py::dispatch_hook", "kind": "function", "name": "dispatch_hook", "file": "src/requests/hooks.py", "lineno": 32, "end_lineno": 48, "language": "python", "docstring": "Dispatches a hook dictionary on a given piece of data.", "source": "def dispatch_hook(\n    key: str,\n    hooks: _t.HooksInputType | None,\n    hook_data: Response,\n    **kwargs: Any,\n) -> Response:\n    \"\"\"Dispatches a hook dictionary on a given piece of data.\"\"\"\n    hooks_dict = hooks or {}\n    hook_list: Iterable[_t.HookType] | _t.HookType | None = hooks_dict.get(key)\n    if hook_list:\n        if isinstance(hook_list, Callable):\n            hook_list = [hook_list]\n        for hook in hook_list:\n            _hook_data = hook(hook_data, **kwargs)\n            if _hook_data is not None:\n                hook_data = _hook_data\n    return hook_data"}, {"id": "src/requests/models.py", "kind": "module", "name": "src/requests/models.py", "file": "src/requests/models.py", "lineno": 1, "end_lineno": 1184, "language": "python", "docstring": "requests.models\n~~~~~~~~~~~~~~~\n\nThis module contains the primary objects that power Requests.", "source": ""}, {"id": "src/requests/models.py::RequestEncodingMixin", "kind": "class", "name": "RequestEncodingMixin", "file": "src/requests/models.py", "lineno": 108, "end_lineno": 251, "language": "python", "docstring": "", "source": "class RequestEncodingMixin:\n    url: str | None\n\n    @property\n    def path_url(self) -> str:\n        \"\"\"Build the path URL to use.\"\"\"\n\n        url: list[str] = []\n\n        p = urlsplit(cast(str, self.url))\n\n        path = p.path\n        if not path:\n            path = \"/\"\n\n        url.append(path)\n\n        query = p.query\n        if query:\n            url.append(\"?\")\n            url.append(query)\n\n        return \"\".join(url)\n\n    @overload\n    @staticmethod\n    def _encode_params(data: str) -> str: ...\n\n    @overload\n    @staticmethod\n    def _encode_params(data: bytes) -> bytes: ...\n\n    @overload\n    @staticmethod\n    def _encode_params(\n        data: _t.SupportsRead[str | bytes],\n    ) -> _t.SupportsRead[str | bytes]: ...\n\n    @overload\n    @staticmethod\n    def _encode_params(data: _t.KVDataType) -> str: ...\n\n    @staticmethod\n    def _encode_params(\n        data: _t.EncodableDataType,\n    ) -> str | bytes | _t.SupportsRead[str | bytes]:\n        \"\"\"Encode parameters in a piece of data.\n\n        Will successfully encode parameters when passed as a dict or a list of\n        2-tuples. Order is retained if data is a list of 2-tuples but arbitrary\n        if parameters are supplied as a dict.\n        \"\"\"\n\n        if isinstance(data, (str, bytes)):\n            return data\n        elif _t.has_read(data):\n            return data\n        elif hasattr(data, \"__iter__\"):\n            result: list[tuple[bytes, bytes]] = []\n            for k, vs in to_key_val_list(data):\n             "}, {"id": "src/requests/models.py::RequestEncodingMixin.path_url", "kind": "function", "name": "path_url", "file": "src/requests/models.py", "lineno": 112, "end_lineno": 130, "language": "python", "docstring": "Build the path URL to use.", "source": "    def path_url(self) -> str:\n        \"\"\"Build the path URL to use.\"\"\"\n\n        url: list[str] = []\n\n        p = urlsplit(cast(str, self.url))\n\n        path = p.path\n        if not path:\n            path = \"/\"\n\n        url.append(path)\n\n        query = p.query\n        if query:\n            url.append(\"?\")\n            url.append(query)\n\n        return \"\".join(url)"}, {"id": "src/requests/models.py::RequestEncodingMixin._encode_params", "kind": "function", "name": "_encode_params", "file": "src/requests/models.py", "lineno": 151, "end_lineno": 180, "language": "python", "docstring": "Encode parameters in a piece of data.\n\nWill successfully encode parameters when passed as a dict or a list of\n2-tuples. Order is retained if data is a list of 2-tuples but arbitrary\nif parameters are supplied as a dict.", "source": "    def _encode_params(\n        data: _t.EncodableDataType,\n    ) -> str | bytes | _t.SupportsRead[str | bytes]:\n        \"\"\"Encode parameters in a piece of data.\n\n        Will successfully encode parameters when passed as a dict or a list of\n        2-tuples. Order is retained if data is a list of 2-tuples but arbitrary\n        if parameters are supplied as a dict.\n        \"\"\"\n\n        if isinstance(data, (str, bytes)):\n            return data\n        elif _t.has_read(data):\n            return data\n        elif hasattr(data, \"__iter__\"):\n            result: list[tuple[bytes, bytes]] = []\n            for k, vs in to_key_val_list(data):\n                if isinstance(vs, basestring) or not hasattr(vs, \"__iter__\"):\n                    vs = [vs]\n                for v in vs:\n                    if v is not None:\n                        result.append(\n                            (\n                                k.encode(\"utf-8\") if isinstance(k, str) else k,\n                                v.encode(\"utf-8\") if isinstance(v, str) else v,\n                            )\n                        )\n            return urlencode(result, doseq=True)\n        else:\n            return data  # type: ignore[return-value]  # unreachable for valid _t.DataType"}, {"id": "src/requests/models.py::RequestEncodingMixin._encode_files", "kind": "function", "name": "_encode_files", "file": "src/requests/models.py", "lineno": 183, "end_lineno": 251, "language": "python", "docstring": "Build the body for a multipart/form-data request.\n\nWill successfully encode files when passed as a dict or a list of\ntuples. Order is retained if data is a list of tuples but arbitrary\nif parameters are supplied as a dict.\nThe tuples may be 2-tuples (filename, fileobj), 3-tuples (filename, fileobj, contentype)\nor 4-tuples (filename, fileobj, contentype, custom_headers).", "source": "    def _encode_files(\n        files: _t.FilesType, data: _t.RawDataType | None\n    ) -> tuple[bytes, str]:\n        \"\"\"Build the body for a multipart/form-data request.\n\n        Will successfully encode files when passed as a dict or a list of\n        tuples. Order is retained if data is a list of tuples but arbitrary\n        if parameters are supplied as a dict.\n        The tuples may be 2-tuples (filename, fileobj), 3-tuples (filename, fileobj, contentype)\n        or 4-tuples (filename, fileobj, contentype, custom_headers).\n        \"\"\"\n        if not files:\n            raise ValueError(\"Files must be provided.\")\n        elif isinstance(data, basestring):\n            raise ValueError(\"Data must not be a string.\")\n\n        new_fields: list[RequestField | tuple[str, bytes]] = []\n        fields = to_key_val_list(data or {})\n        files = to_key_val_list(files or {})\n\n        for field, val in fields:\n            if isinstance(val, basestring) or not hasattr(val, \"__iter__\"):\n                val = [val]\n            for v in val:\n                if v is not None:\n                    # Don't call str() on bytestrings: in Py3 it all goes wrong.\n                    if not isinstance(v, bytes):\n                        v = str(v)\n\n                    new_fields.append(\n                        (\n                            field.decode(\"utf-8\")\n                            if isinstance(field, bytes)\n                            else field,\n                            v.encode(\"utf-8\")"}, {"id": "src/requests/models.py::RequestHooksMixin", "kind": "class", "name": "RequestHooksMixin", "file": "src/requests/models.py", "lineno": 254, "end_lineno": 281, "language": "python", "docstring": "", "source": "class RequestHooksMixin:\n    hooks: dict[str, list[_t.HookType]]\n\n    def register_hook(\n        self, event: str, hook: Iterable[_t.HookType] | _t.HookType\n    ) -> None:\n        \"\"\"Properly register a hook.\"\"\"\n\n        if event not in self.hooks:\n            raise ValueError(f'Unsupported event specified, with event name \"{event}\"')\n\n        if isinstance(hook, Callable):\n            self.hooks[event].append(hook)\n        elif hasattr(hook, \"__iter__\"):\n            self.hooks[event].extend(\n                h for h in hook if isinstance(h, Callable)\n            )  # defensive runtime filter\n\n    def deregister_hook(self, event: str, hook: _t.HookType) -> bool:\n        \"\"\"Deregister a previously registered hook.\n        Returns True if the hook existed, False if not.\n        \"\"\"\n\n        try:\n            self.hooks[event].remove(hook)\n            return True\n        except ValueError:\n            return False"}, {"id": "src/requests/models.py::RequestHooksMixin.register_hook", "kind": "function", "name": "register_hook", "file": "src/requests/models.py", "lineno": 257, "end_lineno": 270, "language": "python", "docstring": "Properly register a hook.", "source": "    def register_hook(\n        self, event: str, hook: Iterable[_t.HookType] | _t.HookType\n    ) -> None:\n        \"\"\"Properly register a hook.\"\"\"\n\n        if event not in self.hooks:\n            raise ValueError(f'Unsupported event specified, with event name \"{event}\"')\n\n        if isinstance(hook, Callable):\n            self.hooks[event].append(hook)\n        elif hasattr(hook, \"__iter__\"):\n            self.hooks[event].extend(\n                h for h in hook if isinstance(h, Callable)\n            )  # defensive runtime filter"}, {"id": "src/requests/models.py::RequestHooksMixin.deregister_hook", "kind": "function", "name": "deregister_hook", "file": "src/requests/models.py", "lineno": 272, "end_lineno": 281, "language": "python", "docstring": "Deregister a previously registered hook.\nReturns True if the hook existed, False if not.", "source": "    def deregister_hook(self, event: str, hook: _t.HookType) -> bool:\n        \"\"\"Deregister a previously registered hook.\n        Returns True if the hook existed, False if not.\n        \"\"\"\n\n        try:\n            self.hooks[event].remove(hook)\n            return True\n        except ValueError:\n            return False"}, {"id": "src/requests/models.py::Request", "kind": "class", "name": "Request", "file": "src/requests/models.py", "lineno": 284, "end_lineno": 375, "language": "python", "docstring": "A user-created :class:`Request <Request>` object.\n\nUsed to prepare a :class:`PreparedRequest <PreparedRequest>`, which is sent to the server.\n\n:param method: HTTP method to use.\n:param url: URL to send.\n:param headers: dictionary of headers to send.\n:param files: dictionary of {filename: fileobject} files to multipart upload.\n:param data: the body to attach to the request. If a dictionary or\n    list of tuples ``[(key, value)]`` is provided, form-encoding will\n    take place.\n:param json: json for the body to attach to the request (if files or data is not specified).\n:param params: URL parameters to append to the URL. If a dictionary or\n    list of tuples ``[(key, value)]`` is provided, form-encoding will\n    take place.\n:param auth: Auth handler or (user, pass) tuple.\n:param cookies: dictionary or CookieJar of cookies to attach to this request.\n:param hooks: dictionary of callback hooks, for internal usage.\n\nUsage::\n\n  >>> import requests\n  >>> req = requests.Request('GET', 'https://httpbin.org/get')\n  >>> req.prepare()\n  <PreparedRequest [GET]>", "source": "class Request(RequestHooksMixin):\n    \"\"\"A user-created :class:`Request <Request>` object.\n\n    Used to prepare a :class:`PreparedRequest <PreparedRequest>`, which is sent to the server.\n\n    :param method: HTTP method to use.\n    :param url: URL to send.\n    :param headers: dictionary of headers to send.\n    :param files: dictionary of {filename: fileobject} files to multipart upload.\n    :param data: the body to attach to the request. If a dictionary or\n        list of tuples ``[(key, value)]`` is provided, form-encoding will\n        take place.\n    :param json: json for the body to attach to the request (if files or data is not specified).\n    :param params: URL parameters to append to the URL. If a dictionary or\n        list of tuples ``[(key, value)]`` is provided, form-encoding will\n        take place.\n    :param auth: Auth handler or (user, pass) tuple.\n    :param cookies: dictionary or CookieJar of cookies to attach to this request.\n    :param hooks: dictionary of callback hooks, for internal usage.\n\n    Usage::\n\n      >>> import requests\n      >>> req = requests.Request('GET', 'https://httpbin.org/get')\n      >>> req.prepare()\n      <PreparedRequest [GET]>\n    \"\"\"\n\n    hooks: dict[str, list[_t.HookType]]\n    method: str | None\n    url: _t.UriType | None\n    headers: Mapping[str, str | bytes]\n    files: _t.FilesType\n    data: _t.DataType\n    json: _t.JsonType\n    params: _t.ParamsType\n    auth: _t.AuthType\n    cookies: RequestsCookieJar | CookieJar | dict[str, str] | "}, {"id": "src/requests/models.py::Request.__init__", "kind": "function", "name": "__init__", "file": "src/requests/models.py", "lineno": 323, "end_lineno": 355, "language": "python", "docstring": "", "source": "    def __init__(\n        self,\n        method: str | None = None,\n        url: _t.UriType | None = None,\n        headers: _t.HeadersType = None,\n        files: _t.FilesType = None,\n        data: _t.DataType = None,\n        params: _t.ParamsType = None,\n        auth: _t.AuthType = None,\n        cookies: RequestsCookieJar | CookieJar | dict[str, str] | None = None,\n        hooks: _t.HooksInputType | None = None,\n        json: _t.JsonType = None,\n    ) -> None:\n        # Default empty dicts for dict params.\n        data = [] if data is None else data\n        files = [] if files is None else files\n        headers = {} if headers is None else headers\n        params = {} if params is None else params\n        hooks = {} if hooks is None else hooks\n\n        self.hooks = default_hooks()\n        for k, v in list(hooks.items()):\n            self.register_hook(event=k, hook=v)\n\n        self.method = method\n        self.url = url\n        self.headers = headers\n        self.files = files\n        self.data = data\n        self.json = json\n        self.params = params\n        self.auth = auth\n        self.cookies = cookies"}, {"id": "src/requests/models.py::Request.__repr__", "kind": "function", "name": "__repr__", "file": "src/requests/models.py", "lineno": 357, "end_lineno": 358, "language": "python", "docstring": "", "source": "    def __repr__(self) -> str:\n        return f\"<Request [{self.method}]>\""}, {"id": "src/requests/models.py::Request.prepare", "kind": "function", "name": "prepare", "file": "src/requests/models.py", "lineno": 360, "end_lineno": 375, "language": "python", "docstring": "Constructs a :class:`PreparedRequest <PreparedRequest>` for transmission and returns it.", "source": "    def prepare(self) -> PreparedRequest:\n        \"\"\"Constructs a :class:`PreparedRequest <PreparedRequest>` for transmission and returns it.\"\"\"\n        p = PreparedRequest()\n        p.prepare(\n            method=self.method,\n            url=self.url,\n            headers=self.headers,\n            files=self.files,\n            data=self.data,\n            json=self.json,\n            params=self.params,\n            auth=self.auth,\n            cookies=self.cookies,\n            hooks=self.hooks,\n        )\n        return p"}, {"id": "src/requests/models.py::PreparedRequest", "kind": "class", "name": "PreparedRequest", "file": "src/requests/models.py", "lineno": 378, "end_lineno": 729, "language": "python", "docstring": "The fully mutable :class:`PreparedRequest <PreparedRequest>` object,\ncontaining the exact bytes that will be sent to the server.\n\nInstances are generated from a :class:`Request <Request>` object, and\nshould not be instantiated manually; doing so may produce undesirable\neffects.\n\nUsage::\n\n  >>> import requests\n  >>> req = requests.Request('GET', 'https://httpbin.org/get')\n  >>> r = req.prepare()\n  >>> r\n  <PreparedRequest [GET]>\n\n  >>> s = requests.Session()\n  >>> s.send(r)\n  <Response [200]>", "source": "class PreparedRequest(RequestEncodingMixin, RequestHooksMixin):\n    \"\"\"The fully mutable :class:`PreparedRequest <PreparedRequest>` object,\n    containing the exact bytes that will be sent to the server.\n\n    Instances are generated from a :class:`Request <Request>` object, and\n    should not be instantiated manually; doing so may produce undesirable\n    effects.\n\n    Usage::\n\n      >>> import requests\n      >>> req = requests.Request('GET', 'https://httpbin.org/get')\n      >>> r = req.prepare()\n      >>> r\n      <PreparedRequest [GET]>\n\n      >>> s = requests.Session()\n      >>> s.send(r)\n      <Response [200]>\n    \"\"\"\n\n    method: str | None\n    url: str | None\n    headers: CaseInsensitiveDict[str | bytes]\n    _cookies: RequestsCookieJar | CookieJar | None\n    body: _t.BodyType\n    hooks: dict[str, list[_t.HookType]]\n    _body_position: int | object | None\n\n    def __init__(self) -> None:\n        #: HTTP verb to send to the server.\n        self.method = None\n        #: HTTP URL to send the request to.\n        self.url = None\n        #: dictionary of HTTP headers.\n        self.headers = None  # type: ignore[assignment]\n        # The `CookieJar` used to create the Cookie header will be stored here\n        # after prepare_cookies is called\n        self._cookies = None\n        #: request body to send to the server.\n        self.body = None\n        #: dictionary of callback hooks, for internal usage.\n        self.hooks = default_hooks()\n        #: integer denoting starting posit"}, {"id": "src/requests/models.py::PreparedRequest.__init__", "kind": "function", "name": "__init__", "file": "src/requests/models.py", "lineno": 407, "end_lineno": 422, "language": "python", "docstring": "", "source": "    def __init__(self) -> None:\n        #: HTTP verb to send to the server.\n        self.method = None\n        #: HTTP URL to send the request to.\n        self.url = None\n        #: dictionary of HTTP headers.\n        self.headers = None  # type: ignore[assignment]\n        # The `CookieJar` used to create the Cookie header will be stored here\n        # after prepare_cookies is called\n        self._cookies = None\n        #: request body to send to the server.\n        self.body = None\n        #: dictionary of callback hooks, for internal usage.\n        self.hooks = default_hooks()\n        #: integer denoting starting position of a readable file-like body.\n        self._body_position = None"}, {"id": "src/requests/models.py::PreparedRequest.prepare", "kind": "function", "name": "prepare", "file": "src/requests/models.py", "lineno": 424, "end_lineno": 451, "language": "python", "docstring": "Prepares the entire request with the given parameters.", "source": "    def prepare(\n        self,\n        method: str | None = None,\n        url: _t.UriType | None = None,\n        headers: Mapping[str, str | bytes] | None = None,\n        files: _t.FilesType = None,\n        data: _t.DataType = None,\n        params: _t.ParamsType = None,\n        auth: _t.AuthType = None,\n        cookies: RequestsCookieJar | CookieJar | dict[str, str] | None = None,\n        hooks: _t.HooksInputType | None = None,\n        json: _t.JsonType = None,\n    ) -> None:\n        \"\"\"Prepares the entire request with the given parameters.\"\"\"\n\n        url = cast(\"_t.UriType\", url)\n        self.prepare_method(method)\n        self.prepare_url(url, params)\n        self.prepare_headers(headers)\n        self.prepare_cookies(cookies)\n        self.prepare_body(data, files, json)\n        self.prepare_auth(auth, url)\n\n        # Note that prepare_auth must be last to enable authentication schemes\n        # such as OAuth to work on a fully prepared request.\n\n        # This MUST go after prepare_auth. Authenticators could add a hook\n        self.prepare_hooks(hooks)"}, {"id": "src/requests/models.py::PreparedRequest.__repr__", "kind": "function", "name": "__repr__", "file": "src/requests/models.py", "lineno": 453, "end_lineno": 454, "language": "python", "docstring": "", "source": "    def __repr__(self) -> str:\n        return f\"<PreparedRequest [{self.method}]>\""}, {"id": "src/requests/models.py::PreparedRequest.copy", "kind": "function", "name": "copy", "file": "src/requests/models.py", "lineno": 456, "end_lineno": 465, "language": "python", "docstring": "", "source": "    def copy(self) -> PreparedRequest:\n        p = PreparedRequest()\n        p.method = self.method\n        p.url = self.url\n        p.headers = self.headers.copy() if self.headers is not None else None  # type: ignore[assignment]\n        p._cookies = _copy_cookie_jar(self._cookies)\n        p.body = self.body\n        p.hooks = self.hooks\n        p._body_position = self._body_position\n        return p"}, {"id": "src/requests/models.py::PreparedRequest.prepare_method", "kind": "function", "name": "prepare_method", "file": "src/requests/models.py", "lineno": 467, "end_lineno": 471, "language": "python", "docstring": "Prepares the given HTTP method.", "source": "    def prepare_method(self, method: str | None) -> None:\n        \"\"\"Prepares the given HTTP method.\"\"\"\n        self.method = method\n        if self.method is not None:\n            self.method = to_native_string(self.method.upper())"}, {"id": "src/requests/models.py::PreparedRequest._get_idna_encoded_host", "kind": "function", "name": "_get_idna_encoded_host", "file": "src/requests/models.py", "lineno": 474, "end_lineno": 481, "language": "python", "docstring": "", "source": "    def _get_idna_encoded_host(host: str) -> str:\n        import idna\n\n        try:\n            host = idna.encode(host, uts46=True).decode(\"utf-8\")\n        except idna.IDNAError:\n            raise UnicodeError\n        return host"}, {"id": "src/requests/models.py::PreparedRequest.prepare_url", "kind": "function", "name": "prepare_url", "file": "src/requests/models.py", "lineno": 483, "end_lineno": 563, "language": "python", "docstring": "Prepares the given HTTP URL.", "source": "    def prepare_url(\n        self,\n        url: _t.UriType,\n        params: _t.ParamsType,\n    ) -> None:\n        \"\"\"Prepares the given HTTP URL.\"\"\"\n        #: Accept objects that have string representations.\n        #: We're unable to blindly call unicode/str functions\n        #: as this will include the bytestring indicator (b'')\n        #: on python 3.x.\n        #: https://github.com/psf/requests/pull/2238\n        if isinstance(url, bytes):\n            url = url.decode(\"utf8\")\n        else:\n            url = str(url)\n\n        # Remove leading whitespaces from url\n        url = url.lstrip()\n\n        # Don't do any URL preparation for non-HTTP schemes like `mailto`,\n        # `data` etc to work around exceptions from `url_parse`, which\n        # handles RFC 3986 only.\n        if \":\" in url and not url.lower().startswith(\"http\"):\n            self.url = url\n            return\n\n        # Support for unicode domain names and paths.\n        try:\n            scheme, auth, host, port, path, query, fragment = parse_url(url)\n        except LocationParseError as e:\n            raise InvalidURL(*e.args)\n\n        if not scheme:\n            raise MissingSchema(\n                f\"Invalid URL {url!r}: No scheme supplied. \"\n                f\"Perhaps you meant https://{url}?\"\n            )\n\n        if not host:\n            raise InvalidURL(f\"Invalid URL {url!r}: No host supplied\")\n\n        # In general, we want to try IDNA encoding the hostname if the string contains\n        # non-ASCII char"}, {"id": "src/requests/models.py::PreparedRequest.prepare_headers", "kind": "function", "name": "prepare_headers", "file": "src/requests/models.py", "lineno": 565, "end_lineno": 574, "language": "python", "docstring": "Prepares the given HTTP headers.", "source": "    def prepare_headers(self, headers: Mapping[str, str | bytes] | None) -> None:\n        \"\"\"Prepares the given HTTP headers.\"\"\"\n\n        self.headers = CaseInsensitiveDict()\n        if headers:\n            for header in headers.items():\n                # Raise exception on invalid header value.\n                check_header_validity(header)\n                name, value = header\n                self.headers[to_native_string(name)] = value"}, {"id": "src/requests/models.py::PreparedRequest.prepare_body", "kind": "function", "name": "prepare_body", "file": "src/requests/models.py", "lineno": 576, "end_lineno": 652, "language": "python", "docstring": "Prepares the given HTTP body data.", "source": "    def prepare_body(\n        self, data: _t.DataType, files: _t.FilesType, json: _t.JsonType = None\n    ) -> None:\n        \"\"\"Prepares the given HTTP body data.\"\"\"\n\n        # Check if file, fo, generator, iterator.\n        # If not, run through normal process.\n\n        # Nottin' on you.\n        body = None\n        content_type = None\n\n        if not data and json is not None:\n            # urllib3 requires a bytes-like body. Python 2's json.dumps\n            # provides this natively, but Python 3 gives a Unicode string.\n            content_type = \"application/json\"\n\n            try:\n                body = complexjson.dumps(json, allow_nan=False)\n            except ValueError as ve:\n                raise InvalidJSONError(ve, request=self)\n\n            if not isinstance(body, bytes):\n                body = body.encode(\"utf-8\")\n\n        # data that proxies attributes to underlying objects needs hasattr\n        is_iterable = isinstance(data, Iterable) or hasattr(data, \"__iter__\")\n        if is_iterable and not isinstance(data, (str, bytes, list, tuple, Mapping)):\n            try:\n                length = super_len(data)\n            except (TypeError, AttributeError, UnsupportedOperation):\n                length = None\n\n            body = data\n\n            if getattr(body, \"tell\", None) is not None:\n                # Record the current file position before reading.\n                # This will allow us to rewind a file in the event\n                # of a redirect.\n                "}, {"id": "src/requests/models.py::PreparedRequest.prepare_content_length", "kind": "function", "name": "prepare_content_length", "file": "src/requests/models.py", "lineno": 654, "end_lineno": 668, "language": "python", "docstring": "Prepare Content-Length header based on request method and body", "source": "    def prepare_content_length(self, body: _t.BodyType) -> None:\n        \"\"\"Prepare Content-Length header based on request method and body\"\"\"\n        if body is not None:\n            length = super_len(body)\n            if length:\n                # If length exists, set it. Otherwise, we fallback\n                # to Transfer-Encoding: chunked.\n                self.headers[\"Content-Length\"] = builtin_str(length)\n        elif (\n            self.method not in (\"GET\", \"HEAD\")\n            and self.headers.get(\"Content-Length\") is None\n        ):\n            # Set Content-Length to 0 for methods that can have a body\n            # but don't provide one. (i.e. not GET or HEAD)\n            self.headers[\"Content-Length\"] = \"0\""}, {"id": "src/requests/models.py::PreparedRequest.prepare_auth", "kind": "function", "name": "prepare_auth", "file": "src/requests/models.py", "lineno": 670, "end_lineno": 697, "language": "python", "docstring": "Prepares the given HTTP auth data.", "source": "    def prepare_auth(\n        self,\n        auth: _t.AuthType,\n        url: _t.UriType = \"\",\n    ) -> None:\n        \"\"\"Prepares the given HTTP auth data.\"\"\"\n\n        # If no Auth is explicitly provided, extract it from the URL first.\n        if auth is None:\n            url_auth = get_auth_from_url(cast(str, self.url))\n            auth = url_auth if any(url_auth) else None\n\n        if auth:\n            if isinstance(auth, tuple) and len(auth) == 2:  # type: ignore[arg-type]  # pyright widens tuple from Callable in AuthType\n                # special-case basic HTTP auth\n                auth_handler = HTTPBasicAuth(*auth)  # type: ignore[arg-type]  # pyright widens tuple from Callable in AuthType\n            else:\n                # TODO: can be fixed by flipping the conditionals\n                auth_handler = cast(\"Callable[..., PreparedRequest]\", auth)\n\n            # Allow auth to make its changes.\n            r = auth_handler(self)\n\n            # Update self to reflect the auth changes.\n            self.__dict__.update(r.__dict__)\n\n            # Recompute Content-Length\n            self.prepare_content_length(self.body)"}, {"id": "src/requests/models.py::PreparedRequest.prepare_cookies", "kind": "function", "name": "prepare_cookies", "file": "src/requests/models.py", "lineno": 699, "end_lineno": 720, "language": "python", "docstring": "Prepares the given HTTP cookie data.\n\nThis function eventually generates a ``Cookie`` header from the\ngiven cookies using cookielib. Due to cookielib's design, the header\nwill not be regenerated if it already exists, meaning this function\ncan only be called once for the life of the\n:class:`PreparedRequest <PreparedRequest>` object. Any subsequent calls\nto ``prepare_cookies`` will have no actual effect, unless the \"Cookie\"\nheader is removed beforehand.", "source": "    def prepare_cookies(\n        self, cookies: RequestsCookieJar | CookieJar | dict[str, str] | None\n    ) -> None:\n        \"\"\"Prepares the given HTTP cookie data.\n\n        This function eventually generates a ``Cookie`` header from the\n        given cookies using cookielib. Due to cookielib's design, the header\n        will not be regenerated if it already exists, meaning this function\n        can only be called once for the life of the\n        :class:`PreparedRequest <PreparedRequest>` object. Any subsequent calls\n        to ``prepare_cookies`` will have no actual effect, unless the \"Cookie\"\n        header is removed beforehand.\n        \"\"\"\n        if isinstance(cookies, cookielib.CookieJar):\n            self._cookies = cookies\n        else:\n            self._cookies = cookiejar_from_dict(cookies)\n\n        cookies_jar = cast(\"CookieJar\", self._cookies)\n        cookie_header = get_cookie_header(cookies_jar, self)\n        if cookie_header is not None:\n            self.headers[\"Cookie\"] = cookie_header"}, {"id": "src/requests/models.py::PreparedRequest.prepare_hooks", "kind": "function", "name": "prepare_hooks", "file": "src/requests/models.py", "lineno": 722, "end_lineno": 729, "language": "python", "docstring": "Prepares the given hooks.", "source": "    def prepare_hooks(self, hooks: _t.HooksInputType | None) -> None:\n        \"\"\"Prepares the given hooks.\"\"\"\n        # hooks can be passed as None to the prepare method and to this\n        # method. To prevent iterating over None, simply use an empty list\n        # if hooks is False-y\n        hooks = hooks or {}\n        for event in hooks:\n            self.register_hook(event, hooks[event])"}, {"id": "src/requests/models.py::Response", "kind": "class", "name": "Response", "file": "src/requests/models.py", "lineno": 732, "end_lineno": 1184, "language": "python", "docstring": "The :class:`Response <Response>` object, which contains a\nserver's response to an HTTP request.", "source": "class Response:\n    \"\"\"The :class:`Response <Response>` object, which contains a\n    server's response to an HTTP request.\n    \"\"\"\n\n    _content: bytes | Literal[False] | None\n    _content_consumed: bool\n    _next: PreparedRequest | None\n    status_code: int\n    headers: CaseInsensitiveDict[str]\n    raw: Any\n    url: str\n    encoding: str | None\n    history: list[Response]\n    reason: str\n    cookies: RequestsCookieJar\n    elapsed: datetime.timedelta\n    request: PreparedRequest\n    connection: HTTPAdapter\n\n    __attrs__: list[str] = [\n        \"_content\",\n        \"status_code\",\n        \"headers\",\n        \"url\",\n        \"history\",\n        \"encoding\",\n        \"reason\",\n        \"cookies\",\n        \"elapsed\",\n        \"request\",\n    ]\n\n    def __init__(self) -> None:\n        self._content = False\n        self._content_consumed = False\n        self._next = None\n\n        #: Integer Code of responded HTTP Status, e.g. 404 or 200.\n        self.status_code = None  # type: ignore[assignment]\n\n        #: Case-insensitive Dictionary of Response Headers.\n        #: For example, ``headers['content-encoding']`` will return the\n        #: value of a ``'Content-Encoding'`` response header.\n        self.headers = CaseInsensitiveDict()\n\n        #: File-like object representation of response (for advanced usage).\n        #: Use of ``raw`` requires that ``stream=True`` be set on the request.\n        #: This requirement does not apply for use internally to Requests.\n        self.raw = None\n\n        "}, {"id": "src/requests/models.py::Response.__init__", "kind": "function", "name": "__init__", "file": "src/requests/models.py", "lineno": 765, "end_lineno": 810, "language": "python", "docstring": "", "source": "    def __init__(self) -> None:\n        self._content = False\n        self._content_consumed = False\n        self._next = None\n\n        #: Integer Code of responded HTTP Status, e.g. 404 or 200.\n        self.status_code = None  # type: ignore[assignment]\n\n        #: Case-insensitive Dictionary of Response Headers.\n        #: For example, ``headers['content-encoding']`` will return the\n        #: value of a ``'Content-Encoding'`` response header.\n        self.headers = CaseInsensitiveDict()\n\n        #: File-like object representation of response (for advanced usage).\n        #: Use of ``raw`` requires that ``stream=True`` be set on the request.\n        #: This requirement does not apply for use internally to Requests.\n        self.raw = None\n\n        #: Final URL location of Response.\n        self.url = None  # type: ignore[assignment]\n\n        #: Encoding to decode with when accessing r.text.\n        self.encoding = None\n\n        #: A list of :class:`Response <Response>` objects from\n        #: the history of the Request. Any redirect responses will end\n        #: up here. The list is sorted from the oldest to the most recent request.\n        self.history = []\n\n        #: Textual reason of responded HTTP Status, e.g. \"Not Found\" or \"OK\".\n        self.reason = None  # type: ignore[assignment]\n\n        #: A CookieJar of Cookies the server sent back.\n        self.cookies = cookiejar_from_dict({})\n\n        #: The amount of time elapsed between sending the request\n        #: and t"}, {"id": "src/requests/models.py::Response.__enter__", "kind": "function", "name": "__enter__", "file": "src/requests/models.py", "lineno": 812, "end_lineno": 813, "language": "python", "docstring": "", "source": "    def __enter__(self) -> Self:\n        return self"}, {"id": "src/requests/models.py::Response.__exit__", "kind": "function", "name": "__exit__", "file": "src/requests/models.py", "lineno": 815, "end_lineno": 816, "language": "python", "docstring": "", "source": "    def __exit__(self, *args: Any) -> None:\n        self.close()"}, {"id": "src/requests/models.py::Response.__getstate__", "kind": "function", "name": "__getstate__", "file": "src/requests/models.py", "lineno": 818, "end_lineno": 824, "language": "python", "docstring": "", "source": "    def __getstate__(self) -> dict[str, Any]:\n        # Consume everything; accessing the content attribute makes\n        # sure the content has been fully read.\n        if not self._content_consumed:\n            self.content\n\n        return {attr: getattr(self, attr, None) for attr in self.__attrs__}"}, {"id": "src/requests/models.py::Response.__setstate__", "kind": "function", "name": "__setstate__", "file": "src/requests/models.py", "lineno": 826, "end_lineno": 832, "language": "python", "docstring": "", "source": "    def __setstate__(self, state: dict[str, Any]) -> None:\n        for name, value in state.items():\n            setattr(self, name, value)\n\n        # pickled objects do not have .raw\n        setattr(self, \"_content_consumed\", True)\n        setattr(self, \"raw\", None)"}, {"id": "src/requests/models.py::Response.__repr__", "kind": "function", "name": "__repr__", "file": "src/requests/models.py", "lineno": 834, "end_lineno": 835, "language": "python", "docstring": "", "source": "    def __repr__(self) -> str:\n        return f\"<Response [{self.status_code}]>\""}, {"id": "src/requests/models.py::Response.__bool__", "kind": "function", "name": "__bool__", "file": "src/requests/models.py", "lineno": 837, "end_lineno": 845, "language": "python", "docstring": "Returns True if :attr:`status_code` is less than 400.\n\nThis attribute checks if the status code of the response is between\n400 and 600 to see if there was a client error or a server error. If\nthe status code, is between 200 and 400, this will return True. This\nis **not** a check to see if the response code is ``200 OK``.", "source": "    def __bool__(self) -> bool:\n        \"\"\"Returns True if :attr:`status_code` is less than 400.\n\n        This attribute checks if the status code of the response is between\n        400 and 600 to see if there was a client error or a server error. If\n        the status code, is between 200 and 400, this will return True. This\n        is **not** a check to see if the response code is ``200 OK``.\n        \"\"\"\n        return self.ok"}, {"id": "src/requests/models.py::Response.__nonzero__", "kind": "function", "name": "__nonzero__", "file": "src/requests/models.py", "lineno": 847, "end_lineno": 855, "language": "python", "docstring": "Returns True if :attr:`status_code` is less than 400.\n\nThis attribute ch
